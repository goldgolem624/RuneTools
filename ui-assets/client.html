<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RuneTools client</title>
<!--
  RuneToolsX client page. Dock.cpp (inject_panel_scripts) assembles the page at load:
    1. the core stylesheet ui-assets/core/rtx.css replaces the rtx:css marker below (inline style block)
    2. the core scripts ui-assets/core/*.js are spliced in as script blocks, in this order, ahead of the script below:
         rtx-shim.js
         rtx-prefs.js
         rtx-ui.js
         rtx-registry.js
         rtx-skillbars.js
         rtx-bridge.js
         rtx-icons.js
         rtx-storage.js
         rtx-player.js
         rtx-wm.js
         rtx-notify.js
         rtx-settings.js
         rtx-input.js
         rtx-layout.js
         rtx-menubar.js
         rtx-pane.js
         rtx-plugins.js
    3. rtx_vars.js, then every panel_*.js (kFiles order in Dock.cpp)
    4. core/rtx-boot.js (refresh loop + attachBridge)
    5. the inline script below, which only starts the page.
  Every core file is a plain script: its top-level names are page globals shared with the panels.
  A core file may only reference, at its own top level, names declared by files spliced before it.
-->
<!-- rtx:css -->
</head>
<body>

<div id="desktop">
  <div id="menubar"></div>
  <div id="winlayer"></div>
  <div id="toaster"></div>
</div>
<script>
  attachBridge();
</script>
</body>
</html>
