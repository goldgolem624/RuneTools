<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RuneTools client</title>
<style>
  :root {
    --bg:           #0b0d12;
    --bg-elev:      #11141c;
    --bg-elev-2:    #161a25;
    --border:       #1f2433;
    --border-hi:    #2d3447;
    --text:         #eef0f5;
    --text-dim:     #aab0bf;
    --text-mute:    #6b7388;
    --accent-hi:    #8c6ffd;
    --accent-lo:    #6a4ee0;
    --ok:           #4dd28a;
    --tx-fast:      120ms;
    --ease:         cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    /* WebKit (Ultralight) honours the -webkit- prefix; the unprefixed form alone
       doesn't stop drag-selection in this engine. */
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  input, textarea, [contenteditable="true"] {
    -webkit-user-select: text; user-select: text;
  }

  /* Full-height left icon rail; header + content fill the right column. The host reveals the
       panel left-to-right, so collapsed shows exactly the rail. */
  #app {
    display: grid;
    grid-template-columns: 56px 1fr;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "rail header" "rail content";
    height: 100%;
  }

  header {
    grid-area: header;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(124,92,252,0.08), transparent);
  }
  header .title {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 14px;
  }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-mute);
    transition: background var(--tx-fast) var(--ease);
  }
  header .title.is-in .dot { background: var(--ok); }
  header .meta {
    font-size: 11px; color: var(--text-mute);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }

  main { grid-area: content; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  /* Content + header stay laid out when collapsed; the host clips the panel window to the rail
       (window-region clip via dockCollapse). body.side-collapsed only drives the chevron. */

  .sidebar {
    grid-area: rail;
    background: rgba(0,0,0,0.18);
    border-right: 1px solid var(--border);
    padding: 12px 8px;
    display: flex; flex-direction: column; gap: 6px;
    min-height: 0; overflow: hidden;
    /* Own compositing layer + paint containment: the CPU renderer otherwise smears the rail
       when an adjacent scroller repaints. Promote with will-change, NOT a real transform:
       a transform offsets CPU hit-testing so rail clicks land on the wrong icon. */
    will-change: transform;
    contain: paint;
  }
  .sidebar.collapsed { padding: 12px 6px; }
  .side-top { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none; }
  .side-collapse {
    appearance: none; background: transparent; border: none; color: var(--text-mute);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 8px; margin-right: auto;
    transition: background var(--tx-fast) var(--ease), color var(--tx-fast) var(--ease);
  }
  .side-collapse:hover { background: var(--bg-elev-2); color: var(--text); }
  .side-collapse:active { transform: scale(0.9); }
  .side-collapse svg { width: 17px; height: 17px; transition: transform 260ms var(--ease); transform: rotate(180deg); }
  body.side-collapsed .side-collapse svg { transform: none; }
  .sidebar.collapsed .side-collapse { margin: 0 auto; }
  .side-search svg { transform: none; }
  .side-list {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 3px;
  }
  /* Hidden scrollbar on the thin rail; wheel still scrolls. */
  .side-list::-webkit-scrollbar { width: 0; height: 0; }
  .rail-sep { height: 1px; margin: 7px 10px; background: var(--border); flex: none; }
  .tab.rail-back svg { color: var(--accent-hi); }
  .tab.rail-cat.is-active svg { color: var(--accent-hi); }
  .side-group {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-mute); padding: 10px 12px 4px; user-select: none; cursor: pointer;
  }
  .side-group:hover { color: var(--text-dim); }
  .grp-chev { width: 11px; height: 11px; flex: 0 0 11px; transition: transform 140ms var(--ease); }
  .side-group.collapsed .grp-chev { transform: rotate(-90deg); }
  .sidebar.collapsed .side-group { display: none; }
  .tab {
    appearance: none; background: transparent; border: none;
    color: var(--text-mute); text-align: left;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px;
    font: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer; position: relative;
    transition: background var(--tx-fast) var(--ease),
                color      var(--tx-fast) var(--ease);
  }
  .tab svg { width: 16px; height: 16px; flex: 0 0 16px; opacity: 0.85;
             transition: opacity var(--tx-fast) var(--ease), transform var(--tx-fast) var(--ease); }
  .tab .tab-label { line-height: 1; }
  .tab:hover { background: var(--bg-elev-2); color: var(--text); }
  .tab:hover svg { opacity: 1; }
  .tab.is-active {
    background: linear-gradient(90deg, rgba(124,92,252,0.22), rgba(124,92,252,0.08));
    color: #fff; font-weight: 600;
  }
  .tab.is-active svg { opacity: 1; color: var(--accent-hi); transform: scale(1.05); }
  .tab.is-active::before {
    content: ''; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 16px; border-radius: 2px; background: var(--accent-hi);
    transition: opacity 200ms var(--ease);
  }
  .sidebar.collapsed .tab { justify-content: center; padding: 9px 0; gap: 0; }
  .sidebar.collapsed .tab-label { display: none; }

  /* min-width: 0 is load-bearing: without it this flex child refuses to shrink below its
     widest descendant, so fixed-width content (metronome, clock) slides UNDER the rail. */
  .content { flex: 1; padding: 18px 22px; overflow-y: auto; overflow-x: hidden; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  @media (max-width: 380px) { .content { padding: 12px 12px; } }
  .pane    { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px;
  }
  .row .k {
    color: var(--text-mute);
    letter-spacing: 0.04em; text-transform: uppercase;
    font-size: 10px; font-weight: 600;
  }
  .row .v {
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .pane h2 {
    margin: 0 0 14px;
    font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.06em; text-transform: uppercase;
  }

  .empty {
    padding: 36px 0;
    text-align: center; color: var(--text-mute); font-size: 12px;
  }

  .scene-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .scene-hdr {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 4px 8px; min-width: 0;
    flex: 0 0 auto; padding-bottom: 8px; margin-bottom: 2px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .scene-hdr .cnt { color: var(--accent-hi); font-variant-numeric: tabular-nums; }
  .scene-range { display: flex; align-items: center; gap: 10px; padding: 8px 2px 2px; flex: 0 0 auto; flex-wrap: wrap; }
  .scene-range .lbl { color: var(--text-dim); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .scene-range input[type=range] { flex: 1; min-width: 90px; accent-color: var(--accent-hi); }
  .scene-range .val { color: var(--accent-hi); font-size: 11px; font-variant-numeric: tabular-nums; min-width: 54px; text-align: right; }
  .scene-int { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .scene-search { display: flex; align-items: center; gap: 10px; padding: 8px 2px 0; flex: 0 0 auto; }
  .scene-search .cnt { color: var(--accent-hi); font-size: 11px; font-variant-numeric: tabular-nums; flex: 0 0 auto; min-width: 34px; text-align: right; }
  .scene-pills { display: flex; align-items: center; justify-content: space-between; gap: 8px 20px; padding: 7px 2px 2px; flex: 0 0 auto; flex-wrap: wrap; }
  .scene-toggle {
    display: flex; gap: 2px; padding: 2px; min-width: 0;
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 7px;
  }
  .scene-toggle button {
    appearance: none; border: none; background: transparent; cursor: pointer;
    color: var(--text-mute); font: inherit; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
    padding: 3px 11px; border-radius: 5px;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: background var(--tx-fast) var(--ease), color var(--tx-fast) var(--ease);
  }
  @media (max-width: 380px) {
    .scene-toggle { flex: 1 1 100%; }
    .scene-toggle button { flex: 1 1 0; padding: 3px 4px; }
  }
  .scene-toggle button:hover { color: var(--text); }
  .scene-toggle button.is-active {
    background: linear-gradient(90deg, rgba(124,92,252,0.35), rgba(124,92,252,0.18));
    color: #fff;
  }
  .scene-list { flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px; }
  .scene-list::-webkit-scrollbar { width: 10px; }
  .scene-list::-webkit-scrollbar-track { background: transparent; }
  .scene-list::-webkit-scrollbar-thumb {
    background: var(--bg-elev-2); border-radius: 5px;
    border: 2px solid transparent; background-clip: padding-box;
  }
  .scene-list::-webkit-scrollbar-thumb:hover { background: var(--text-mute); background-clip: padding-box; }
  .scene-thead, .scene-trow {
    display: grid; grid-template-columns: 18px minmax(0,1fr) 30px 38px 80px;
    gap: 6px; align-items: center;
  }
  @media (max-width: 360px) {
    .scene-thead, .scene-trow { grid-template-columns: 18px minmax(0,1fr) 34px 78px; gap: 5px; }
    .scene-thead .h-lvl, .scene-trow .lvl { display: none; }
    .scene-trow .num, .scene-trow .tile { font-size: 10px; }
  }
  .scene-thead {
    position: sticky; top: 0; z-index: 1; background: var(--bg);
    color: var(--text-dim); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 2px 2px 6px; border-bottom: 1px solid var(--border);
  }
  .scene-thead .r { text-align: right; }
  .scene-trow { padding: 6px 2px; border-bottom: 1px solid rgba(255,255,255,0.045); }
  .scene-trow .namec { min-width: 0; }
  .scene-trow .nm { color: var(--text); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scene-trow .sub { color: var(--text-mute); font-size: 10px; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scene-trow .sub .act { color: var(--accent-hi); }
  .scene-trow .num { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
  .scene-trow .tile { color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .scene-trow .ol-btn {
    flex: 0 0 auto; width: 20px; height: 20px; margin-right: 4px; padding: 0;
    border: 1px solid var(--border); border-radius: 4px; background: transparent;
    color: var(--text-dim); font-size: 11px; line-height: 1; cursor: pointer;
    transition: border-color 140ms, color 140ms, background 140ms;
  }
  .scene-trow .ol-btn:hover { border-color: var(--accent); color: var(--accent-hi); }
  .scene-trow .ol-btn.on { border-color: var(--accent); color: #0c0f12; background: var(--accent); }
  .scene-trow .namet { display: flex; align-items: center; min-width: 0; }

  .ov-wrap { display: flex; flex-direction: column; padding: 6px 12px 6px 4px; gap: 2px; overflow-y: auto; flex: 1; min-height: 0; }
  .ov-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 8px; transition: background 140ms, opacity 140ms; }
  .ov-row[role=button] { cursor: pointer; }
  .ov-row[role=button]:hover { background: var(--bg-elev); }
  .ov-l { min-width: 0; }
  .ov-name { color: var(--text); font-size: 13px; }
  .ov-sub { color: var(--text-mute); font-size: 11px; margin-top: 1px; }
  .ov-sep { height: 1px; background: var(--border); margin: 6px 10px; }
  .ov-pill { width: 34px; height: 18px; border-radius: 9px; background: var(--border-hi); position: relative; flex: none; transition: background 160ms; }
  .ov-pill span { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left 160ms; }
  .ov-row.on .ov-pill { background: var(--accent-hi); }
  .ov-row.on .ov-pill span { left: 18px; }
  .ov-hint { color: var(--text-mute); font-size: 11px; padding: 10px 12px; line-height: 1.5; }
  .ov-slider { display: block; }
  .ov-slider .ov-srow { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .ov-slider .ov-sval { color: var(--accent-hi); font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .mk-grp { color: var(--accent-hi); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 12px 12px 4px; }
  .mk-kbrow { display: flex; align-items: center; justify-content: space-between; padding: 7px 12px; gap: 10px; }
  .mk-kbname { color: var(--text); font-size: 13px; }
  .mk-key { min-width: 84px; text-align: center; padding: 5px 10px; border-radius: 7px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text); font-size: 12px; cursor: pointer; transition: border-color 140ms, color 140ms; }
  .mk-key:hover { border-color: var(--border-hi); }
  .mk-key.capturing { border-color: var(--accent-hi); color: var(--accent-hi); }
  .mk-cur { padding: 6px 12px; color: var(--text); font-size: 12.5px; }
  .mk-cur b { color: var(--accent-hi); font-variant-numeric: tabular-nums; }
  .mk-btns { display: flex; gap: 8px; padding: 6px 12px; flex-wrap: wrap; }
  .mk-btn { padding: 6px 12px; border-radius: 7px; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text); font-size: 12px; cursor: pointer; transition: border-color 140ms; }
  .mk-btn:hover { border-color: var(--border-hi); }
  .mk-btn.accent { border-color: var(--accent-hi); color: var(--accent-hi); }
  .mk-list { display: flex; flex-direction: column; gap: 4px; padding: 2px 12px 4px; }
  .mk-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: var(--bg-elev); border: 1px solid var(--border); }
  .mk-sw { width: 18px; height: 18px; border-radius: 5px; flex: none; cursor: pointer; border: 1px solid rgba(255,255,255,.18); }
  .mk-lbl { flex: 1; min-width: 0; background: transparent; border: none; color: var(--text); font-size: 13px; outline: none; }
  .mk-lbl::placeholder { color: var(--text-mute); }
  .mk-co { color: var(--text-mute); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mk-del { width: 22px; height: 22px; border-radius: 6px; background: transparent; border: none; color: var(--text-mute); cursor: pointer; font-size: 16px; line-height: 1; flex: none; }
  .mk-del:hover { color: #e0564e; }
  .mk-pal { display: flex; gap: 6px; padding: 2px 12px 6px; flex-wrap: wrap; }
  .mk-pal .mk-sw.sel { outline: 2px solid var(--accent-hi); outline-offset: 1px; }
  .mk-share { width: calc(100% - 24px); margin: 2px 12px 8px; box-sizing: border-box; height: 52px; resize: vertical; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 11px; font-family: monospace; padding: 6px 8px; outline: none; }
  .mk-empty { color: var(--text-mute); font-size: 12px; padding: 6px 12px; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 18px; background: transparent; margin: 0; padding: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--border-hi); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px;
    border-radius: 50%; background: var(--accent-hi); border: 2px solid #0b0d12; cursor: pointer;
    box-shadow: 0 0 0 3px rgba(140,111,253,0.22); }
  .ov-slider input[type=range] { width: 100%; display: block; }

  .al-wrap { display: flex; flex-direction: column; padding: 10px 14px 14px; gap: 8px; overflow-y: auto; flex: 1; min-height: 0; }
  .al-master { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
  .al-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; transition: opacity 140ms; }
  .al-head { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .al-name { color: var(--text); font-size: 13px; }
  .al-desc { color: var(--text-mute); font-size: 11px; margin-top: 1px; }
  .al-ctl { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 16px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); transition: opacity 140ms; }
  .al-ctl .lab { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .al-flash { display: flex; align-items: center; gap: 7px; }
  .al-snd { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .al-play { appearance: none; border: none; background: transparent; color: var(--accent-hi); font-size: 13px; cursor: pointer; padding: 2px 4px; }
  .al-param { display: flex; align-items: center; gap: 6px; }
  .al-num { width: 60px; background: var(--bg-elev-2); border: 1px solid var(--border-hi); border-radius: 6px; color: var(--text); font: inherit; font-size: 12px; padding: 3px 6px; }
  .al-num:focus { outline: none; border-color: var(--accent-hi); }

  .pk-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .pk-list { flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px; }
  .pk-grp { color: var(--text-dim); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 2px 4px; }
  .pk-item { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
  .pk-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .pk-head-l { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .pk-icon { width: 32px; height: 32px; flex: none; background-color: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 6px; background-repeat: no-repeat; background-position: center; background-size: contain; image-rendering: -webkit-optimize-contrast; }
  .pk-name { color: var(--text); font-size: 13px; min-width: 0; line-height: 1.3; word-break: break-word; }
  .pk-lvl { color: var(--accent-hi); font-size: 11px; font-variant-numeric: tabular-nums; flex: none; padding-top: 1px; }
  .pk-giz { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .pk-giz .perk { color: var(--text); background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; font-size: 11px; line-height: 1.45; }
  .pk-none { color: var(--text-mute); font-size: 11px; font-style: italic; }
  .pk-xp { color: var(--text-dim); font-size: 10px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .bf-list { flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px; }
  .bf-grp { color: var(--text-dim); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 2px 4px; }
  .bf-row { display: flex; align-items: center; gap: 10px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; margin-bottom: 5px; }
  .bf-icon { width: 30px; height: 30px; flex: none; background-color: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 6px; background-repeat: no-repeat; background-position: center; background-size: contain; image-rendering: -webkit-optimize-contrast; }
  .bf-name { flex: 1; min-width: 0; color: var(--text); font-size: 13px; line-height: 1.3; word-break: break-word; }
  .bf-time { flex: none; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--accent-hi); }
  .bf-time.bf-static { color: var(--text-dim); font-weight: 400; }  /* count/percentage, not a countdown */
  .al-pill { width: 34px; height: 18px; border-radius: 9px; background: var(--border-hi); position: relative; flex: none; transition: background 160ms; cursor: pointer; }
  .al-pill span { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left 160ms; }
  .al-pill.on { background: var(--accent-hi); }
  .al-pill.on span { left: 18px; }
  .al-log { padding: 8px 10px 4px; }
  .al-log .ttl { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }

  .al-sect { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 14px 2px 4px; }

  .skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    grid-auto-rows: 1fr;
    gap: 5px;
    max-width: 100%;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .skill-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-top: 6px;
    flex: 0 0 auto;

  .skill-stat {
    display: flex; flex-direction: column; align-items: center; gap: 1px;

    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;

  .skill-stat .ss-virtual { color: var(--text-dim); font-size: 9.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: .02em; }
  .skill-cell {
    position: relative;
    display: flex; flex-direction: row;
    align-items: center; justify-content: center;
    gap: 6px;
    padding: 4px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .skill-cell .sk-icon {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 22px;
  }
  .skill-cell .sk-icon img { display: block; max-width: 100%; max-height: 100%; }
  .skill-cell .sk-val { color: var(--text); font-variant-numeric: tabular-nums; font-size: 11px; }
  .skill-cell.buffed  .sk-val { color: #4dd28a; }
  .skill-cell.drained .sk-val { color: #fc7c7c; }
  /* Per-skill goal bar. No width transition: the grid rebuilds every poll, so a transition
       would restart from 0 each time. Fill + spacer split the track by flex-grow ratios --
       Ultralight renders flex-grow reliably every rebuild, unlike a child % width / transform,
       which it intermittently resolves to 0. */
  .skill-cell .sk-goal { position: absolute; left: 5px; bottom: 4px; width: calc(100% - 10px); height: 5px;
    border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; display: flex; }
  .skill-cell .sk-goal-fill { height: 100%; flex: 0 0 0; min-width: 0; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent-lo), var(--accent-hi)); }
  .skill-cell .sk-goal-pad  { height: 100%; flex: 0 0 0; min-width: 0; }
  .skill-cell .sk-goal.done .sk-goal-fill { background: #4dd28a; }
  .skill-cell.has-goal { padding-bottom: 12px; }
  .skill-cell .sk-bonus { position: absolute; top: 2px; right: 3px; font-size: 8px; font-weight: 700;
    color: #4dd28a; background: rgba(77,210,138,0.14); border-radius: 5px; padding: 0 3px;
    line-height: 12px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .skill-stats .ss-bonus { color: #4dd28a; }

  .arch-unlocks { flex: 0 0 auto; margin-bottom: 8px; }

  /* Cells are squared off their column width via padding-bottom:100%; a definite
     container-height chain doesn't propagate reliably in Ultralight's WebKit. */
  .bank-grid {

    gap: 4px; align-content: start; flex: 0 0 auto;

    border-radius: 5px; overflow: hidden;

  .inv-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .inv-grid {
    /* minmax: tracks shrink below 52px on narrow panels; a fixed 4x52px grid clips its left
           column off-screen. */
    display: grid; grid-template-columns: repeat(4, minmax(36px, 52px));
    gap: 4px; align-content: center; justify-content: center;
    flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 6px; margin-top: 8px;
  }
  /* Icons render at native pixel size, downscale-only: the bundled icons are tightly cropped,
       so `contain` blows small items up. */

  .inv-grid .bank-amt { font-size: 13px; top: 3px; left: 4px; }
  .inv-grid::-webkit-scrollbar { width: 10px; }
  .inv-grid::-webkit-scrollbar-track { background: transparent; }

  .cont-empty { flex: 1; min-height: 0; display: none; align-items: center; justify-content: center; padding: 12px; color: var(--text-dim); font-size: 12px; }
  /* Equipment paperdoll: 3-wide grid mirroring the in-game screen; gear fits the slot
       (contain), unlike the native-size inventory. */
  .eq-grid {
    display: grid; grid-template-columns: repeat(3, minmax(40px, 54px)); gap: 8px;
    justify-content: center; align-content: start; flex: 0 0 auto; margin: auto;

  .eq-cell.eq-override::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px;

  /* Ultralight doesn't render native title= tooltips, and a CSS ::after gets clipped
     by parent overflow:hidden -- one fixed bubble on <body>, positioned by JS. */
  #global-tip {
    position: fixed;
    background: #0b0d12;
    border: 1px solid var(--border-hi);
    color: var(--text);
    font-size: 11px;
    line-height: 1.45;
    padding: 5px 9px;
    border-radius: 5px;
    white-space: pre-line;      /* honour \n for multi-line tooltips AND wrap long lines */
    max-width: 320px;
    max-height: calc(100vh - 16px);
    overflow: hidden;           /* pointer-events:none, so a scrollbar would be unusable anyway */
    text-align: left;
    pointer-events: none;
    opacity: 0;
    transform: translateX(-50%);
    transition: opacity 120ms var(--ease);
    z-index: 9999;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
  }

  // Compact gp formatting (20,099,750 -> "20.1m"); trailing ".0" stripped.
  function fmtGp(n) {
    n = Number(n) || 0;
    const sign = n < 0 ? '-' : ''; n = Math.abs(n);
    const f = (v, suf) => {
      let s = v.toFixed(1);
      if (s.endsWith('.0')) s = s.slice(0, -2);
      return sign + s + suf;
    };
    if (n >= 1e9) return f(n / 1e9, 'b');

  // RS3 combat level (post-Necromancy). Necromancy counts as its own style.
  function combatLevel(sk) {
    const L = i => (sk[i] ? sk[i][0] : 0);

    const def=L(1), hp=L(3), pray=L(5), summ=L(23);
    const styles = Math.max(att + str, 2*rng, 2*mag, 2*nec);
    const base = def + hp + Math.floor(pray/2) + Math.floor(summ/2);

  const SPRITE_QUEUE = [];
  let spriteDraining = false;
  const rafSchedule = (typeof requestAnimationFrame === 'function') ? requestAnimationFrame : (cb => setTimeout(cb, 16));
  const nowMs = () => ((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now());

  // No Node.isConnected guard: Ultralight doesn't implement it (undefined -> falsy
  // would skip every paint); styling a detached element is harmless.
  function setSpriteIcon(el, url) {
    if (!url || !el) return;
    el.style.backgroundImage = 'url("' + url + '")';
    el.style.backgroundSize = 'contain';
    el.style.backgroundRepeat = 'no-repeat';

  // side (pass ~2x the CSS box for a clean 2:1 in-browser rescale). Cached per (id,px);
  // an older bridge without the arg just serves the default-cap sprite.
  function loadSpriteIcon(el, id, px) {
    if (!id || id <= 0 || !el) return;
    const k = px ? (id + '|' + px) : id;
    if (SPRITES.has(k)) { setSpriteIcon(el, SPRITES.get(k)); return; }
    SPRITE_QUEUE.push([id, el, px || 0]);
    if (!spriteDraining) { spriteDraining = true; rafSchedule(drainSprites); }

  function drainSprites() {
    const t0 = nowMs();
    while (SPRITE_QUEUE.length && nowMs() - t0 < 8) {

      const k = px ? (id + '|' + px) : id;
      if (SPRITES.has(k)) { setSpriteIcon(el, SPRITES.get(k)); continue; }
      if (SPRITE_PENDING.has(k)) continue;
      let r = '';
      try { r = (bridge() && bridge().sprite) ? (px ? bridge().sprite(id, px) : bridge().sprite(id)) : ''; } catch (e) { r = ''; }
      if (r && typeof r.then === 'function') {     // async bridge: resolve out of band
        SPRITE_PENDING.add(k);
        r.then(u => { const url = (typeof u === 'string') ? u : ''; SPRITE_PENDING.delete(k); SPRITES.set(k, url); setSpriteIcon(el, url); },
               () => { SPRITE_PENDING.delete(k); SPRITES.set(k, ''); });
      } else {                                     // sync bridge: cache + paint now
        const url = (typeof r === 'string') ? r : '';
        SPRITES.set(k, url); setSpriteIcon(el, url);

  // Jagex markup support for tooltips, OPT-IN via data-tip-html="1" on the same node.
  // Game strings (ability descriptions etc.) carry <br> and <col=RRGGBB>..</col>.
  // The whole string is HTML-ESCAPED FIRST and only those two (already escaped) tags
  // are translated back -- so a panel can never inject arbitrary markup through a tip.
  function tipHtml(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/&lt;br&gt;/gi, '<br>')
      .replace(/&lt;col=([0-9a-fA-F]{6})&gt;/g, '<span style="color:#$1">')
      .replace(/&lt;\/col&gt;/gi, '</span>');

  function showTipFor(node) {
    const text = node.dataset.tip;
    if (!text) { hideTip(); return; }
    if (node.dataset.tipHtml === '1') tipEl.innerHTML = tipHtml(text);
    else tipEl.textContent = text;
    tipEl.style.opacity = '1';
    const r = node.getBoundingClientRect();
    // MEASURE AT THE ORIGIN FIRST. #global-tip is position:fixed with only `left` set, so its
    // shrink-to-fit width is capped at (viewport width - left). Measuring while it still sat at the
    // PREVIOUS position leaves a tooltip near the right edge only a sliver of room: it wraps into a
    // tall narrow column and reports that squeezed offsetWidth, which then feeds the clamp below.
    // Parking it at left:0 gives the full viewport to shrink-to-fit against, so the measurement is
    // the bubble's NATURAL width (bounded by its own max-width).
    tipEl.style.width = '';        // natural size for the measurement
    tipEl.style.left  = '0px';
    tipEl.style.top   = '0px';
    const tipW = tipEl.offsetWidth  || 0;
    const tipH = tipEl.offsetHeight || 24;
    // PIN the measured width before moving it. Otherwise the final `left` re-applies the same
    // shrink-to-fit cap and the bubble collapses again on the right-hand side -- parking at the
    // origin alone only fixes the measurement, not the render.
    tipEl.style.boxSizing = 'border-box';

    // A panel narrower than the bubble would make minCx > maxCx below, and since the max test runs
    // last the bubble would be shoved off the LEFT edge. Cap the width to the available space
    // instead so the clamp always has a valid range.
    const avail = Math.max(40, window.innerWidth - 2 * margin);
    const useW = Math.min(tipW, avail);
    tipEl.style.width = useW + 'px';

    // Clamp the centre so the (translateX(-50%)) bubble stays on screen.
    let cx = r.left + r.width / 2;
    const minCx = useW / 2 + margin;
    const maxCx = window.innerWidth - useW / 2 - margin;
    if (cx < minCx) cx = minCx;
    if (cx > maxCx) cx = maxCx;

    // the bottom. A bubble taller than the window is pinned to the top margin so at least its head
    // is visible; panels cap their own list lengths.
    let top = r.top - tipH - margin;
    if (top < margin) top = r.bottom + margin;
    if (top + tipH > window.innerHeight - margin) top = window.innerHeight - tipH - margin;
    if (top < margin) top = margin;

    tipEl.style.left = cx + 'px';

  const ICON_NAT = new Map();   // data-url -> {w,h} | null (not a decodable PNG)
  // Read width/height straight from the PNG IHDR (offsets 16/20, big-endian) of
  // the data URL -- synchronous + reliable, no Image() load race.
  function pngSize(url) {
    if (ICON_NAT.has(url)) return ICON_NAT.get(url);

      try {
        const bin = atob(url.slice(c + 1, c + 1 + 40));
        if (bin.length >= 24 && bin.charCodeAt(0) === 0x89) {
          const u = n => ((bin.charCodeAt(n) << 24 | bin.charCodeAt(n + 1) << 16 |

  function archUnlockState(it) {

  function pluginRateOk(id, method) {
    const cap = method.indexOf('storage.') === 0 ? 4 : (method.indexOf('overlay.') === 0 ? 6 : 20); // per second
    const k = id + '|' + method, now = Date.now();
    let b = pluginBuckets[k];
    if (!b) { b = { t: cap, ts: now }; pluginBuckets[k] = b; }
    b.t = Math.min(cap, b.t + ((now - b.ts) / 1000) * cap); b.ts = now;
    if (b.t < 1) return false;
    b.t -= 1; return true;
  }

  function pluginSendEvent(event, data) {
    const m = pluginMounted;
    if (!m || !m.frame || !m.frame.contentWindow) return;
    try { m.frame.contentWindow.postMessage({ __rtxPlugin: PLUGIN_PROTO, kind: 'event', event, data }, '*'); } catch (e) {}
  }

  // Push the host poll cadence to the mounted plugin (no free-polling in plugins).
  function pluginPush() {
    const m = pluginMounted;
    if (!m || !m.frame) return;
    pluginSendEvent('tick', null);
    if (m.scopes.indexOf('state.read') !== -1) pluginSendEvent('state', lastSnap);
  }

  function pluginBrokerInit() {
    window.addEventListener('message', async (ev) => {
      const m = ev.data;
      if (!m || m.__rtxPlugin !== PLUGIN_PROTO) return;
      const mounted = pluginMounted;
      // Only ever talk to the single mounted plugin frame.
      if (!mounted || !mounted.frame || ev.source !== mounted.frame.contentWindow) return;
      if (m.kind === 'hello') {
        pluginSendEvent('ready', { scopes: mounted.scopes, apiVersion: '1.0', pluginId: mounted.id });
        return;
      }
      if (m.kind !== 'call') return;
      const reply = (ok, payload) => {
        try {
          mounted.frame.contentWindow.postMessage({
            __rtxPlugin: PLUGIN_PROTO, kind: 'reply', id: m.id, ok,
            result: ok ? payload : undefined, error: ok ? undefined : String(payload)
          }, '*');
        } catch (e) {}
      };
      try {
        const def = PLUGIN_API[m.method];
        if (!def) return reply(false, 'unknown method');
        if (def.scope && mounted.scopes.indexOf(def.scope) === -1) return reply(false, 'scope not granted: ' + def.scope);
        if (!pluginRateOk(mounted.id, m.method)) return reply(false, 'rate limited');
        if (!bridge()) return reply(false, 'host unavailable');
        const args = Array.isArray(m.args) ? m.args : [];
        const raw = await def.run(args, myPid(), mounted.id, mounted.frame);
        let result = raw;
        if (def.json === true) { try { result = JSON.parse(raw); } catch (e) { result = null; } }
        else if (def.json === 'maybe') { try { result = raw ? JSON.parse(raw) : null; } catch (e) { result = null; } }
        reply(true, result);
      } catch (e) { reply(false, 'call failed'); }
    });
  }

  // Grants live in memory for the session (localStorage is unreliable in the
  // LoadHTML panel -- opaque origin throws), with localStorage as best-effort
  // cross-session persistence only.
  const pluginGrants = Object.create(null);
  function pluginGrantKey(id) { return 'rtxPluginGrant:' + id; }
  function pluginGetGranted(id) {
    if (pluginGrants[id]) return pluginGrants[id];
    try { const s = localStorage.getItem(pluginGrantKey(id)); if (s) { const v = JSON.parse(s); pluginGrants[id] = v; return v; } } catch (e) {}
    return null;
  }
  function pluginSetGranted(id, scopes) {
    pluginGrants[id] = scopes || [];
    try { localStorage.setItem(pluginGrantKey(id), JSON.stringify(scopes || [])); } catch (e) {}
  }
  function pluginClearGranted(id) {
    delete pluginGrants[id];
    try { localStorage.removeItem(pluginGrantKey(id)); } catch (e) {}
  }

  const PLUGIN_TAB_ICON = '<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><path d="M13.5 17h6.5M16.75 13.75v6.5"/>';
  const PLUGIN_BROWSE_ICON = '<circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4.2-4.2"/><path d="M11 8v6M8 11h6"/>';
  function allTabs() {
    const extra = [{ id: 'pluginbrowse', label: 'Browse plugins', cat: 'Plugins', icon: PLUGIN_BROWSE_ICON }];
    pluginTabs.forEach(p => extra.push({ id: 'plugin:' + p.id, label: p.manifest.name, cat: 'Plugins', icon: PLUGIN_TAB_ICON }));
    return TABS.filter(t => t.id !== 'dung' || DUNG_ENABLED).concat(extra);

  // Splice the host CSP + the SDK shim into the plugin's entry HTML head.
  function pluginBuildSrcdoc(entryHtml) {
    const csp = '<meta http-equiv="Content-Security-Policy" content="' +
      "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; " +
      "img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; " +
      "form-action 'none'; base-uri 'none'" + '">';
    const inject = csp + '<scr' + 'ipt>' + PLUGIN_SDK_SHIM + '</scr' + 'ipt>';
    let html = String(entryHtml || '');
    const head = html.match(/<head[^>]*>/i);
    if (head) { const i = head.index + head[0].length; return html.slice(0, i) + inject + html.slice(i); }
    const htm = html.match(/<html[^>]*>/i);
    if (htm) { const i = htm.index + htm[0].length; return html.slice(0, i) + '<head>' + inject + '</head>' + html.slice(i); }
    return '<!DOCTYPE html><html><head>' + inject + '</head><body>' + html + '</body></html>';
  }

  function renderPluginPermission(id, tab) {
    const c = $('content'); c.innerHTML = '';
    const m = tab.manifest;
    const card = document.createElement('div');
    card.dataset.pluginPerm = id;
    card.style.cssText = 'max-width:420px;margin:24px auto;background:#1a1b23;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:20px;';
    const labels = { 'state.read': 'Read your live game state', 'cache.read': 'Read game cache data (items, sprites, enums)', 'overlay': 'Draw overlays on the game', 'sound': 'Play alert sounds', 'storage': 'Store its own settings' };
    let h = '<div style="font-size:1.1em;font-weight:600;">' + pluginEsc(m.name) + '</div>';
    h += '<div style="color:#8b8b9e;font-size:.85em;margin:2px 0 6px;">v' + pluginEsc(m.version) + (m.author ? (' - ' + pluginEsc(m.author)) : '') + '</div>';
    if (tab.source === 'dev')
        h += '<div style="color:#e0b000;font-size:.8em;margin-bottom:12px;">Unsigned developer plugin - only enable plugins you trust.</div>';
    else
        h += '<div style="color:#34d399;font-size:.8em;margin-bottom:12px;">Verified - signed by RuneTools.</div>';
    if (m.description) h += '<div style="font-size:.9em;margin-bottom:12px;">' + pluginEsc(m.description) + '</div>';
    h += '<div style="font-size:.82em;color:#8b8b9e;margin-bottom:6px;">This plugin can:</div><ul style="margin:0 0 14px 18px;font-size:.88em;line-height:1.6;">';
    (tab.scopes.length ? tab.scopes : ['(no special access)']).forEach(s => { h += '<li>' + pluginEsc(labels[s] || s) + '</li>'; });
    h += '</ul>';
    card.innerHTML = h;
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;';
    const btn = document.createElement('button');
    btn.textContent = 'Enable plugin';
    btn.style.cssText = 'background:#7c5cfc;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-weight:600;cursor:pointer;';
    btn.addEventListener('click', () => { pluginSetGranted(id, tab.scopes); renderPlugin(id); });
    const deny = document.createElement('button');
    deny.textContent = 'Deny';
    deny.style.cssText = 'background:rgba(255,255,255,.06);color:#f0f0f5;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:9px 18px;font-weight:600;cursor:pointer;';
    deny.addEventListener('click', () => { pluginClearGranted(id); activeTab = 'pluginbrowse'; railCat = 'Plugins'; renderSidebar(); renderPane(); });
    row.appendChild(btn); row.appendChild(deny);
    card.appendChild(row);
    c.appendChild(card);
  }

  function renderPlugin(id) {
    const c = $('content');
    const tab = pluginTabs.find(p => p.id === id);
    if (!tab) { c.innerHTML = '<div class="empty">Plugin not found.</div>'; pluginMounted = null; return; }
    const granted = pluginGetGranted(id);
    if (!granted) {
      const cur = c.firstElementChild;
      if (cur && cur.dataset && cur.dataset.pluginPerm === id) return;   // build-once
      renderPluginPermission(id, tab); pluginMounted = null; return;
    }
    const cur = c.firstElementChild;
    if (cur && cur.dataset && cur.dataset.pluginHost === id) return;      // already mounted
    c.innerHTML = '';
    const wrap = document.createElement('div'); wrap.dataset.pluginHost = id;
    // Fill the panel area; the plugin scrolls inside itself. A plugin can opt into a
    // fixed height via rtx.plugin.ui.setHeight(px).
    wrap.style.cssText = 'padding:0;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;';
    const fr = document.createElement('iframe');
    fr.setAttribute('sandbox', 'allow-scripts');     // NO allow-same-origin -> opaque origin
    fr.setAttribute('referrerpolicy', 'no-referrer');
    fr.style.cssText = 'border:0;display:block;width:100%;flex:1 1 auto;min-height:0;background:#14151c;';
    wrap.appendChild(fr); c.appendChild(wrap);
    pluginMounted = { id, frame: fr, scopes: granted };
    (async () => {
      let entry = '';
      const entryFn = (tab.source === 'installed') ? bridge().pluginInstalledEntry : bridge().pluginDevEntry;
      try { entry = await entryFn.call(bridge(), id, tab.manifest.entry); } catch (e) {}
      if (!pluginMounted || pluginMounted.id !== id) return;             // tab switched while loading
      if (!entry) { c.innerHTML = '<div class="empty">Failed to load plugin entry file.</div>'; pluginMounted = null; return; }
      fr.srcdoc = pluginBuildSrcdoc(entry);
    })();
  }

  async function readPluginSet(listFn, manifestFn, source) {
    const out = [];
    let ids = [];
    try { ids = JSON.parse(await listFn.call(bridge())); } catch (e) { ids = []; }
    for (const id of (Array.isArray(ids) ? ids : [])) {
      let man = null;
      try { man = JSON.parse(await manifestFn.call(bridge(), id)); } catch (e) {}
      if (!man || man.rtxPluginManifest !== 1) continue;
      const scopes = Array.isArray(man.scopes) ? man.scopes.filter(s => PLUGIN_SCOPES.has(s)) : [];
      // Strip HTML-significant chars from author-supplied strings shown in host DOM.
      const clean = s => String(s == null ? '' : s).replace(/[<>&"']/g, '');
      const entry = (typeof man.entry === 'string' && man.entry && !/[\\/]|\.\./.test(man.entry)) ? man.entry : 'index.html';
      out.push({
        id, source,
        manifest: { id: clean(man.id).slice(0, 80) || id, name: clean(man.name).slice(0, 48) || id, version: clean(man.version).slice(0, 20), author: clean(man.author).slice(0, 60), entry, description: clean(man.description).slice(0, 280) },
        scopes
      });
    }
    return out;
  }

  async function loadPlugins() {
    if (!bridge()) return;
    const byId = {};
    if (bridge().pluginInstalledList) {
      const inst = await readPluginSet(bridge().pluginInstalledList, bridge().pluginInstalledManifest, 'installed');
      inst.forEach(p => { byId[p.id] = p; });
    }
    if (bridge().pluginDevList) {
      const dev = await readPluginSet(bridge().pluginDevList, bridge().pluginDevManifest, 'dev');
      dev.forEach(p => { if (!byId[p.id]) byId[p.id] = p; });   // installed wins over a dev copy
    }
    pluginTabs = Object.keys(byId).map(k => byId[k]);
    renderSidebar();
  }

  // ---- in-client marketplace (browse + install signed plugins) ----
  let pluginBrowseList = [];
  async function renderPluginBrowse() {
    const c = $('content');
    if (c.firstElementChild && c.firstElementChild.dataset && c.firstElementChild.dataset.pluginBrowse === '1') return; // build-once
    c.innerHTML = '';
    const wrap = document.createElement('div'); wrap.dataset.pluginBrowse = '1'; wrap.style.cssText = 'padding:4px;';
    wrap.innerHTML =
      '<div style="position:relative;margin-bottom:12px;">' +
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5a5a6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
        '<input id="pbSearch" type="text" placeholder="Search plugins..." autocomplete="off" style="width:100%;background:#14151c;border:1px solid rgba(255,255,255,0.1);border-radius:9px;padding:8px 12px 8px 32px;color:#f0f0f5;font-size:0.9em;outline:none;box-sizing:border-box;">' +
      '</div>' +
      '<div id="pbList"><div class="empty">Loading plugins...</div></div>';
    c.appendChild(wrap);
    const se = $('pbSearch'); if (se) se.addEventListener('input', renderBrowseList);
    try {
      const raw = JSON.parse(await bridge().pluginMarketList());
      const d = (raw && raw.data) ? raw.data : raw;
      pluginBrowseList = (d && d.plugins) || [];
    } catch (e) { pluginBrowseList = []; }
    renderBrowseList();
  }

  function renderBrowseList() {
    const host = $('pbList'); if (!host) return;
    const installed = new Set(pluginTabs.filter(p => p.source === 'installed').map(p => p.id));
    const q = (($('pbSearch') && $('pbSearch').value) || '').trim().toLowerCase();
    let list = pluginBrowseList.filter(p => !q ||
      ((p.name || '') + ' ' + (p.author || '') + ' ' + (p.slug || '') + ' ' + (p.description || '') + ' ' + (p.scopes || []).join(' ')).toLowerCase().includes(q));
    list.sort((a, b) => ((b.votes || 0) - (a.votes || 0)) || String(a.name || a.slug).localeCompare(String(b.name || b.slug)));
    host.innerHTML = '';
    if (!pluginBrowseList.length) { host.innerHTML = '<div class="empty">No plugins available yet.</div>'; return; }
    if (!list.length) { host.innerHTML = '<div class="empty">No plugins match your search.</div>'; return; }
    list.forEach(p => host.appendChild(pluginBrowseCard(p, installed.has(p.slug))));
  }

  function pluginBrowseCard(p, isInstalled) {
    const el = document.createElement('div');
    el.style.cssText = 'background:#1a1b23;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:12px 14px;margin-bottom:10px;';
    const scopes = (p.scopes || []).map(s => '<span style="background:rgba(124,92,252,0.12);color:#b9a6ff;border-radius:999px;padding:1px 8px;font-size:0.72em;margin-right:4px;">' + pluginEsc(s) + '</span>').join('');
    el.innerHTML =
      '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 10px;">' +
        '<div style="min-width:0;"><div style="font-weight:600;">' + pluginEsc(p.name) + '</div>' +
        '<div style="color:#8b8b9e;font-size:0.8em;">v' + pluginEsc(p.version) + (p.author ? (' - ' + pluginEsc(p.author)) : '') + '</div></div>' +
        '<div class="acts" style="display:flex;align-items:center;margin-left:auto;"></div></div>' +
      (p.description ? ('<div style="color:#c7c7d4;font-size:0.85em;margin:8px 0;">' + pluginEsc(p.description) + '</div>') : '') +
      (scopes ? ('<div style="margin-top:4px;">' + scopes + '</div>') : '');
    const acts = el.querySelector('.acts');

    // Read-only community score; voting is a logged-in website action, the client
    // runs account-less.
    if (typeof p.votes === 'number') {
      const sc = document.createElement('span');
      sc.title = 'Community score (vote on runetools.io)';
      sc.style.cssText = 'font-weight:700;font-size:0.82em;min-width:24px;text-align:center;margin-right:10px;color:' + (p.votes > 0 ? '#34d399' : (p.votes < 0 ? '#ef4444' : '#c7c7d4')) + ';';
      sc.textContent = (p.votes > 0 ? '+' : '') + (p.votes || 0);
      acts.appendChild(sc);
    }

    const details = document.createElement('button');
    details.textContent = 'Details';
    details.title = 'View source, author & details on runetools.io';
    details.style.cssText = 'border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#f0f0f5;border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;font-size:0.85em;margin-right:6px;';
    details.addEventListener('click', () => { try { bridge().openExternal('https://runetools.io/plugins/' + encodeURIComponent(p.slug)); } catch (e) {} });
    acts.appendChild(details);
    const btn = document.createElement('button');
    btn.style.cssText = 'border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:0.85em;';
    if (isInstalled) {
      btn.textContent = 'Uninstall';
      btn.style.background = 'rgba(239,68,68,0.15)'; btn.style.borderColor = 'rgba(239,68,68,0.4)'; btn.style.color = '#ef4444';
      btn.addEventListener('click', () => marketUninstall(p.slug, btn));
    } else {
      btn.textContent = 'Install';
      btn.style.background = '#7c5cfc'; btn.style.borderColor = '#7c5cfc'; btn.style.color = '#fff';
      btn.addEventListener('click', () => marketInstall(p.slug, btn));
    }
    acts.appendChild(btn);
    return el;
  }

  async function marketInstall(slug, btn) {
    btn.disabled = true; btn.textContent = 'Installing...';
    let err = 'error';
    try { err = await bridge().pluginMarketInstall(slug); } catch (e) { err = String(e); }
    if (!err) {
      pluginClearGranted(slug);       // require a fresh permission consent on every (re)install
      await loadPlugins();
      activeTab = 'plugin:' + slug;   // jump to the freshly installed plugin (shows its permission prompt)
      railCat = 'Plugins';            // keep the rail on the Plugins category
      renderSidebar(); renderPane();
    } else {
      btn.disabled = false; btn.textContent = 'Install';
      const c = $('content');
      const note = document.createElement('div');
      note.style.cssText = 'color:#ef4444;font-size:0.82em;margin:8px 4px;';
      note.textContent = 'Install failed: ' + err;
      if (c.firstChild) c.insertBefore(note, c.firstChild); else c.appendChild(note);
    }
  }

  async function marketUninstall(slug, btn) {
    btn.disabled = true; btn.textContent = '...';
    try { await bridge().pluginUninstallLocal(slug); } catch (e) {}
    pluginClearGranted(slug);         // forget consent so a reinstall re-prompts
    if (activeTab === 'plugin:' + slug) activeTab = 'pluginbrowse';
    await loadPlugins();
    $('content').innerHTML = ''; renderPluginBrowse();
  }

  function attachBridge() {
    if (!bridge()) { setTimeout(attachBridge, 100); return; }
    // Load tile-marker state first so the initial pushOverlay() reflects whether markers
    // should render; this starts the overlay thread for accounts that already have
    // markers, without opening the tab.
    loadMarkerKb(); fetchMarkers(true);
    // Keybind capture: while a "Press a key..." field is armed the next keypress
    // becomes the binding (Esc cancels); normal typing is untouched.
    document.addEventListener('keydown', e => {
      if (!markerCapturing) return;
      e.preventDefault();
      const vk = e.keyCode || e.which || 0;
      if (vk && vk !== 27) { markerKb[markerCapturing] = vk; saveMarkerKb(); }
      markerCapturing = null; paintKbKeys();
    }, true);
    // Register this pid with the overlay up front (overlay stays off): random-event
    // highlights need a target window even with the grid disabled.
    pushOverlay();
    pluginBrokerInit();
    renderSidebar();
    renderPane();
    refresh();
    setInterval(refresh, 250);
    // Keep the companion var-capture observer ON at all times (not just on the Vars
    // tab): it resolves client-side vars (panel origins, dialogue rects) the game
    // hashmaps don't keep current, else those highlights read stale. Cheap flag,
    // re-asserted each tick so it survives client switches.
    setInterval(function () { try { if (bridge() && bridge().varsWatch) bridge().varsWatch(myPid(), true); } catch (e) {} }, 250);
    setInterval(knotTick, 250);       // celtic-knot arrow overlay: tab-independent so it tracks the panel anywhere
    // Dungeoneering's in-world helpers are tab-INDEPENDENT, so they must honour DUNG_ENABLED too,
    // or a hidden Dungeoneering still draws its room-solver highlights in Daemonheim.
    if (DUNG_ENABLED) {
      setInterval(dungSceneTick, 600);  // Dungeoneering ghost / sliding-puzzle in-scene highlight
      setInterval(dungLodeTimerTick, 100);  // Dungeoneering crystal-room ms click countdown (centre text)
    }
    setInterval(megAnswerTick, 600);  // Meg weekly-question best-answer highlight (dialogue 1188, tab-independent)
    // lockbox solver overlay (interface 1933): tab-independent; fast (~90ms) while
    // open so highlights track each click, slow (~300ms) idle.
    (function lockboxLoop() { try { lockboxTick(); } catch (e) {} setTimeout(lockboxLoop, lockboxOwnsPanel ? 90 : 300); })();
    // towers (Skyscrapers) solver overlay (interface 1934): tab-independent, adaptive like the lockbox.
    (function towersLoop() { try { towersTick(); } catch (e) {} setTimeout(towersLoop, towersOwnsPanel ? 120 : 400); })();
    setInterval(ifaceMonTick, 600);   // Interfaces tab: open/close monitor (no-op unless that tab is active)
    loadPlugins();   // discover installed (signed) + sideloaded dev plugins -> Plugins category
  }
  attachBridge();
</script>
