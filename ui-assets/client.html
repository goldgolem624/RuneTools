  // Bar info chips. 1 Hz; writes only on change. The XP chip leans on the XP tracker's
  // sampler (applyXpOverlay starts it) and its 1 s state fetch.
  let _barInfoSig = '', _barXpArmed = false, _sessStartMs = 0;
  function uiBarTick() {
    // Overflow guard: anything that widened the bar after its last placement (fonts, chips,
    // status text) must not leave it hanging off the frame edge.
    try {
      const bar = $('menubar');
      if (bar) {
        const r = bar.getBoundingClientRect(), vw = window.innerWidth || 1280, vh = window.innerHeight || 720;
        if (r.right > vw - 4 || r.left < 4 || r.bottom > vh - 4 || r.top < 4) { positionMenubar(); wmRectsSoon(); }
      }
    } catch (e) {}
    const el = $('hdr-info'); if (!el) return;
    const c = uiCfg(), parts = [];
    if (c.barClock) {
      const d = new Date();
      let h = d.getHours(), m = String(d.getMinutes()).padStart(2, '0');
      if (c.bar24h) parts.push('<b>' + String(h).padStart(2, '0') + ':' + m + '</b>');
      else parts.push('<b>' + ((h % 12) || 12) + ':' + m + '</b> ' + (h < 12 ? 'am' : 'pm'));
    }
    // Session = time logged into the game (lobby or in-game, status >= 20), from the first
    // logged-in snapshot this client showed until it logs out. Independent of the XP tracker,
    // whose own clock only starts at the first XP gain.
    {
      const sn = (typeof lastSnap !== 'undefined') ? lastSnap : null;
      const loggedIn = !!(sn && sn.status >= 20);
      const key = 'rtxSessStart:' + myPid();
      if (loggedIn) {
        if (!_sessStartMs) {
          let saved = 0; try { saved = Number(localStorage.getItem(key)) || 0; } catch (e) {}
          _sessStartMs = saved > 0 ? saved : Date.now();
          try { localStorage.setItem(key, String(_sessStartMs)); } catch (e) {}
        }
      } else if (_sessStartMs && sn && sn.status >= 0) {
        _sessStartMs = 0; try { localStorage.removeItem(key); } catch (e) {}
      }
    }
    if (c.barSession) {
      const sec = _sessStartMs ? Math.floor((Date.now() - _sessStartMs) / 1000) : 0;
      const t = sec >= 3600 ? Math.floor(sec / 3600) + 'h ' + String(Math.floor((sec % 3600) / 60)).padStart(2, '0') + 'm'
                            : Math.floor(sec / 60) + 'm ' + String(sec % 60).padStart(2, '0') + 's';
      parts.push('Session <b>' + t + '</b>');
    }
    if (c.barXp) {
      if (!_barXpArmed) { _barXpArmed = true; try { if (typeof applyXpOverlay === 'function') applyXpOverlay(); } catch (e) {} }
      try { if (typeof fetchXpTracker === 'function') fetchXpTracker(false); } catch (e) {}
      const d = (typeof xpStateData !== 'undefined') ? xpStateData : null;
      {
        const ph = (d && d.total) ? (+d.total.ph || 0) : 0;
        parts.push('<b>' + (typeof fmtXpNum === 'function' ? fmtXpNum(ph) : ph) + '</b> xp/h');
      }
    }
    const html = parts.join('<span style="color:var(--text-mute)">|</span>');
    if (html !== _barInfoSig || el.innerHTML !== html) {
      _barInfoSig = html; el.innerHTML = html;
      // The bar's width just changed: re-centre it AND republish the consume rects, or the
      // newly covered strip (and everything that shifted under it) falls through to the game.
      try { positionMenubar(); } catch (e) {}
      try { wmRectsSoon(); } catch (e) {}
    }
  }
  setInterval(() => { try { uiBarTick(); } catch (e) {} }, 1000);

      const rd = bridge().varcInts || bridge().varcLongs;

      for (const k in bySize) if (!best || bySize[k].length > best.length) best = bySize[k];

      // e.g. a docked panel whose drag varc kept its old spot).
      if (best && bestD > 200 && sizeMatches > 1) best = null;
      if (best) {

    skBarsPaintWhy();

    // (openVar unknown) the live frame is also the presence gate: no frame, no bars --
    // strictly better than drawing them displaced or over another tab.
    if (!anchor) {

      }

    for (let n = 0; n < cells.length; n++) {

      if (!t) continue;

  }

    16197,16051,16050,16049,16044,16061,16056,16052,16038,16196,16060,16048,
    16059,16053,16042,16195,16047,16046,16054,16039,30936];

     2,16,13,   // Strength     Agility     Smithing
     1,15,10,   // Defence      Herblore    Fishing
     4,17, 7,   // Ranged       Thieving    Cooking
     5,12,11,   // Prayer       Crafting    Firemaking
     6, 9, 8,   // Magic        Fletching   Woodcutting
    20,18,19,   // Runecrafting Slayer      Farming
    22,21,23,   // Construction Hunter      Summoning
    24,25,26,   // Dungeoneering Divination Invention
    27,28];     // Archaeology  Necromancy

  // RS3 combat level (post-Necromancy). Necromancy counts as its own style.

    const def=L(1), hp=L(3), pray=L(5), summ=L(23);

  // an older bridge without the arg just serves the default-cap sprite.

    if (!id || id <= 0 || !el) return;
    const k = px ? (id + '|' + px) : id;
    if (SPRITES.has(k)) { setSpriteIcon(el, SPRITES.get(k)); return; }
    SPRITE_QUEUE.push([id, el, px || 0]);
    if (!spriteDraining) { spriteDraining = true; rafSchedule(drainSprites); }
  }
  function drainSprites() {

    while (SPRITE_QUEUE.length && nowMs() - t0 < 8) {
      const it = SPRITE_QUEUE.shift(), id = it[0], el = it[1], px = it[2] || 0;
      const k = px ? (id + '|' + px) : id;
      if (SPRITES.has(k)) { setSpriteIcon(el, SPRITES.get(k)); continue; }
      if (SPRITE_PENDING.has(k)) continue;

      try { r = (bridge() && bridge().sprite) ? (px ? bridge().sprite(id, px) : bridge().sprite(id)) : ''; } catch (e) { r = ''; }

    SPRITE_PENDING.add(sid);

      try {

  // Normal launches ignore the stored tab. Never restore into a tab hidden in this build (that

  const INFO_PENDING = new Set();

    const el = document.createElement('div');
    el.id = 'global-tip';
    document.body.appendChild(el);
    return el;
  })();

  // when it technically fits. The remainder is reported as "+N more".

  function uiTipText(text) {
    // Preferences "compact tooltips": drop the Source:/ID provenance lines that only a
    // developer or a sceptic wants, keep everything the player reads.
    if (!text || !uiCfg().compactTips) return text;
    // Drop provenance lines (Source/ID), explanatory lines (Shown because / Note / Tip / Why /
    // Hint / Because), and parenthetical asides inside a line that still says something
    // without them. The first line (the name) is always kept.
    const lines = String(text).split('\n');
    const out = [];
    lines.forEach((l, i) => {
      if (i > 0 && /^\s*(Source|Sources|ID|Note|Tip|Hint|Why|Because|Shown because|Diagnostic|Debug)\b/i.test(l)) return;
      if (i > 0) {
        const stripped = l.replace(/\s*\([^()]*\)/g, '').replace(/\s{2,}/g, ' ').trimEnd();
        if (stripped.replace(/[\s:;,.-]/g, '').length) l = stripped;
      }
      out.push(l);
    });
    return out.join('\n').replace(/\n{3,}/g, '\n\n');

  function showTipFor(node) {
    const text = uiTipText(node.dataset.tip);
    const grids = TIP_GRIDS.get(node);
    if (!text && !grids) { hideTip(); return; }
    if (grids) {
      tipEl.classList.add('tg');
      tipEl.textContent = text || '';            // head line stays plain text
      tipEl.appendChild(buildTipGrids(grids));
    } else {
      tipEl.classList.remove('tg');
      if (node.dataset.tipHtml === '1') tipEl.innerHTML = tipHtml(text);
      else tipEl.textContent = text;
    }
    tipEl.style.opacity = '1';
    const r = node.getBoundingClientRect();
    // MEASURE AT THE ORIGIN FIRST. #global-tip is position:fixed with only `left` set, so its
    // shrink-to-fit width is capped at (viewport width - left). Measuring while it still sat at the
    // PREVIOUS position leaves a tooltip near the right edge only a sliver of room: it wraps into a
    // tall narrow column and reports that squeezed offsetWidth, which then feeds the clamp below.
    // Parking it at left:0 gives the full viewport to shrink-to-fit against, so the measurement is
    // the bubble's NATURAL width (bounded by its own max-width).
    tipEl.style.width = '';        // natural size for the measurement
    tipEl.style.left  = '0px';
    tipEl.style.top   = '0px';
    const tipW = tipEl.offsetWidth  || 0;
    const tipH = tipEl.offsetHeight || 24;
    // PIN the measured width before moving it. Otherwise the final `left` re-applies the same
    // shrink-to-fit cap and the bubble collapses again on the right-hand side -- parking at the
    // origin alone only fixes the measurement, not the render.
    tipEl.style.boxSizing = 'border-box';
    const margin = 6;
    // A panel narrower than the bubble would make minCx > maxCx below, and since the max test runs
    // last the bubble would be shoved off the LEFT edge. Cap the width to the available space
    // instead so the clamp always has a valid range.
    const avail = Math.max(40, window.innerWidth - 2 * margin);
    const useW = Math.min(tipW, avail);
    tipEl.style.width = useW + 'px';

    // Clamp the centre so the (translateX(-50%)) bubble stays on screen.
    let cx = r.left + r.width / 2;
    const minCx = useW / 2 + margin;
    const maxCx = window.innerWidth - useW / 2 - margin;
    if (cx < minCx) cx = minCx;
    if (cx > maxCx) cx = maxCx;

    // Prefer above the anchor, else below -- then CLAMP into the viewport, or a tall bubble runs off
    // the bottom. A bubble taller than the window is pinned to the top margin so at least its head
    // is visible; panels cap their own list lengths.
    let top = r.top - tipH - margin;
    if (top < margin) top = r.bottom + margin;
    if (top + tipH > window.innerHeight - margin) top = window.innerHeight - tipH - margin;
    if (top < margin) top = margin;

    tipEl.style.left = cx + 'px';
    tipEl.style.top  = top + 'px';
  }

  function fmtAmt(n) {

  // resolves to intrinsic size in Ultralight's WebKit -> uneven). Sizing is
  // DOWNSCALE-ONLY: true pixel size, shrunk only when bigger than the box;
  // `contain` blew tightly-cropped small icons up to fill the slot.
  const ICON_NAT = new Map();   // data-url -> {w,h} | null (not a decodable PNG)
  // Read width/height straight from the PNG IHDR (offsets 16/20, big-endian) of
  // the data URL -- synchronous + reliable, no Image() load race.
  function pngSize(url) {
    if (ICON_NAT.has(url)) return ICON_NAT.get(url);
    let s = null;
    const c = url.indexOf(',');
    if (c >= 0 && url.lastIndexOf('image/png', c) >= 0) {
      try {
        const bin = atob(url.slice(c + 1, c + 1 + 40));
        if (bin.length >= 24 && bin.charCodeAt(0) === 0x89) {
          const u = n => ((bin.charCodeAt(n) << 24 | bin.charCodeAt(n + 1) << 16 |
                           bin.charCodeAt(n + 2) << 8 | bin.charCodeAt(n + 3)) >>> 0);
          s = { w: u(16), h: u(20) };

    ICON_NAT.set(url, s); return s;

  function sizeIcon(el) {
    const url = el.dataset.icoUrl; if (!url) return;
    const nat = pngSize(url);
    const commit = (want) => {
      if (el.dataset.icoSized !== want) { el.style.backgroundSize = want; el.dataset.icoSized = want; }
    };
    if (!nat) { commit('contain'); return; }              // not a decodable PNG -> fit the box
    const bw = el.clientWidth, bh = el.clientHeight;
    if (!bw || !bh) {
      // Not laid out yet: committing native size here painted oversized sprites for a
      // beat before the next sizing pass shrank them (visible on every panel as icons
      // flashing huge). Paint NOTHING for the pre-layout instant and decide with real
      // box dimensions on the next frame, which fires before paint in this renderer.
      // A box that stays unmeasurable (hidden tab) settles on contain, which is the
      // correct rendering for any box size.
      commit('0px 0px');
      const tries = (parseInt(el.dataset.icoTries || '0', 10) || 0) + 1;
      el.dataset.icoTries = String(tries);
      if (tries <= 3) requestAnimationFrame(() => sizeIcon(el));
      else commit('contain');
      return;
    }
    el.dataset.icoTries = '';

  // are owned at >= 1. Entries with no `own` spec are consumables with no ownership to read.
  function archUnlockState(it) {
    const lvl = (matUnlockVp && it.own && matUnlockVp[it.own.vb]) || 0;

    if (it.have) {

      const got = !!archShopHave[it.have];
      return { done: got, badge: got ? 'Have it' : 'Not held', detail: detail || 'Free, one-time claim' };
    }
    if (!it.own) return { done: false, badge: '', detail: detail, plain: true };
    const need = it.own.lvl || 1;
    if (lvl >= need) return { done: true, badge: 'Owned', detail: detail };

    // because the one below it is unbought is LOCKED, not merely unbought -- matching the game's
    // three states. Buyable means the varbit sits exactly one tier short.
    const locked = lvl < need - 1;

  // Player-state varps shared by the Player State panel and the Skills footer

  //         permanently and no clientscript in the cache mentions it, so it is gone, not merely
  //         idle. It is left OUT of the request list rather than kept as a fallback: a dead varp
  //         reads 0, and 0 is indistinguishable from a real low reading. Max lives in 13538 (above).

  // character; gates read "> 0" everywhere, "== 2" for Equilibrium paths); league points
  // varp per the header's db 326.28 var_reference: L1 12426, L2 13521.
  const PLAYER_VARP_IDS = '458,13537,13538,3274,8040,1787,679,463,1297,4818,5984,5982,5991,12314,12426,13521';

  // Account-wide varbits shown on the Info tab. 39152 (bits 0-15) = TOTAL Dungeoneering floors
  // completed all-time: player state, not per-floor state, so it belongs here.
  // 58389 = league tasks completed (script21081's region-unlock counter). NOTE
  // vb 58421 is NOT fetched: it is a server multiplier used only by the archaeology
  // restoration XP preview (script14688/20151) and does not match the headline tier
  // multiplier (observed 10 while the tier table said 12). The displayed multiplier
  // is derived from the tier table (db 328.4) against live points instead.
  const PLAYER_VARBIT_IDS = '39152,58389';
  let playerVb = null;
  async function fetchPlayerVp() {

    try { const d = JSON.parse(await bridge().varps(myPid(), PLAYER_VARP_IDS));
          if (d && typeof d === 'object' && Object.keys(d).length) playerVp = d; } catch (e) {}

  // ---- In-game skill targets (read live from the "Set target" varps) ----
  // skill index (= stat id) -> RS3 skills-interface skillId, from cache enum 1482.
  const GOAL_STAT_SKILLID = [1,5,2,6,3,7,4,16,18,19,15,17,11,14,13,9,8,10,20,21,12,23,22,24,25,26,27,28,29];
  // PRIMARY path (all classic skills AND Dungeoneering): varp 1115 = has-target bitmask (by
  // skillId), 1117 = type bitmask (1=level,0=xp), value = varp(1117+skillId). Dungeoneering
  // (skill index 24 -> skillId 25 -> varp 1142) is on THIS table.
  // EXCLUSIVE dedicated-var skills (NOT on the arithmetic table; their arithmetic slot holds
  // stale data): Divination (varp 3839), Invention (6095), Archaeology (9410), Necromancy
  // (11204). The dedicated var holds the LEVEL when <= the skill's cap, else the raw XP target;
  // 0 = no goal. For these the table is NEVER consulted.
  // Skill index -> the varp holding that skill's TARGET VALUE, for the four skills that are not
  // on the arithmetic table. Decoded from clientscript-4037, which maps stat id -> value varp:
  // case 26 -> 3839 (Divination), 27 -> 6095 (Invention), 28 -> 9410 (Archaeology),
  // 29 -> 11204 (Necromancy). Those stat ids line up with GOAL_STAT_SKILLID above.
  //
  // Each of these varps has a PARTNER (3840 / 6096 / 9411 / 11205, and value+25 on the classic
  // table). The partner is NOT a goal-type flag - live capture showed 9411 = 10 with no target
  // set at all - and neither varp is cleared when a target is removed, which is why stale values
  // sit in them. Whether a target EXISTS is not stored in either: see the has-bit below.
  const GOAL_VAR_OVERRIDES = { 25: 3839, 26: 6095, 27: 9410, 28: 11204 };
  const GOAL_VARP_IDS = (function () {
    const a = [1115, 1117]; for (let s = 1; s <= 29; s++) a.push(1117 + s);
    for (const k in GOAL_VAR_OVERRIDES) a.push(GOAL_VAR_OVERRIDES[k]);
    return a.join(',');
  })();
  let gameGoals = {};
  let _gameGoalsAt = 0;
  async function fetchGameGoals() {
    if (!bridge() || !bridge().varps) return;
    const now = Date.now(); if (now - _gameGoalsAt < 1000) return; _gameGoalsAt = now;
    let d = null;
    try { d = JSON.parse(await bridge().varps(myPid(), GOAL_VARP_IDS)); } catch (e) { return; }
    if (!d) return;
    // The dedicated goal varps (181/6095/...) can be getStorage-backed like the appearance varps
    // (172/2017): absent from the flat varp hashmap, but pushed through the companion var
    // observer. Union: the direct hashmap read wins when nonzero, the companion fills misses.
    let dc = null;
    try { if (bridge().varsDump) dc = JSON.parse(await bridge().varsDump(myPid())); } catch (e) {}
    const has = (d['1115'] || 0) >>> 0, typ = (d['1117'] || 0) >>> 0;
    const g = {};
    // Mirrors the game's own pair of accessors:
    //   script4036(stat) = TESTBIT(varp 1115, stat)  -> IS a target set
    //   script4037(stat) = [TESTBIT(varp 1117, stat), valueVarp, partnerVarp]  -> 1 = level goal
    // Both bitmasks are indexed by STAT ID, and they cover the dedicated-varp skills exactly as
    // they cover the classic ones - only the value's location differs. Earlier this code skipped
    // the has-bit for those four and inferred a target purely from "value is nonzero", which
    // reported a target for anyone whose varp still held a cleared goal's value (owner-reported:
    // "In-game target: level 20" on Archaeology with no target set, varp 9410 stale at 20).
    for (let i = 0; i < GOAL_STAT_SKILLID.length; i++) {
      const sk = GOAL_STAT_SKILLID[i];
      if (!((has >>> sk) & 1)) continue;                 // no target set for this skill
      const ov = GOAL_VAR_OVERRIDES[i];
      // Dedicated-varp skills must NOT read the arithmetic slot (1117+skillId): it holds stale,
      // unrelated data for them (Invention's slot 1144 = 77, shadowing the real 6095 = 145).
      const val = ov ? (((d[String(ov)] || 0) >>> 0) || ((dc && (dc['4:' + ov] >>> 0)) || 0))
                     : (d[String(1117 + sk)] | 0);
      if (val <= 0) continue;
      g[i] = { mode: ((typ >>> sk) & 1) ? 'level' : 'xp', target: val, game: true };
    }
    gameGoals = g;
  }
  // The live in-game target for skill `i` (read from the game; not user-editable).
  function effectiveGoal(i) { return gameGoals[i] || null; }
  function xpForLevel(level, elite) {
    const t = elite ? ELITE_XP_TABLE : XP_TABLE;
    if (level < 1) return 0;
    return t[Math.min(level, t.length - 1)] || 0;
  }
  // Progress of skill `i` (current xp) toward its goal: actual XP earned over the
  // XP the target requires. For a level goal the target XP is the XP for that level.
  function skillGoalProgress(i, xp) {
    const g = effectiveGoal(i); if (!g || xp < 0 || g.target <= 0) return null;
    const targetXp = g.mode === 'xp' ? g.target : xpForLevel(g.target, i === 26);
    if (targetXp <= 0) return null;
    return { pct: Math.max(0, Math.min(1, xp / targetXp)), mode: g.mode, target: g.target, done: xp >= targetXp, game: !!g.game };
  }

  // ---- Tick metronome ----
  // Widget + audio click live in the overlay, locked to the real server tick (audio
  // fires only on a confirmed tick -> no doubles). This UI only picks mode/interval.
  const METRO_MODES = [['off', 'Off'], ['visual', 'Visual'], ['audio', 'Audio'], ['both', 'Both']];
  let metroMode = 'off';        // off | visual | audio | both
  let metroInterval = 1;        // beat every N ticks (1..6)
  let metroLocked = false;      // locked = click-through, non-movable widget
  let _metroAppliedPid = -1;
  try {
    const sm = localStorage.getItem('rtxMetroMode'); if (sm) metroMode = sm;
    const si = parseInt(localStorage.getItem('rtxMetroIv'), 10); if (si >= 1 && si <= 6) metroInterval = si;
    metroLocked = localStorage.getItem('rtxMetroLock') === '1';
  } catch (e) {}
  function metroVisual() { return metroMode === 'visual' || metroMode === 'both'; }
  function metroAudio()  { return metroMode === 'audio'  || metroMode === 'both'; }
  // The DIAL is now the 'metronome' HUD window; only the audio click stays native, because
  // it fires off the confirmed tick edge on the reader's 5 ms poll thread and routing that
  // through the page would put the UI pump between the tick and the sound. So the visual
  // flag passed to the companion is permanently false: nothing else drives that drawing.
  function applyMetroOverlay() {
    try { bridge().metronome(myPid(), false, metroAudio(), metroInterval, true); _metroAppliedPid = myPid(); } catch (e) {}
  }
  // Open/close the dial window to match the mode. Opening is idempotent (openTab focuses an
  // existing window), so this is safe to call from any settings change.
  // `adopt` is passed once, right after a layout restore. The layout is per-account but the
  // mode is machine-wide, so without it turning the dial off on one character would close the
  // window another character had saved open -- and write that closure into their layout.
  // A restored window is that account's own answer, so it wins and the mode follows it.
  function metroSyncWindow(adopt) {
    const want = metroVisual();
    const w = wmWinOf('metronome');
    if (adopt && w && !want) {
      metroMode = metroAudio() ? 'both' : 'visual';
      try { localStorage.setItem('rtxMetroMode', metroMode); } catch (e) {}
      applyMetroOverlay();
      paneRun('ticks', renderTicks);
      return;
    }
    if (want && !w) {
      const t = allTabs().find(x => x.id === 'metronome');
      if (t) {
        const nw = openTab(t, { noFocus: metroLocked });

      const nw = wmUndockTab(td.w, td.id, e);
      if (!nw) return;
      _tabDragged = true;
      _wmDrag = { w: nw, mode: 'move', sx: e.clientX, sy: e.clientY, ox: nw.x, oy: nw.y, dock: null };
      nw.el.classList.add('dragging');
    }
    const d = _wmDrag;
    if (!d) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    const w = d.w;
    if (d.mode === 'move') {
      w.x = d.ox + dx; w.y = d.oy + dy;
      // Edge snap (desktop bounds), 10px threshold.
      const vw = window.innerWidth, vh = window.innerHeight;
      if (Math.abs(w.x) < 10) w.x = 0;
      if (Math.abs(w.y) < 10) w.y = 0;
      if (Math.abs(vw - (w.x + w.w)) < 10) w.x = vw - w.w;
      if (Math.abs(vh - (w.y + w.h)) < 10) w.y = vh - w.h;
      // Hovering another window's title / tab strip = drop it in there on release.
      const tgt = wmDockTargetAt(e.clientX, e.clientY, w);
      if (tgt !== d.dock) {
        if (d.dock) d.dock.el.classList.remove('dock-target');
        d.dock = tgt;
        if (tgt) tgt.el.classList.add('dock-target');
      }
    } else {
      const dir = d.dir, sz = winSizeFor(w.wid, w.tab);
      if (dir.indexOf('e') >= 0) w.w = Math.max(sz.minW, d.ow + dx);
      if (dir.indexOf('s') >= 0) w.h = Math.max(sz.minH, d.oh + dy);
      if (dir.indexOf('w') >= 0) { const nw = Math.max(sz.minW, d.ow - dx); w.x = d.ox + (d.ow - nw); w.w = nw; }
      if (dir.indexOf('n') >= 0) { const nh = Math.max(sz.minH, d.oh - dy); w.y = d.oy + (d.oh - nh); w.h = nh; }
    }
    wmClamp(w);
    wmApplyGeom(w);
    wmRectsSoon();
    // Aura groups lay themselves out to their window, so resizing one must repaint it live:
    // waiting for the next buff poll made the tiles lag the handle by up to half a second.
    if (d.mode === 'size' && typeof auraIsHudTab === 'function' && auraIsHudTab(w.tab) && !w.min) renderPaneFor(w);
  });
  document.addEventListener('mouseup', () => {
    _tabDrag = null;            // press ended without travelling: it was a plain click
    if (!_wmDrag) return;
    const d = _wmDrag, w = d.w;
    w.el.classList.remove('dragging');
    w.el.classList.remove('sizing');
    _wmDrag = null;
    wm.dirty = true;
    if (d.dock) {
      d.dock.el.classList.remove('dock-target');
      if (wm.wins.get(d.dock.wid) === d.dock && wm.wins.get(w.wid) === w) wmDockInto(w, d.dock);
    }
    wmRectsSoon(); wmSaveSoon();
  });

  // ==================== In-game notifications ====================
  // Replaces the companion's GL-primitive notification cards (marker command list,
  // fixed-cell ASCII atlas). Same delivery contract as before -- a message and a
  // time-to-live, 0 = sticky until dismissed -- but rendered in the UI layer, so
  // it gets real type, wrapping and the window design language.
  const TOAST_MAX = 4;
  const toasts = [];               // { el, msg, until, sticky, n, barEl, countEl }
  let _toastTimer = 0;
  // Placement, persisted with the layout (per account). Anchor + offset rather than a
  // raw x/y so the stack keeps its corner when the game window is resized.
  const TOAST_DEF = { anchor: 'top-center', dx: 0, dy: 58, w: 420 };
  let toastCfg = Object.assign({}, TOAST_DEF);
  let toastPlacing = false;        // UI Settings "position on screen" mode

  function applyToastPos() {
    const el = $('toaster');
    if (!el) return;
    const c = toastCfg, a = String(c.anchor || 'top-center');
    const vw = window.innerWidth || 1280, vh = window.innerHeight || 720;
    const w = Math.max(220, Math.min(Number(c.w) || TOAST_DEF.w, Math.max(220, vw - 20)));
    const dx = Number(c.dx) || 0, dy = Number(c.dy) || 0;
    el.style.width = w + 'px';
    el.style.top = el.style.bottom = el.style.left = el.style.right = 'auto';
    el.style.transform = 'none';
    // Vertical edge
    if (a.indexOf('bottom') === 0) el.style.bottom = Math.max(0, dy) + 'px';
    else el.style.top = Math.max(0, dy) + 'px';
    // Horizontal edge; centre keeps its own translate so dx nudges from the middle.
    if (a.indexOf('left') > 0) el.style.left = Math.max(0, dx) + 'px';
    else if (a.indexOf('right') > 0) el.style.right = Math.max(0, dx) + 'px';
    else { el.style.left = '50%'; el.style.transform = 'translateX(calc(-50% + ' + dx + 'px))'; }
    // Newest-first at the top edge, newest-nearest-the-edge at the bottom.
    el.style.flexDirection = (a.indexOf('bottom') === 0) ? 'column-reverse' : 'column';
    el.classList.toggle('placing', !!toastPlacing);
    // The placement frame is a real element so it can carry a width grip.
    let g = $('toastGhost');
    if (toastPlacing && !g) {
      g = document.createElement('div');
      g.id = 'toastGhost';
      const lab = document.createElement('span');
      lab.textContent = 'Drag to position alerts';
      const rz = document.createElement('i');
      rz.className = 'ghost-rz'; rz.title = 'Drag to set width';
      rz.addEventListener('mousedown', (e) => {
        e.preventDefault(); e.stopPropagation();          // not a move-drag
        const sx = e.clientX, ow = Number(toastCfg.w) || TOAST_DEF.w;
        const a = String(toastCfg.anchor || 'top-center');
        // Right-anchored stacks grow leftwards, so the grip reads inverted there.
        const dir = (a.indexOf('right') > 0) ? -1 : 1;
        const mv = (ev) => {
          const vwNow = window.innerWidth || 1280;
          toastCfg.w = Math.max(220, Math.min(vwNow - 20, ow + (ev.clientX - sx) * dir));
          applyToastPos(); reflectUiSettings();
        };
        const up = () => {
          document.removeEventListener('mousemove', mv);
          document.removeEventListener('mouseup', up);
          wmSaveSoon();
        };
        document.addEventListener('mousemove', mv);
        document.addEventListener('mouseup', up);
      });
      g.appendChild(lab); g.appendChild(rz);
      el.appendChild(g);
    } else if (!toastPlacing && g) {
      g.parentNode.removeChild(g);
    }
    wmRectsSoon();
  }

  // Drag the stack itself while in placement mode; converts the drop point back into
  // an offset from whichever edge the current anchor uses.
  (function toastDragInit() {
    document.addEventListener('mousedown', (e) => {
      if (!toastPlacing) return;
      const el = $('toaster');
      if (!el || !e.target.closest || !e.target.closest('#toaster')) return;
      // The width grip is inside the stack, and THIS listener is on the capture
      // phase, so it would otherwise start a move-drag before the grip ever sees
      // the press and stopPropagation could not save it.
      if (e.target.closest('.ghost-rz')) return;
      e.preventDefault();
      const r = el.getBoundingClientRect();
      const ox = e.clientX - r.left, oy = e.clientY - r.top;
      const mv = (ev) => {
        const vw = window.innerWidth || 1280, vh = window.innerHeight || 720;
        const left = Math.max(0, Math.min(vw - r.width, ev.clientX - ox));
        const top = Math.max(0, Math.min(vh - r.height, ev.clientY - oy));
        const a = String(toastCfg.anchor || 'top-center');
        toastCfg.dy = Math.round((a.indexOf('bottom') === 0) ? (vh - top - r.height) : top);
        toastCfg.dx = Math.round(a.indexOf('left') > 0 ? left
                              : a.indexOf('right') > 0 ? (vw - left - r.width)
                              : (left + r.width / 2 - vw / 2));
        applyToastPos();
        reflectUiSettings();      // values only: a rebuild here would kill this drag
      };
      const up = () => {
        document.removeEventListener('mousemove', mv);
        document.removeEventListener('mouseup', up);
        wmSaveSoon();
      };
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', up);
    }, true);
  })();

  // A colour-coded dot rather than a drawn icon: amber = needs dismissing, accent =
  // it will clear itself. Reads instantly and cannot mis-render.
  function toastIcon(sticky) { return '<i class="g g-dot"></i>'; }

  // msg: text. opts: { ttl: ms (0/omitted-with-sticky = until dismissed), sticky: bool }
  function uiNotify(msg, opts) {
    msg = String(msg == null ? '' : msg).slice(0, 300);
    if (!msg) return;
    opts = opts || {};
    const sticky = !!opts.sticky || opts.ttl === 0;
    const ttl = sticky ? 0 : Math.max(1200, Number(opts.ttl) || Number(uiCfg().toastTtl) || 5000);
    const now = Date.now();
    // Repeat of a message already on screen: bump its count and restart its clock
    // instead of stacking duplicates (alert rules can re-fire quickly).
    const dup = toasts.find(t => t.msg === msg && !t.closing);
    if (dup) {
      dup.n++;
      dup.until = ttl ? now + ttl : 0;
      dup.ttl = ttl;
      dup.start = now;
      if (dup.countEl) { dup.countEl.textContent = '×' + dup.n; dup.countEl.style.display = ''; }
      toastTick();
      return dup;
    }
    const el = document.createElement('div');
    el.className = 'toast' + (sticky ? ' sticky' : '');
    const ico = document.createElement('span');
    ico.className = 'toast-ico'; ico.innerHTML = toastIcon(sticky);
    const body = document.createElement('div');
    body.className = 'toast-msg'; body.textContent = msg;
    const cnt = document.createElement('span');
    cnt.className = 'toast-n'; cnt.style.display = 'none';
    el.appendChild(ico); el.appendChild(body); el.appendChild(cnt);
    let barEl = null;
    if (sticky) {
      const x = document.createElement('button');
      x.className = 'toast-x'; x.title = 'Dismiss';
      x.innerHTML = '<i class="g g-x"></i>';
      x.addEventListener('click', () => toastClose(rec));
      el.appendChild(x);
    } else {
      const bar = document.createElement('div'); bar.className = 'toast-bar';
      barEl = document.createElement('i'); bar.appendChild(barEl);
      el.appendChild(bar);
    }
    const rec = { el, msg, sticky, n: 1, ttl, start: now,
                  until: ttl ? now + ttl : 0, barEl, countEl: cnt, closing: false };
    $('toaster').appendChild(el);
    toasts.push(rec);
    // Cap the stack: retire the oldest NON-sticky first so a dismissible warning
    // is never silently pushed out by routine chatter.
    while (toasts.filter(t => !t.closing).length > TOAST_MAX) {
      const victim = toasts.find(t => !t.closing && !t.sticky) ||
                     toasts.find(t => !t.closing);
      if (!victim) break;
      toastClose(victim);
    }
    toastTick();
    wmRectsSoon();                 // a sticky card is clickable -> claim its rect
    // The record is returned so callers (pinned league tasks) can live-update a
    // sticky card's text in place instead of stacking new toasts.
    return rec;
  }

  function toastClose(rec) {
    if (!rec || rec.closing) return;
    rec.closing = true;
    rec.el.classList.add('out');
    setTimeout(() => {
      const i = toasts.indexOf(rec);
      if (i >= 0) toasts.splice(i, 1);
      if (rec.el.parentNode) rec.el.parentNode.removeChild(rec.el);
      wmRectsSoon();
    }, 200);
  }

  // Drives expiry + the remaining-time rule. Runs ONLY while toasts are on screen.
  function toastTick() {
    const now = Date.now();
    for (const t of toasts.slice()) {
      if (t.closing || t.sticky) continue;
      if (now >= t.until) { toastClose(t); continue; }
      if (t.barEl && t.ttl > 0)
        t.barEl.style.width = Math.max(0, Math.min(100, (t.until - now) / t.ttl * 100)) + '%';
    }
    const live = toasts.some(t => !t.closing && !t.sticky);
    if (live && !_toastTimer) _toastTimer = setInterval(toastTick, 100);
    else if (!live && _toastTimer) { clearInterval(_toastTimer); _toastTimer = 0; }
  }

  // ---- UI Settings panel (Developer): live placement of in-game chrome ----
  const TOAST_ANCHORS = [
    ['top-left', 'Top left'], ['top-center', 'Top centre'], ['top-right', 'Top right'],
    ['bottom-left', 'Bottom left'], ['bottom-center', 'Bottom centre'], ['bottom-right', 'Bottom right'],
  ];
  // BUILD-ONCE. renderPane() runs this every 250 ms for a visible window, and the
  // placement drag calls it per mousemove -- rebuilding the DOM either time destroyed
  // the control the user was actively dragging, so slider input went nowhere. Build
  // the markup once, then only reflect values into it.
  // Shared row builders for the Preferences page (values reflected by reflectUiSettings,
  // structure built once: renderPane re-runs this at 4 Hz while the window is open).
  function uisPill(label, id, get, set, hint) {
    const r = document.createElement('div'); r.className = 'row';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = label;
    if (hint) { const sub = document.createElement('span'); sub.className = 'pf-sub'; sub.textContent = hint; k.appendChild(sub); }
    const pill = document.createElement('div'); pill.id = id; pill.className = 'al-pill' + (get() ? ' on' : '');
    pill.innerHTML = '<span></span>'; if (hint) pill.title = hint;
    pill.addEventListener('click', () => { set(!get()); pill.classList.toggle('on', !!get()); });
    pill._get = get;
    r.appendChild(k); r.appendChild(pill);
    return r;
  }
  // commitOnRelease: the setter runs on release only (input still previews the label). Needed
  // for anything that re-lays-out the page while dragging (UI scale resizes the viewport under
  // the slider, so a live setter moves the thumb away from the cursor and feeds back).
  function uisSlider(label, id, min, max, step, get, set, fmt, commitOnRelease) {
    const r = document.createElement('div'); r.className = 'row';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = label;
    const v = document.createElement('span'); v.className = 'v uis-row';
    const inp = document.createElement('input'); inp.type = 'range'; inp.id = id;
    inp.min = String(min); inp.max = String(max); inp.step = String(step); inp.value = String(get());
    const out = document.createElement('b'); out.id = id + 'v'; out.textContent = fmt(get());
    inp.addEventListener('input', () => { if (!commitOnRelease) set(Number(inp.value)); out.textContent = fmt(Number(inp.value)); });
    if (commitOnRelease) inp.addEventListener('change', () => { set(Number(inp.value)); out.textContent = fmt(Number(inp.value)); });
    inp._get = inp._get || get; inp._fmt = fmt;
    v.appendChild(inp); v.appendChild(out); r.appendChild(k); r.appendChild(v);
    return r;
  }
  function uisChipRow(label, id, chips, isOn, onPick) {
    const r = document.createElement('div'); r.className = 'row';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = label;
    const v = document.createElement('span'); v.className = 'v pf-full';
    const g = document.createElement('div'); g.className = 'uis-chips'; g.id = id;
    for (const [text, val, swatch] of chips) {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'uis-chip'; b.dataset.val = val;
      if (swatch) { const d = document.createElement('i'); d.style.cssText = 'display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:' + swatch; b.appendChild(d); }
      b.appendChild(document.createTextNode(text));
      b.addEventListener('click', () => { onPick(val); reflectUiSettings(); });
      g.appendChild(b);
    }
    g._isOn = isOn;
    v.appendChild(g); r.appendChild(k); r.appendChild(v);
    return r;
  }
  // Hide/show-all-panels hotkey state (launcher-side binding, page-side capture).
  let uisHpVk = 0, uisHpCapturing = false, uisHpPaint = null;
  function uisHpSave() { try { if (bridge().hidePanelsKeybindSet) bridge().hidePanelsKeybindSet(uisHpVk); } catch (e) {} }
  document.addEventListener('keydown', e => {
    if (!uisHpCapturing) return;
    e.preventDefault(); e.stopPropagation();
    const vk = e.keyCode || e.which || 0;
    if (vk && vk !== 27) { uisHpVk = vk; uisHpSave(); }
    uisHpCapturing = false;
    if (typeof kbGrab === 'function') kbGrab(false);
    if (uisHpPaint) uisHpPaint();
  }, true);
  function uisSep(rows) { /* sections are cards now; kept for call-site compatibility */ }
  function uisNote(rows, text) { const d = document.createElement('div'); d.className = 'pf-hint'; d.textContent = text; rows.appendChild(d); }

  function renderUiSettings() {
    const c = $('content'); if (!c) return;
    if ($('uisWrap')) { reflectUiSettings(); return; }
    c.innerHTML = '';
    const wrap = document.createElement('div'); wrap.id = 'uisWrap'; wrap.className = 'pane';
    let rows = null;
    const sec = (title) => {

    };
    // Never hold the cfg object: the durable copy can replace it after this page is built

    const cfg = new Proxy({}, { get: (_, k) => uiCfg()[k], set: (_, k, v) => { uiCfg()[k] = v; return true; } });
    const save = () => { uiCfgSave(); uiApply(); };

    // ---------------- Appearance ----------------

    rows.appendChild(uisChipRow('UI scale', 'uis_scale', [75, 90, 100, 110, 125, 150, 175, 200].map(v => [v + '%', String(v)]),

    rows.appendChild(uisChipRow('Font', 'uis_font', UI_FONTS.map(f => [f[0], f[1]]),

    rows.appendChild(uisPill('Tabular digits', 'uis_tabular', () => !!cfg.tabular, v => { cfg.tabular = v; save(); }, 'Fixed-width numerals so columns of numbers line up'));
    rows.appendChild(uisPill('Compact tooltips', 'uis_ctips', () => !!cfg.compactTips, v => { cfg.compactTips = v; save(); try { hideTip(); } catch (e) {} }, 'Hides provenance (Source, ID), explanatory lines and parenthetical asides in tooltips'));

    rows.appendChild(uisPill('Clock', 'uis_barclock', () => !!cfg.barClock, v => { cfg.barClock = v; save(); }));
    rows.appendChild(uisPill('24-hour clock', 'uis_bar24', () => !!cfg.bar24h, v => { cfg.bar24h = v; save(); }));
    rows.appendChild(uisPill('Session timer', 'uis_barsess', () => !!cfg.barSession, v => { cfg.barSession = v; save(); }, 'Time logged into the game this session (lobby and in-game)'));
    rows.appendChild(uisPill('XP per hour', 'uis_barxp', () => !!cfg.barXp, v => { cfg.barXp = v; save(); }, 'Total XP/h from the XP tracker session'));

    // ---------------- Menu ----------------
    sec('Menu');
    uisNote(rows, 'Hide categories you never open. Settings always stays.');
    rows.appendChild(uisChipRow('Show categories', 'uis_cats', CAT_META.filter(m => m.id !== 'Settings').map(m => [m.id, m.id]),
      v => !uiCatHidden(v), v => {
        const i = cfg.hiddenCats.indexOf(v);
        if (i >= 0) cfg.hiddenCats.splice(i, 1); else cfg.hiddenCats.push(v);
        save(); try { renderMenubar(); } catch (e) {}

    // ---------------- Startup ----------------
    sec('Startup');

      'Off starts with no panels open; bar position and alert placement are still remembered'));

    sec('Notifications');
    rows.appendChild(uisPill('Alerts enabled', 'uis_almaster', () => !!(alertCfg && alertCfg.master), v => { if (alertCfg) { alertCfg.master = v; saveAlertCfg(); } }));
    rows.appendChild(uisPill('Only alert when tabbed out', 'uis_alfocus', () => !!(alertCfg && alertCfg.unfocusedOnly), v => { if (alertCfg) { alertCfg.unfocusedOnly = v; saveAlertCfg(); } },

    rows.appendChild(uisSlider('Sound volume', 'uis_vol', 0, 100, 1, () => (typeof sndVol === 'number' ? sndVol : 70),
      v => { try { sndVol = v; prefSet('rtxSoundVol', String(v)); bridge().soundVolume(v); } catch (e) {} }, v => v + '%'));
    rows.appendChild(uisSlider('Popup duration', 'uis_ttl', 2000, 15000, 500, () => cfg.toastTtl || 5000, v => { cfg.toastTtl = v; save(); }, v => (v / 1000).toFixed(1) + 's'));

    // Popup placement (unchanged mechanics: stored with the per-account layout).
    const aRow = document.createElement('div'); aRow.className = 'row';
    const aLab = document.createElement('span'); aLab.className = 'k'; aLab.textContent = 'Popup anchor';
    const aWrap = document.createElement('span'); aWrap.className = 'v pf-full';
    const seg = document.createElement('div');
    seg.className = 'uis-chips'; seg.id = 'uis_anchor';
    for (const [id, label] of TOAST_ANCHORS) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = label; b.className = 'uis-chip'; b.dataset.anchor = id;
      b.addEventListener('click', () => {

    aWrap.appendChild(seg); aRow.appendChild(aLab); aRow.appendChild(aWrap);
    rows.appendChild(aRow);
    const num = (label, key) => {
      const r = document.createElement('div'); r.className = 'row';

  // ---- input-region + keyboard publishing to the host ----
  // null, not '': an empty first payload (menubar not laid out yet) must still
  // reach the host, or the dedup below swallows the very first publish.
  let _rectsQueued = false, _lastRectsPayload = null;
  function wmPushRects() {
    _rectsQueued = false;
    const b = bridge();
    if (!b || !b.uiRects) return;
    const rects = [];
    // Grow each rect by a hairline margin. Windows carry a soft drop shadow, so the
    // panel READS as bigger than its border box; without this, a click aimed at the
    // visual edge falls outside the consume region and the GAME acts on it (camera
    // spin / walk) instead of the panel. Inside the margin nothing happens, which is
    // the right outcome for a near-miss on a window edge.
    const PAD = 3;
    const add = (el) => {
      if (!el) return;
      const r = el.getBoundingClientRect();
      if (r.width > 0 && r.height > 0)
        rects.push(Math.floor(r.left - PAD) + ',' + Math.floor(r.top - PAD) + ',' +
                   Math.ceil(r.width + PAD * 2) + ',' + Math.ceil(r.height + PAD * 2));
    };
    if (!menubarHidden) add($('menubar'));
    add($('mbdrop'));
    // A locked HUD is deliberately absent: no consume rect means the companion never
    // swallows the click, so it lands in the game underneath. It keeps drawing regardless.
    for (const w of wm.wins.values()) if (!w.min && !w.locked) add(w.el);
    // Body-level popovers: they float outside any window rect, so they need their own.
    add($('sndMenu')); add($('vrPop'));
    add($('lgMenu'));
    add($('ctxCopy'));
    // Only DISMISSIBLE toasts claim input. A transient toast stays click-through so
    // it can never swallow a click meant for the game underneath it. Placement mode
    // is the exception: the whole stack must be grabbable, empty or not.
    if (toastPlacing) add($('toaster'));
    else for (const t of toasts) if (t.sticky && !t.closing) add(t.el);
    // Modal surfaces (tab search, tooltips are transient/hover-only) claim the whole
    // client: they dim everything and must swallow every click.
    if ($('tspOv') || $('vrModalOv') || $('wikiPal')) {
      rects.length = 0;
      rects.push('0,0,' + (window.innerWidth || 1280) + ',' + (window.innerHeight || 720));
    }
    const payload = rects.join(';');
    if (payload === _lastRectsPayload) return;
    _lastRectsPayload = payload;
    try { b.uiRects(myPid(), payload, !menubarHidden || rects.length > 0); } catch (e) {}
  }
  // Coalesce rect pushes to one per task; drags call wmPushRects directly per move.
  function wmRectsSoon() {
    if (_rectsQueued) return;
    _rectsQueued = true;
    setTimeout(wmPushRects, 0);
  }
  let menubarHidden = false;   // reserved: a future hide-UI toggle

  // Keyboard capture: claim the game's keystrokes only while a text field has focus.
  let _kbCaptured = false, _kbGrabs = 0;
  // Explicit claim, for panels that need the keystroke WITHOUT a focused text field -- a
  // "press any key" keybind listener is a button, so the focus test below can never see it and
  // every key went to the game instead of being captured. Refcounted: two listeners armed at
  // once must not have the first one to finish drop capture for both.
  function kbGrab(on) {
    _kbGrabs = Math.max(0, _kbGrabs + (on ? 1 : -1));
    syncKbCapture();
  }
  function syncKbCapture() {
    const t = document.activeElement;
    const typing = _kbGrabs > 0 || !!(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' ||
                            t.tagName === 'SELECT' || t.isContentEditable));
    if (typing === _kbCaptured) return;
    _kbCaptured = typing;
    try { if (bridge() && bridge().uiKeyboard) bridge().uiKeyboard(myPid(), typing); } catch (e) {}
  }
  document.addEventListener('focusin', () => setTimeout(syncKbCapture, 0));
  document.addEventListener('focusout', () => setTimeout(syncKbCapture, 0));
  // Self-heal: a focused input REMOVED by a panel rebuild fires no focusout, which left the
  // capture flag stuck on and silently ate every keystroke meant for the game. Re-derive the
  // truth from the live activeElement once a second; syncKbCapture dedups, so this is free.
  setInterval(syncKbCapture, 1000);
  // Companion-signalled: a click went to the GAME while we held keyboard capture --
  // drop focus so typing returns to the game immediately.
  window.__rtxGameClick = function () {
    try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch (e) {}
    setTimeout(syncKbCapture, 0);
  };

  // ---- Wiki palette: dimmed search overlay -> the wiki-locked in-client browser. ------
  // Opened by the host on the user's hotkey (gameui::OpenWikiPalette evaluates
  // wikiPaletteOpen()) or from any panel. Enter / the button opens the term in the
  // dedicated wiki pane; exact titles land directly on their page. The chip in the
  // footer binds the hotkey inline: click it, press a key (Esc unbinds).
  let _wkKbListen = false;
  function wikiPaletteOpen() {

      +   '<div class="wk-row">'
      +     '<input id="wkIn" class="wk-in" placeholder="Search the RuneScape Wiki..." autocomplete="off" spellcheck="false">'
      +     '<button id="wkGo" class="wk-go">Search</button>'
      +   '</div>'
      +   '<div class="wk-hint">'
      +     '<span>Enter opens in-game &middot; exact titles open directly &middot; Esc closes</span>'
      +     '<span class="wk-kb" id="wkKb" title="Click, then press the key to bind (Esc unbinds)">Hotkey: &hellip;</span>'
      +   '</div>'
      + '</div>';

    // The opening hotkey's WM_CHAR arrives AFTER the palette focuses its input (the host
    // consumes the key-down, but TranslateMessage already queued the character), so the
    // bound key used to type itself into the search box. Swallow input for the first beat.
    const openedAt = performance.now();
    const done = () => {
      if (!$('wikiPal')) return;
      _wkKbListen = false;
      kbGrab(false);
      ov.remove();

    };

    };

    ov.addEventListener('mousedown', (e) => { if (e.target === ov) done(); });

      if (_wkKbListen) {

        return;

      if (e.key === 'Enter') { e.preventDefault(); go(); }
      else if (e.key === 'Escape') { e.preventDefault(); done(); }

    wkInp.addEventListener('beforeinput', swallow);

  // ---- layout persistence (per-account host store; atomic tmp+rename native side) ----
  let _wmSaveT = 0;
  function wmSnapshot() {
    const wins = {};
    for (const [wid, w] of wm.wins) {
      wins[wid] = { tab: w.tab, tabs: w.tabs.slice(), x: Math.round(w.x), y: Math.round(w.y),
                    w: Math.round(w.w), h: Math.round(w.h), z: w.z, min: w.min ? 1 : 0,
                    roll: w.rolled ? 1 : 0, lock: w.locked ? 1 : 0 };
    }
    return { v: 1, bar: { x: wm.barX, y: wm.barY, yf: wm.barYf, pill: wm.barPill ? 1 : 0 },
             toast: { anchor: toastCfg.anchor, dx: toastCfg.dx | 0, dy: toastCfg.dy | 0, w: toastCfg.w | 0 },
             wins };
  }
  function wmSaveNow() {
    try {
      if (bridge() && bridge().layoutSave)
        bridge().layoutSave(myPid(), JSON.stringify(wmSnapshot()));
    } catch (e) {}
  }
  function wmSaveSoon() {
    if (!wm.restored) return;   // never clobber a saved layout with boot state
    if (_wmSaveT) return;
    _wmSaveT = setTimeout(() => { _wmSaveT = 0; wmSaveNow(); }, 500);
  }
  // The 500 ms debounce means a change made just before the view goes away was never written.
  // Flush any pending save on teardown.
  window.addEventListener('pagehide', () => {
    if (!wm.restored || !_wmSaveT) return;
    clearTimeout(_wmSaveT); _wmSaveT = 0;
    wmSaveNow();
  });
  async function wmLayoutRestore() {
    let saved = null;
    try {
      const s = await bridge().layoutLoad(myPid());
      saved = s ? JSON.parse(s) : null;
    } catch (e) {}
    if (!saved || saved.v !== 1) return false;   // first run, or account not resolved yet
    // Preferences: "restore panels on launch" off keeps the bar and alert placement but
    // starts with no windows open.
    if (uiCfg().restore === false) saved.wins = {};
    if (saved.bar) {
      if (typeof saved.bar.x === 'number') wm.barX = saved.bar.x;
      if (saved.bar.y === 'bottom' || saved.bar.y === 'top') wm.barY = saved.bar.y;
      if (typeof saved.bar.yf === 'number') wm.barYf = Math.min(1, Math.max(0, saved.bar.yf));
      wm.barPill = !!saved.bar.pill;
    }
    if (saved.toast && typeof saved.toast === 'object') {
      const t = saved.toast;
      if (TOAST_ANCHORS.some(a => a[0] === t.anchor)) toastCfg.anchor = t.anchor;
      if (typeof t.dx === 'number') toastCfg.dx = t.dx | 0;
      if (typeof t.dy === 'number') toastCfg.dy = t.dy | 0;
      if (typeof t.w === 'number' && t.w >= 220) toastCfg.w = t.w | 0;
      applyToastPos();
    }
    const ws = saved.wins || {};
    const order = Object.keys(ws).sort((a, b) => (ws[a].z || 0) - (ws[b].z || 0));
    for (const wid of order) {
      const st = ws[wid] || {};
      const avail = allTabs();
      // Docked set as saved, minus anything this build/account no longer shows and
      // anything an earlier window already claimed (a tab lives in exactly one window).
      const docked = Array.isArray(st.tabs) && st.tabs.length > 0;
      const ids = (docked ? st.tabs : [st.tab || wid])
        .filter(id => avail.some(x => x.id === id) && !wmWinOf(id));
      if (!ids.length) continue;              // nothing left to show -> no empty window
      const t = avail.find(x => x.id === (ids.indexOf(st.tab) >= 0 ? st.tab : ids[0]));
      // min and lock are NOT geometry: gating them on a sane w/h meant a window saved without
      // usable dimensions came back un-minimized and unlocked. Pass them either way and let
      // wmCreateWindow fall back to the default size/position when the box is unusable.
      const geom = (st.w > 0 && st.h > 0)
        ? { x: st.x | 0, y: st.y | 0, w: st.w | 0, h: st.h | 0, min: !!st.min, lock: !!st.lock }
        : { min: !!st.min, lock: !!st.lock, nogeom: 1 };
      const w2 = openTab(t, { noFocus: true, geom, restoring: true });
      // Only a docking-era save overrides the set openTab built; a pre-docking layout
      // has no `tabs` and must keep its group's members.
      if (w2 && docked) wmSetTabs(w2, ids);
      if (w2 && st.roll) wmToggleRoll(w2);
    }
    wm.restored = true;
    renderMenubar();
    syncMarkerArm();
    wmRectsSoon();
    return true;
  }

  // Open (or focus) the window for a tab. `t` = a tab object from allTabs().
  // opts: { noFocus, geom:{x,y,w,h,min} } for layout restore.
  function openTab(t, opts) {
    opts = opts || {};
    // Opening a window IS a layout change, but wmSaveSoon refuses to write until wm.restored,
    // and wm.dirty was only ever set by a drag or resize. So on a first run -- or during the
    // up-to-60s window while the account is still resolving and layoutLoad returns {} -- every
    // window the user opened was discarded unless they happened to drag one. Restores pass
    // `restoring` so replaying a saved layout does not mark it dirty.
    if (!opts.restoring) wm.dirty = true;
    const g = TAB_GROUP_OF[t.id] || null;
    let w = wmWinOf(t.id);   // wherever it is docked, not where its group would put it
    if (w) {
      if (w.tab !== t.id) wmSwitchTab(w, t);
      if (w.min) wmRestore(w);
      wmFocus(w);
      closeMbDrop();
      wmRectsSoon(); wmSaveSoon();
      return w;
    }
    w = wmCreateWindow(wmMintWid(t.id), t, g, opts.geom || null);
    if (g) { try { localStorage.setItem('rtxGrpLast:' + g.id, t.id); } catch (e) {} }
    if (!opts.noFocus && !w.min) wmFocus(w);
    if (!w.min) renderPaneFor(w);
    withPane(w, () => tabEntryKicks(w.tab));
    renderMenubar();
    closeMbDrop();
    wmRectsSoon(); wmSaveSoon();
    return w;
  }

  // Keep every window reachable when the client shrinks or DPI changes.
  window.addEventListener('resize', () => {
    for (const w of wm.wins.values()) { wmClamp(w); wmApplyGeom(w); }
    positionMenubar();
    applyToastPos();     // anchored, so it re-derives from the new client size
    wmRectsSoon();
  });

  // Pull the relevant data immediately on entering a tab rather than waiting for the next
  // poll -- and ARM anything the tab owns (vars observer, netprobe capture). Split out of
  // openTab so the dev hot-reload boot restore runs the SAME entry actions: a restored
  // Vars tab must arm its observer or varWatchOn stays false while the host observer from
  // the pre-reload page stays armed forever (the mismatched disarm early-returns).
  function tabEntryKicks(id) {
    if (id === 'bank') { bankFetchKey = ''; fetchBank(); }
    if (id === 'metalbank') { mbankFetchKey = ''; fetchMetalBank(); }
    if (id === 'groupbank') { gbankFetchKey = ''; fetchGroupBank(); }
    if (id === 'materials') { matFetchKey = ''; fetchMaterials(); }
    if (id === 'baitbox') { baitFetchKey = ''; fetchBaitBox(); }
    if (id === 'artefacts') { wbFetchKey = ''; fetchWorkbench(); fetchArchShop(); }
    if (id === 'inventory') { invSig = ''; fetchInv(); }
    if (id === 'components') { compSig = ''; fetchComponents(); }
    if (id === 'machines') fetchMachinesTab();
    if (id === 'equipment') { equipSig = ''; fetchEquip(); }
    if (id === 'storage') { storageSig = ''; fetchStorage(); }
    if (id === 'abilities') fetchAbilities();
    if (id === 'pets') { petsListSig = ''; fetchPets(true); }
    if (id === 'bosses') { bossListSig = ''; fetchBosses(true); }
    if (id === 'quests') { questListSig = ''; fetchQuests(true); qgEnsureLoaded(); }
    if (id === 'questfocus') { qgSig = ''; fetchQuests(true); qgEnsureLoaded(); }
    if (id === 'xptracker') { applyXpOverlay(); fetchXpTracker(true); }   // apply even when hidden: it starts the 1 Hz sampler
    if (id === 'xpmeter') { applyXpOverlay(); fetchXpTracker(true); }     // same sampler; the meter is the readout

  // ==================== Menu bar ====================
  // Slim glass bar: category launchers + player status + search. Draggable to any
  // x position along the top or bottom edge; collapsible to a pill. State rides
  // the layout store. renderSidebar stays as an alias -- panel code and the GIM
  // visibility poll still call it.
  function positionMenubar() {
    const bar = $('menubar');
    if (!bar) return;
    const vw = window.innerWidth || 1280;
    const bw = bar.offsetWidth || 320;
    let x = (typeof wm.barX === 'number') ? Math.round(vw * wm.barX - bw / 2) : Math.round((vw - bw) / 2);
    x = Math.max(6, Math.min(vw - bw - 6, x));
    bar.style.left = x + 'px';
    bar.style.transform = 'none';
    if (typeof wm.barYf === 'number') {
      // Free placement: any vertical position, always clamped inside the game frame.
      const vh = window.innerHeight || 720, bh = bar.offsetHeight || 38;
      let y = Math.round(vh * wm.barYf - bh / 2);
      y = Math.max(6, Math.min(vh - bh - 6, y));
      bar.style.bottom = 'auto'; bar.style.top = y + 'px';
      wm.barY = (y + bh / 2 > vh / 2) ? 'bottom' : 'top';   // dropdown and toast sides follow the half it sits in
    } else if (wm.barY === 'bottom') { bar.style.top = 'auto'; bar.style.bottom = '10px'; }
    else { bar.style.bottom = 'auto'; bar.style.top = '10px'; }
    // The toast stack sits under the bar when it is docked top, and at the top of
    // the screen when the bar moves to the bottom.
    document.body.classList.toggle('bar-bottom', wm.barY === 'bottom');
  }
  function closeMbDrop() {
    wm.mbDrop = null;
    const dd = $('mbdrop');
    if (dd) dd.remove();
    const bar = $('menubar');
    if (bar) bar.querySelectorAll('.mb-cat.open').forEach(b => b.classList.remove('open'));
    wmRectsSoon();
  }
  // The rows a category's menu shows. A TAB_GROUP collapses to ONE row, so this is what the user
  // actually sees rather than the raw tab list. Shared by the dropdown and by the single-entry
  // shortcut in renderMenubar, so a click behaves identically whichever path it arrives through.
  // Recomputed per click, never cached: Plugins grows and shrinks as plugins are installed.
  function mbCatEntries(catId) {
    const out = [], emitted = {};
    for (const t of allTabs()) {
      if (t.hidden) continue;
      if ((t.cat || 'General') !== catId) continue;
      const g = TAB_GROUP_OF[t.id];
      if (g && emitted[g.id]) continue;
      if (g) emitted[g.id] = true;
      out.push({ label: g ? g.label : t.label,
                 win:    g ? wmWinOfAny(g.tabs) : wmWinOf(t.id),
                 target: g ? groupEntryTab(g)   : t,
                 // Every tab this row owns, so closing can scope itself to them. Copied: closing
                 // splices tab arrays, and g.tabs is the shared TAB_GROUPS definition.
                 ids:    g ? g.tabs.slice()     : [t.id] });
    }
    return out;
  }
  // Route through the TAB, not the window: after docking, w may be showing an UNRELATED tab, and
  // acting on it there hits the host instead of what was asked for. Only toggle when the requested
  // tab is ALREADY shown.
  function mbActivate(e) {
    const w = e.win, target = e.target;
    if (w && (!target || w.tabs.indexOf(target.id) >= 0)) {
      const wasMin = w.min;
      if (wasMin) wmRestore(w);
      if (target && w.tab !== target.id) { wmSwitchTab(w, target); wmFocus(w); closeMbDrop(); return; }
      if (!wasMin) {
        // Open and showing: the menu entry is a toggle and it CLOSES. This used to minimize, which
        // left the window alive behind a restore chip and read as the click having done nothing.
        // Scope it to the tabs this ROW owns: a window can hold panels docked in from elsewhere,
        // and those must survive. Only when the row accounts for every tab does the window go.
        const mine = e.ids || (target ? [target.id] : []);
        if (mine.length && w.tabs.every(id => mine.indexOf(id) >= 0)) wmClose(w.wid);
        else mine.forEach(id => { if (w.tabs.indexOf(id) >= 0) wmCloseTabIn(w, id); });
        closeMbDrop();
        return;
      }
      wmFocus(w); closeMbDrop(); return;
    }
    if (target) openTab(target);   // lives in another window (or nowhere): openTab finds it
  }
  function openMbDrop(catId, btn) {
    closeMbDrop();
    wm.mbDrop = catId;
    btn.classList.add('open');
    const dd = document.createElement('div');
    dd.id = 'mbdrop';
    // No category heading: the bar button above it is the label, and it stays lit
    // while its menu is open. (It earned its place when the button was an icon.)
    for (const e of mbCatEntries(catId)) {
      const w = e.win, target = e.target;
      const b = document.createElement('button');
      // Lit only when the requested TAB is on screen -- after docking, w can hold it while
      // showing something else, and rolled hides the body just like minimized does.
      b.className = 'tab' + ((w && !w.min && !w.rolled && target && w.tab === target.id) ? ' is-active' : '');
      b.innerHTML = '<span class="tab-label"></span>' + (w ? '<span class="tab-on"></span>' : '');
      b.querySelector('.tab-label').textContent = e.label;
      b.addEventListener('click', () => mbActivate(e));
      dd.appendChild(b);
    }
    document.body.appendChild(dd);
    const br = btn.getBoundingClientRect();
    const vw = window.innerWidth || 1280, vh = window.innerHeight || 720;
    let x = Math.round(br.left - 8);
    x = Math.max(6, Math.min(vw - (dd.offsetWidth || 220) - 6, x));
    dd.style.left = x + 'px';
    if (wm.barY === 'bottom') dd.style.bottom = Math.round(vh - br.top + 8) + 'px';
    else dd.style.top = Math.round(br.bottom + 8) + 'px';
    wmRectsSoon();
  }
  document.addEventListener('mousedown', (e) => {
    if (!wm.mbDrop) return;
    if (e.target && e.target.closest && (e.target.closest('#mbdrop') || e.target.closest('#menubar'))) return;
    closeMbDrop();
  }, true);

  function renderMenubar() {
    const bar = $('menubar');
    if (!bar) return;
    const keepDrop = wm.mbDrop;
    bar.classList.toggle('pill', !!wm.barPill);
    bar.innerHTML = '';
    // Drag handle (grip dots): move along the top/bottom edges.
    const drag = document.createElement('div');
    drag.className = 'mb-drag';
    drag.title = 'Move bar';
    drag.innerHTML = '<i class="g g-grip"></i>';
    drag.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      bar.classList.add('dragging');
      // Keep the grab point under the cursor: the bar is positioned by its centre, so carry
      // the offset from where it was grabbed to its centre through the whole drag.
      const r0 = bar.getBoundingClientRect();
      const offX = (r0.left + r0.width / 2) - e.clientX, offY = (r0.top + r0.height / 2) - e.clientY;
      const mv = (ev) => {
        const vw = window.innerWidth || 1280, vh = window.innerHeight || 720;
        wm.barX = Math.min(0.98, Math.max(0.02, (ev.clientX + offX) / Math.max(1, vw)));
        wm.barYf = Math.min(1, Math.max(0, (ev.clientY + offY) / Math.max(1, vh)));
        positionMenubar();
        wmPushRects();
      };
      const up = () => {
        document.removeEventListener('mousemove', mv);
        document.removeEventListener('mouseup', up);
        bar.classList.remove('dragging');
        wmSaveSoon();
      };
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', up);
    });
    bar.appendChild(drag);
    // Category launchers (a dot marks categories with open windows).
    const cats = document.createElement('nav');
    cats.className = 'mb-cats';
    // A vertical wheel over an x-only scroller is not reliably translated for us, and the
    // categories only overflow on a small client -- exactly when the user most needs to
    // reach them. Map the wheel by hand, and only consume it when there is somewhere to go.
    cats.addEventListener('wheel', (e) => {
      const max = cats.scrollWidth - cats.clientWidth;
      if (max <= 0) return;
      const d = (Math.abs(e.deltaX) > Math.abs(e.deltaY)) ? e.deltaX : e.deltaY;
      if (!d) return;
      const before = cats.scrollLeft;
      cats.scrollLeft = Math.max(0, Math.min(max, before + d));
      if (cats.scrollLeft !== before) e.preventDefault();
    }, { passive: false });
    const openCats = new Set();
    for (const w of wm.wins.values()) for (const id of w.tabs) {
      const t = allTabs().find(x => x.id === id);   // every docked tab, not just the shown one
      if (t) openCats.add(t.cat || 'General');
    }
    for (const c of railCategories()) {
      const b = document.createElement('button');
      b.className = 'mb-cat' + (openCats.has(c.id) ? ' has-open' : '');
      b.title = c.id;
      b.dataset.cat = c.id;
      b.textContent = c.id;          // a legible word beats a 17px line glyph
      b.addEventListener('click', () => {
        if (wm.mbDrop === c.id) { closeMbDrop(); return; }
        // A category holding one panel would open a menu of one row repeating the button's own
        // label (Quests > Quests), which is a question with a single answer. Open it directly.
        // Five of the ten categories are like this, and Plugins joins them when nothing is
        // installed, so the count is measured here per click rather than declared in CAT_META.
        const es = mbCatEntries(c.id);
        if (es.length === 1) { closeMbDrop(); mbActivate(es[0]); return; }
        openMbDrop(c.id, b);
      });
      cats.appendChild(b);
    }
    bar.appendChild(cats);
    // Minimized-window chips: a minimized window stays visibly PRESENT here (it
    // looked "completely closed" without an affordance); click restores it.
    const minimized = Array.from(wm.wins.values()).filter(w => w.min);
    if (minimized.length && !wm.barPill) {
      const chips = document.createElement('div');
      chips.className = 'mb-chips';
      for (const w of minimized) {
        const t = allTabs().find(x => x.id === w.tab) || { label: w.tab, icon: '' };
        const lbl = wmIsWholeGroup(w) ? w.group.label : t.label;   // same rule as the title bar
        const chip = document.createElement('button');
        chip.className = 'mb-chip';
        chip.title = 'Restore ' + lbl;
        chip.innerHTML = '<span></span>';
        chip.querySelector('span').textContent = lbl;
        chip.addEventListener('click', () => { wmRestore(w); wmFocus(w); });
        chips.appendChild(chip);
      }
      bar.appendChild(chips);
    }
    // Player status: renderHeader() writes these ids (kept from the old header).
    const st = document.createElement('div');
    st.className = 'mb-status';
    st.innerHTML = '<div class="title" id="hdr-title"><span class="dot"></span>' +
                   '<span id="hdr-name">--</span></div><div class="meta" id="hdr-meta">--</div>';
    bar.appendChild(st);
    const info = document.createElement('div'); info.className = 'mb-info'; info.id = 'hdr-info';
    bar.appendChild(info);
    try { uiBarTick(); } catch (e) {}
    // Search + pill toggle.
    const search = document.createElement('button');
    search.className = 'mb-btn mb-search';
    search.title = 'Search panels (Ctrl+K)';
    search.textContent = 'Search';
    search.addEventListener('click', openTabSearch);
    bar.appendChild(search);
    // Borderless fullscreen moved off the bar into its own panel (Utility > Fullscreen,
    // renderFullscreen) -- the bar keeps only window chrome: search, chips, collapse.
    const pill = document.createElement('button');
    pill.className = 'mb-btn';
    pill.title = wm.barPill ? 'Expand bar' : 'Collapse bar';
    // Guillemets: plain Latin-1 text, so they cannot mis-render the way paths did.
    pill.textContent = wm.barPill ? '»' : '«';
    pill.addEventListener('click', () => { wm.barPill = !wm.barPill; closeMbDrop(); renderMenubar(); wmSaveSoon(); });
    bar.appendChild(pill);
    positionMenubar();
    _hdrSig = '';                       // status ids were rebuilt: force a header repaint
    try { renderHeader(); } catch (e) {}
    // Keep an open dropdown alive across rebuilds (open-state dots change under it).
    if (keepDrop) {
      const btn = bar.querySelector('.mb-cat[data-cat="' + keepDrop + '"]');
      wm.mbDrop = null;
      if (btn) openMbDrop(keepDrop, btn);
    }
    wmRectsSoon();
  }
  function renderSidebar() { renderMenubar(); }

  // Fullscreen panel (Utility): borderless fullscreen for the embedded client. It was a
  // button on the main bar; it lives in its own panel now. The GAME's own Fullscreen
  // option cannot work while embedded (its window is our child, clipped to the host),
  // so this drives the HOST: it takes the whole monitor and the game comes with it.
  // ---- Wiki pane: launcher + settings for the in-client wiki browser. The browser

    inp.style.flex = '1'; inp.spellcheck = false;

    const open = () => { try { bridge().wikiOpen(myPid(), (inp.value || '').trim()); } catch (e) {} };

    const kbRow = document.createElement('div');

    const kbLbl = document.createElement('span'); kbLbl.className = 'ov-hint'; kbLbl.style.margin = '0';
    const kbBtn = document.createElement('button'); kbBtn.className = 'dg-sync-btn';

        // reads as "typing" on its next press and feeds the UI instead of the keybind
        // (seen live as "I had to press the hotkey twice").
        try { if (document.activeElement) document.activeElement.blur(); } catch (e3) {}

    kbRow.appendChild(kbLbl); kbRow.appendChild(kbBtn);
    wrap.appendChild(kbRow);

  function renderFullscreen() {

  // ---- Tab search palette (Ctrl+K / '/' / the rail magnifier): type to jump to any
  //      panel, plugin tabs included. Arrow keys + Enter select; Esc / backdrop close. ----
  let tspSel = 0;
  function tspEntries(q) {
    const all = allTabs().filter(t => !t.hidden);
    if (!q) return all;
    const s = q.toLowerCase();
    const score = t => {
      const l = t.label.toLowerCase(), c = (t.cat || '').toLowerCase();
      if (l.startsWith(s)) return 0;
      if (l.split(/\s+/).some(w => w.startsWith(s))) return 1;
      if (l.includes(s)) return 2;
      if (c.startsWith(s)) return 3;
      if (c.includes(s)) return 4;
      return -1;
    };
    return all.map(t => [score(t), t]).filter(p => p[0] >= 0)
              .sort((a, b) => a[0] - b[0]).map(p => p[1]);
  }
  function tspJump(t) {
    closeTabSearch();
    openTab(t);
  }
  function tspRenderList() {
    const list = $('tspList'); if (!list) return;
    const inp = $('tspIn');
    const es = tspEntries(inp ? inp.value.trim() : '');
    if (tspSel >= es.length) tspSel = es.length ? es.length - 1 : 0;
    list.innerHTML = '';
    if (!es.length) {
      const d = document.createElement('div'); d.className = 'tsp-empty'; d.textContent = 'No matching panel';
      list.appendChild(d); return;
    }
    es.forEach((t, i) => {
      const r = document.createElement('div');
      r.className = 'tsp-row' + (i === tspSel ? ' sel' : '');
      r.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round">' + (t.icon || '') + '</svg>' +
        '<span></span><span class="tsp-cat"></span>';
      r.children[1].textContent = t.label;
      r.children[2].textContent = t.cat || '';
      r.addEventListener('click', () => tspJump(t));
      r.addEventListener('mousemove', () => { if (tspSel !== i) { tspSel = i; tspRenderList(); } });
      list.appendChild(r);
    });
    const sel = list.children[tspSel];
    if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
  }
  function closeTabSearch() {
    // Blur any focused field first, or the host keeps keyboard capture forever
    // (focusout never fires for removed nodes in Ultralight).
    const ov = $('tspOv');
    if (ov) {
      try { const a = document.activeElement; if (a && ov.contains(a)) a.blur(); } catch (e) {}
      ov.remove();
    }
    wmRectsSoon();
  }
  function openTabSearch() {
    if ($('tspOv')) { closeTabSearch(); return; }     // second Ctrl+K toggles it away
    tspSel = 0;
    const ov = document.createElement('div'); ov.className = 'tsp-ov'; ov.id = 'tspOv';
    ov.addEventListener('click', e => { if (e.target === ov) closeTabSearch(); });
    const box = document.createElement('div'); box.className = 'tsp-box';
    const inp = document.createElement('input');
    inp.className = 'tsp-in'; inp.id = 'tspIn'; inp.type = 'text';
    inp.placeholder = 'Jump to panel…';
    inp.autocomplete = 'off'; inp.spellcheck = false;
    const list = document.createElement('div'); list.className = 'tsp-list'; list.id = 'tspList';
    inp.addEventListener('input', () => { tspSel = 0; tspRenderList(); });
    inp.addEventListener('keydown', e => {
      const es = tspEntries(inp.value.trim());
      if (e.key === 'ArrowDown')      { e.preventDefault(); if (es.length) { tspSel = (tspSel + 1) % es.length; tspRenderList(); } }
      else if (e.key === 'ArrowUp')   { e.preventDefault(); if (es.length) { tspSel = (tspSel + es.length - 1) % es.length; tspRenderList(); } }
      else if (e.key === 'Enter')     { e.preventDefault(); if (es[tspSel]) tspJump(es[tspSel]); }
      else if (e.key === 'Escape')    { e.preventDefault(); closeTabSearch(); }
      else if (e.key === 'Backspace' && (e.ctrlKey || e.altKey)) {
        // Delete the previous word. The host drops the control character this combo produces
        // (it would otherwise be typed as a box), so without this the key would do nothing.
        e.preventDefault();
        const end = inp.selectionStart === inp.selectionEnd ? inp.selectionStart : inp.selectionEnd;

          if (geCollLine(cell, i)) cell.classList.remove('is-empty');
          grid.appendChild(cell);
          continue;
        }
        const type = (g.type === 0) ? 'buy' : 'sell';
        cell.classList.add('ge-' + type);
        const isComplete = (g.status === 5);
        cell.classList.add(isComplete ? 'is-complete' : 'is-active');
        const stateLabel = isComplete ? 'Complete' : 'Active';
        cell.dataset.itemId = String(g.item_id);
        cell.dataset.slot   = String(i + 1);
        cell.dataset.state  = stateLabel;
        attachInfo(cell, g.item_id, i, stateLabel);

        const row1 = document.createElement('div'); row1.className = 'ge-row1';
        const dot  = document.createElement('span'); dot.className = 'ge-state-dot';
        const ico  = document.createElement('div'); ico.className = 'ge-icon';
        ico.dataset.itemId = String(g.item_id);
        attachIcon(ico, g.item_id);
        const t    = document.createElement('span'); t.className = 'ge-type';
        t.textContent = type.toUpperCase();
        row1.appendChild(dot);
        row1.appendChild(ico);
        row1.appendChild(t);
        cell.appendChild(row1);

        const price = document.createElement('div'); price.className = 'ge-price';
        price.textContent = fmtGp(g.price) + ' gp';
        cell.appendChild(price);

        const prog  = document.createElement('div'); prog.className = 'ge-progress';

          '<span class="filled">' + g.filled.toLocaleString() + '</span>' +
          '<span> / ' + g.quantity.toLocaleString() + '</span>';

        if (g.filled_value > 0) {
          const val = document.createElement('div'); val.className = 'ge-value';

        grid.appendChild(cell);

      wrap.appendChild(grid);

    } else {

      {

  let _hdrSig = '';

    if (!s) {
      inWorld = false; nameTxt = 'PID ' + myPid(); metaTxt = 'Connecting...';
    } else {
      inWorld = !!s.in_world;
      nameTxt = nameHidden ? 'Hidden' : (s.display_name || ('PID ' + s.pid));
      // Leagues worlds are flagged: their Voice of Seren / world events are a separate
      // pool, so knowing which one you are on explains why the crowdsourced values differ.
      let wtag = '';
      if (s.world > 0) {
        let lg = false;
        try { lg = !!(bridge() && bridge().isLeaguesWorld && bridge().isLeaguesWorld(s.world)); } catch (e) {}
        wtag = (uiCfg().hideWorld ? 'World hidden' : ('World ' + s.world + (lg ? ' (Leagues)' : ''))) + ' • ';
      }
      metaTxt = wtag + fmtStatus(s);
    }
    const sig = (inWorld ? '1' : '0') + '|' + nameTxt + '|' + metaTxt;
    if (sig === _hdrSig) return;                 // unchanged -> no DOM writes this poll
    _hdrSig = sig;

  }

  async function refresh() {
    if (!bridge()) return;
