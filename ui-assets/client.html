<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RuneTools client</title>
<style>
  :root {
    --bg:           #0b0d12;
    --bg-elev:      #11141c;
    --bg-elev-2:    #161a25;
    --border:       #1f2433;
    --border-hi:    #2d3447;
    --text:         #eef0f5;
    --text-dim:     #aab0bf;
    --text-mute:    #6b7388;
    --accent-hi:    #8c6ffd;
    --accent-lo:    #6a4ee0;
    --accent:       #8c6ffd;   /* was referenced but never defined; Preferences drives all three */
    --font-ui:      'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    --font-size:    13px;
    --accent-rgb:   140,111,253;   /* every tinted accent surface derives from this */
    --accent-ring:  rgba(var(--accent-rgb),0.28);
    --ok:           #4dd28a;
    --tx-fast:      120ms;
    --ease:         cubic-bezier(.4,0,.2,1);
    /* In-game window system */
    --win-bg:       rgba(12, 14, 20, 0.93);
    --win-radius:   10px;
    --win-shadow:   0 14px 44px rgba(0,0,0,0.55), 0 3px 10px rgba(0,0,0,0.40);
    --win-shadow-f: 0 16px 50px rgba(0,0,0,0.60), 0 0 0 1px var(--accent-ring),
                    0 3px 12px rgba(0,0,0,0.45);
    --bar-bg:       rgba(12, 14, 20, 0.90);
    --tx-med:       160ms;
  }
  * { box-sizing: border-box; }
  /* Preferences: high contrast lifts the dim/mute text and borders; reduce-motion kills every
     animation and transition (aura pulses, toast bars, pill slides) for motion-sensitive users. */
  html.hc { --text-dim: #d6dae4; --text-mute: #a3abbe; --border: #3a4257; --border-hi: #55607a; }
  html.nomotion *, html.nomotion *::before, html.nomotion *::after { animation: none !important; transition: none !important; }
  html.tabnums body { font-variant-numeric: tabular-nums; }
  /* Bar info chips (Preferences > Bar): clock, session timer, XP/h. Hidden when none enabled. */
  .mb-info { display: flex; align-items: center; gap: 10px; padding: 0 10px; margin: 0 2px; flex: none;
             border-right: 1px solid var(--border); font-size: 11px; color: var(--text-dim);
             font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mb-info:empty { display: none; }
  .mb-info b { color: var(--text); font-weight: 600; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    /* TRANSPARENT on purpose: this page is composited OVER the game frame; only
       the menu bar and windows paint pixels. An opaque body hides the game. */
    background: transparent;
    color: var(--text);
    font-family: var(--font-ui); font-size: var(--font-size); line-height: 1.5;
    /* WebKit (Ultralight) honours the -webkit- prefix; the unprefixed form alone
       doesn't stop drag-selection in this engine. */
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }
  input, textarea, [contenteditable="true"] {
    -webkit-user-select: text; user-select: text;
  }

  /* ==================== In-game desktop: menu bar + floating windows ==================== */
  #desktop { position: fixed; inset: 0; overflow: hidden; }

  /* --- Menu bar: slim glass pill, draggable, edge-dockable --- */
  #menubar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: stretch; gap: 2px;
    /* The bar is content-sized, so on a small client it used to run off the edge: the
       position clamp could only pin it to x=6 and the overflow stayed. Cap it to the client
       and let the middle sections give way instead (see .mb-cats / .mb-status). */
    max-width: calc(100vw - 12px); box-sizing: border-box;
    height: 38px; padding: 4px 6px;
    background: var(--bar-bg);
    border: 1px solid var(--border-hi);
    border-radius: 12px;
    box-shadow: var(--win-shadow);
    z-index: 100000;
    will-change: transform;
    contain: paint;
  }
  #menubar.dragging { transition: none; }
  #menubar.pill { padding: 4px; }
  /* Collapsed: drop the category rail, status readout and restore chips, but KEEP
     search -- it is the one control that still reaches every panel from the pill,
     so without it the collapsed bar can only be expanded again. */
  #menubar.pill .mb-cats, #menubar.pill .mb-status, #menubar.pill .mb-chips { display: none; }
  .mb-drag {
    display: flex; align-items: center; padding: 0 7px 0 5px;
    color: var(--text-mute); cursor: grab; border-radius: 8px; flex: none;
  }
  .mb-drag:active { cursor: grabbing; }
  .mb-drag svg { width: 14px; height: 14px; }
  /* Categories scroll rather than force the bar wider, the same trade the chip strip
     already makes. They shrink last: the status readout gives way first. */
  .mb-cats {
    display: flex; align-items: stretch; gap: 2px;
    min-width: 0; flex: 1 1 auto; overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .mb-cats::-webkit-scrollbar { display: none; }
  .mb-cat {
    appearance: none; background: transparent; border: none; position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 36px; border-radius: 8px; color: var(--text-mute); cursor: pointer;
    transition: background var(--tx-fast) var(--ease), color var(--tx-fast) var(--ease);
  }
  .mb-cat { width: auto; padding: 0 10px; font: inherit; font-size: 11.5px; font-weight: 500;
            flex: none; white-space: nowrap; }
  .mb-cat:hover { background: var(--bg-elev-2); color: var(--text); }
  .mb-cat.open { background: linear-gradient(180deg, rgba(var(--accent-rgb),0.30), rgba(var(--accent-rgb),0.12)); color: #fff; }
  .mb-cat.has-open::after {
    content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent-hi);
  }
  /* Shrinks BEFORE the categories do (flex-shrink 3 vs their 1): a truncated character name
     costs less than losing access to a panel. Both texts ellipsis rather than wrap, because
     the bar is a fixed 38px tall. */
  .mb-status {
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 12px; margin: 0 2px; min-width: 0; flex: 0 3 auto; overflow: hidden;
    border-left: 1px solid var(--border); border-right: 1px solid var(--border);
  }
  .mb-status .title { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 12px; line-height: 1.25; min-width: 0; }
  .mb-status .title > span:not(.dot) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mb-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-mute);
                    transition: background var(--tx-fast) var(--ease); flex: none; }
  .mb-status .title.is-in .dot { background: var(--ok); box-shadow: 0 0 6px rgba(77,210,138,0.7); }
  .mb-status .meta { font-size: 10px; color: var(--text-mute); font-variant-numeric: tabular-nums;
                     letter-spacing: 0.02em; line-height: 1.25; white-space: nowrap;
                     overflow: hidden; text-overflow: ellipsis; }
  /* Restore chips for minimized windows. Capped so the bar can never grow with the number of
     open windows, but SCROLLABLE rather than clipped: overflow:hidden alone silently swallowed
     every chip past the cap, so with enough windows minimized the later ones simply vanished
     from the bar. (They were never unreachable - their category menu still restores them - but
     a control that disappears with no trace reads as a bug.) Scrollbar hidden: a 24px strip has
     no room for one, and the chips scroll on the wheel. */
  .mb-chips {
    display: flex; align-items: center; gap: 3px;
    padding: 0 4px; margin: 0 2px;
    border-left: 1px solid var(--border);
    max-width: 260px; min-width: 0; flex: 0 2 auto;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .mb-chips::-webkit-scrollbar { display: none; }
  .mb-chip {
    appearance: none; border: 1px solid var(--border); background: rgba(var(--accent-rgb),0.08);
    display: flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 9px 0 6px; border-radius: 999px;
    color: var(--text-dim); cursor: pointer;
    font: inherit; font-size: 10.5px; white-space: nowrap;
    transition: background var(--tx-fast) var(--ease), color var(--tx-fast) var(--ease),
                border-color var(--tx-fast) var(--ease);
  }
  .mb-chip svg { width: 12px; height: 12px; flex: none; color: var(--accent-hi); opacity: 0.85; }
  .mb-chip:hover { background: rgba(var(--accent-rgb),0.18); color: var(--text); border-color: rgba(var(--accent-rgb),0.5); }
  .mb-chip span { max-width: 88px; overflow: hidden; text-overflow: ellipsis; }
  /* Search and the collapse pill never shrink: the pill is the only way back from a
     squeezed bar, and search is the only control that still reaches every panel. */
  .mb-btn {
    appearance: none; background: transparent; border: none; flex: none;
    display: flex; align-items: center; justify-content: center;
    padding: 0 10px; border-radius: 8px; color: var(--text-mute); cursor: pointer;
    font: inherit; font-size: 11.5px; font-weight: 500; white-space: nowrap;
    transition: background var(--tx-fast) var(--ease), color var(--tx-fast) var(--ease);
  }
  .mb-btn:hover { background: var(--bg-elev-2); color: var(--text); }
  .mb-btn.on { color: var(--accent-hi); border-color: var(--accent-hi); }

  /* --- Category dropdown --- */
  #mbdrop {
    position: absolute; z-index: 100001;
    min-width: 210px; max-height: 60vh; overflow-y: auto;
    background: var(--bar-bg);
    border: 1px solid var(--border-hi); border-radius: 12px;
    box-shadow: var(--win-shadow);
    padding: 6px;
    animation: mbdrop-in var(--tx-med) var(--ease);
  }
  @keyframes mbdrop-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  #mbdrop::-webkit-scrollbar { width: 8px; }
  #mbdrop::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .tab {
    appearance: none; background: transparent; border: none;
    color: var(--text-dim); text-align: left; width: 100%;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    font: inherit; font-size: 12px; font-weight: 500;
    cursor: pointer; position: relative;
    transition: background var(--tx-fast) var(--ease), color var(--tx-fast) var(--ease);
  }
  .tab svg { width: 16px; height: 16px; flex: 0 0 16px; opacity: 0.85; }
  .tab .tab-label { line-height: 1; flex: 1; }
  .tab:hover { background: var(--bg-elev-2); color: var(--text); }
  .tab.is-active { color: #fff; }
  .tab.is-active svg { opacity: 1; color: var(--accent-hi); }
  .tab .tab-on { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-hi); flex: none; }

  /* --- Floating windows --- */
  .win {
    position: absolute;
    display: flex; flex-direction: column;
    min-width: 240px; min-height: 140px;
    background: var(--win-bg);
    border: 1px solid var(--border-hi);
    border-radius: var(--win-radius);
    box-shadow: var(--win-shadow);
    overflow: hidden;
    contain: paint;
    will-change: transform;
  }
  .win.focus { border-color: rgba(var(--accent-rgb),0.55); box-shadow: var(--win-shadow-f); }
  .win.opening { animation: win-in var(--tx-med) var(--ease); }
  @keyframes win-in { from { opacity: 0; transform: scale(0.965); } to { opacity: 1; transform: none; } }
  .win.dragging, .win.sizing { transition: none; }
  .win-title {
    flex: none; display: flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 6px 0 11px;
    background: linear-gradient(180deg, rgba(var(--accent-rgb),0.10), rgba(var(--accent-rgb),0.02));
    border-bottom: 1px solid var(--border);
    cursor: grab;
  }
  .win-title:active { cursor: grabbing; }
  .win.focus .win-title { background: linear-gradient(180deg, rgba(var(--accent-rgb),0.18), rgba(var(--accent-rgb),0.04)); }
  .win-title { padding-left: 12px; }
  .win-name {
    flex: 1; min-width: 0;
    font-size: 12px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Tab strip (group members AND docked panels): its OWN row under the title bar, so it
     never squeezes the window name and never clips its tail -- pills wrap at narrow
     widths. A solo window renders no pills, so :empty hides the row entirely. */
  /* EVERY tab is the same shape -- an equal pill of equal height -- so the row reads
     as one control and only fill/weight marks the active one. Styling just the active
     tab as a pill left the row ragged, and a wrapped active tab looked like a stray
     control on its own line. */
  .win-tabs {
    flex: none; display: flex; flex-wrap: wrap; gap: 3px;
    padding: 7px 10px 2px;
    border-bottom: 1px solid var(--border);
  }
  .win-tabs:empty { display: none; }
  .win.rolled .win-tabs { display: none; }
  .win-tabs button {
    display: inline-flex; align-items: center; gap: 4px;
    height: 23px; padding: 0 5px 0 9px;
    font: inherit; font-size: 11px; font-weight: 500;
    border-radius: 6px; cursor: pointer; white-space: nowrap;
    border: 1px solid transparent; background: transparent; color: var(--text-mute);
    transition: color var(--tx-fast) var(--ease), background var(--tx-fast) var(--ease),
                border-color var(--tx-fast) var(--ease);
  }
  .win-tabs button.solo { padding-right: 9px; }        /* nothing to close: no reserved slot */
  .win-tabs button:hover { color: var(--text); background: var(--bg-elev-2); }
  .win-tabs button.on {
    color: #cfc2ff; font-weight: 600;
    background: rgba(var(--accent-rgb),0.16); border-color: rgba(var(--accent-rgb),0.42);
  }
  .win-tabs button.tabdrag { opacity: 0.45; }
  /* Close mark: its slot is ALWAYS reserved (only the glyph fades in), so hovering a
     tab cannot reflow the row -- which would make tabs shuffle under the cursor while
     you are dragging one. */
  .win-tabs .win-tabx {
    font-style: normal; font-size: 13px; line-height: 1;
    width: 14px; height: 14px; border-radius: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-mute); opacity: 0;
    transition: opacity var(--tx-fast) var(--ease), background var(--tx-fast) var(--ease),
                color var(--tx-fast) var(--ease);
  }
  .win-tabs button:hover .win-tabx, .win-tabs button.on .win-tabx { opacity: 0.7; }
  .win-tabs .win-tabx:hover { opacity: 1; color: #ff9b9b; background: rgba(240,82,82,0.22); }
  /* UI Settings chips. Defined HERE, not borrowed from a panel's injectStyle: those
     only exist once that panel has rendered, so a shell-owned view must own its CSS. */
  .uis-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .uis-chip {
    font: inherit; font-size: 11px; padding: 5px 11px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--border-hi); background: var(--bg-elev-2); color: var(--text-dim);
    white-space: nowrap;
    transition: color var(--tx-fast) var(--ease), background var(--tx-fast) var(--ease),
                border-color var(--tx-fast) var(--ease);
  }
  .uis-chip:hover { color: var(--text); border-color: var(--text-mute); }
  .uis-chip.on {
    color: var(--accent-hi); background: rgba(var(--accent-rgb),0.18); border-color: rgba(var(--accent-rgb),0.5);
    font-weight: 600;
  }
  /* Preferences page: section cards; each setting is label (+hint) left, control right.
     Chip groups and wide controls drop to a full-width line under the label, so the page
     keeps its shape from a 300px sliver to a full-width window. */
  .pf-card { background: rgba(255,255,255,0.025); border: 1px solid var(--border); border-radius: 10px;
             padding: 2px 14px 4px; margin: 0 0 12px; }
  .pf-title { font-size: 10.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
              color: var(--accent-hi); padding: 10px 0 2px; }
  .pf-card > .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
                    padding: 9px 0; border-top: 1px solid var(--border); margin: 0; }
  .pf-card > .row.pf-first { border-top: none; }
  .pf-card > .row > .k { flex: 1 1 150px; min-width: 130px; font-size: 12.5px; color: var(--text);
                         text-transform: none; letter-spacing: 0; line-height: 1.3; }
  .pf-card > .row > .k .pf-sub { display: block; font-size: 10.5px; color: var(--text-mute); margin-top: 2px; line-height: 1.35; }
  .pf-card > .row > .v { flex: 2 1 220px; min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .pf-card > .row > .v.pf-full { flex: 1 1 100%; justify-content: flex-start; }
  .pf-card > .row > .v.uis-row input[type=range] { flex: 1 1 120px; min-width: 100px; max-width: 360px; }
  .pf-card > .row > .v > .uis-chips { justify-content: flex-start; flex: 1 1 100%; gap: 6px; }
  .pf-card > .row .al-pill { margin-left: auto; }
  .pf-hint { flex: 1 1 100%; color: var(--text-mute); font-size: 11px; line-height: 1.45; padding: 4px 0 8px; }
  .uis-row { display: flex; align-items: center; gap: 8px; }
  .uis-row input[type=range] { flex: 1; min-width: 90px; }
  .uis-row b { min-width: 46px; text-align: right; font-variant-numeric: tabular-nums; }

  /* ---- Shell glyphs, drawn in CSS -------------------------------------------
     This renderer proved unreliable with fine SVG line work: identical close
     paths came out as strays or specks depending on how the path data was
     written, and no amount of sizing fixed it. These use gradients and shadows
     only - no path parsing, no font dependency, no transforms (a transform on a
     hit-tested element also offsets this engine's CPU hit-testing). They inherit
     currentColor and scale with their box. */
  .g { display: inline-block; flex: none; width: 12px; height: 12px; }
  .g-x {
    background:
      linear-gradient(45deg,  transparent 43%, currentColor 43%, currentColor 57%, transparent 57%),
      linear-gradient(-45deg, transparent 43%, currentColor 43%, currentColor 57%, transparent 57%);
  }
  .g-min {
    background: linear-gradient(to bottom, transparent 43%, currentColor 43%, currentColor 57%, transparent 57%);
  }
  .g-grip {
    width: 2px; height: 2px; border-radius: 50%; background: currentColor;
    margin: 0 4px 0 2px;
    box-shadow: 0 -5px currentColor, 0 5px currentColor,
                5px 0 currentColor, 5px -5px currentColor, 5px 5px currentColor;
  }
  .g-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  /* Padlock: shackle (::before) over body (::after). Open state tilts the shackle so the
     two states are distinguishable without relying on colour alone. */
  .g-lock { position: relative; }
  .g-lock::after {
    content: ''; position: absolute; left: 1px; right: 1px; bottom: 0; height: 7px;
    background: currentColor; border-radius: 2px;
  }
  .g-lock::before {
    content: ''; position: absolute; left: 3px; right: 3px; top: 0; height: 6px;
    border: 1.6px solid currentColor; border-bottom: 0; border-radius: 4px 4px 0 0;
    transition: transform var(--tx-fast) var(--ease);
  }
  .win-lock:not(.on) .g-lock::before { transform: translate(1px, -1px) rotate(-14deg); }

  /* Drop target: a dragged window is hovering this one's title / tab strip. */
  .win.dock-target { outline: 2px solid var(--accent-hi); outline-offset: -2px; }
  .win-btns { display: flex; gap: 2px; margin-left: auto; }
  .win-btns button {
    appearance: none; border: none; background: transparent; cursor: pointer;
    width: 26px; height: 26px; border-radius: 7px; color: var(--text-mute);
    display: flex; align-items: center; justify-content: center;
    transition: background var(--tx-fast) var(--ease), color var(--tx-fast) var(--ease);
  }
  .win-btns button svg { width: 13px; height: 13px; }
  .win-btns button:hover { background: var(--bg-elev-2); color: var(--text); }
  .win-btns button.win-close:hover { background: rgba(240,82,82,0.18); color: #ff8b8b; }
  .win-body { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column;
              /* Preferences font size: panels set explicit px sizes throughout, so the size
                 preference zooms window content as a whole (text, icons, controls together). */
              zoom: var(--content-zoom, 1); }
  /* HUD windows (aura groups, XP meter, metronome) are pixel-precise overlays sized by the
     user: a fractional zoom re-rasterises their text and blurs it. They keep 1:1. */
  .win.hud .win-body { zoom: 1; }
  /* Rolled up (window shade): only the title strip remains. */
  .win.rolled .win-body { display: none; }
  .win.rolled { min-height: 0; }

  /* ---- HUD widgets (XP Meter, Metronome) ----
     Read-at-a-glance overlays rather than data panels. They keep the full window
     machinery (drag, 8-way resize, snap, persistence) but shed the visual weight: the
     normal 240x140 floor is lifted, the chrome collapses to a slim strip that only
     appears on hover/focus, and the body is transparent so the widget itself is the
     window. Locked = click-through (see wmApplyLock). */
  .win.hud { min-width: 0; min-height: 0; background: transparent; border-color: transparent;
             box-shadow: none; }
  .win.hud .win-title {
    height: 20px; min-height: 20px; padding: 0 2px 0 7px; background: transparent;
    border-bottom: 0; opacity: 0; transition: opacity var(--tx-fast) var(--ease);
  }
  .win.hud:hover .win-title, .win.hud.focus .win-title { opacity: 1; }
  .win.hud .win-name { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
  .win.hud .win-btns button { width: 18px; height: 18px; border-radius: 5px; }
  /* The frame's corner resize zones (.rz, z-index 5) overlap the HUD's small title buttons;
     the buttons must stay on top or hovering the X shows a resize cursor and eats the click. */
  .win.hud .win-btns { position: relative; z-index: 7; }
  .win.hud .win-btns button svg { width: 11px; height: 11px; }
  .win.hud .win-lock.on { color: var(--accent); }
  .win.hud .win-tabs { display: none; }
  .win.hud .win-body { background: transparent; }
  .win.hud .content { padding: 0; overflow: hidden; }
  /* Locked: no input on this side, and wmPushRects drops it so the companion passes the
     click to the game. Chrome is hidden outright -- a control you cannot click is noise. */
  .win.hud.locked { pointer-events: none; }
  /* visibility, not display: the strip must keep its height so the content does not jump up
     by 20px on lock, which would move a carefully placed aura. */
  .win.hud.locked .win-title { visibility: hidden; }
  .win.hud.locked .rz { display: none; }

  /* Resize handles: invisible 7px strips on edges/corners. */
  /* ---- In-game notifications ------------------------------------------------
     These used to be drawn by the companion as GL primitives from the marker
     command list: rounded rects plus a fixed-cell ASCII-only bitmap atlas, so no
     real type, no wrapping, no styling. They are DOM now, composited by the same
     UI layer as the windows. The stack is pointer-events:none so a transient
     toast can never eat a click meant for the game; only a dismissible card opts
     back in (and only those publish an input rect). */
  #toaster {
    position: absolute;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 99000;
    pointer-events: none;
  }
  /* Placement mode (UI Settings): the stack itself becomes draggable and shows a
     dashed frame so an EMPTY stack is still visible and grabbable. */
  #toaster.placing { pointer-events: auto; cursor: grab; }
  #toaster.placing:active { cursor: grabbing; }
  /* A REAL element, not ::before: it carries a width grip, and a pseudo-element
     cannot take events. order:-1 keeps it at the stack's leading edge whichever
     flex direction the current anchor uses. */
  /* Deliberately loud: it is a transient editing affordance over a busy game scene,
     so it has to win against whatever is behind it. */
  #toastGhost {
    position: relative; order: -1;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 42px; padding: 9px 30px 9px 14px;
    border-radius: 10px;
    border: 2px dashed var(--accent-hi);
    background: linear-gradient(180deg, rgba(var(--accent-rgb),0.34), rgba(var(--accent-rgb),0.20));
    box-shadow: 0 0 0 1px rgba(0,0,0,0.55), 0 0 22px rgba(var(--accent-rgb),0.55),
                0 10px 28px rgba(0,0,0,0.5);
    color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    user-select: none;
  }
  /* Whole stack gets a faint field while placing, so its extent is obvious even
     when it holds live cards. */
  #toaster.placing { outline: 1px dashed rgba(167,139,250,0.5); outline-offset: 6px; border-radius: 6px; }
  .ghost-rz {
    position: absolute; top: 2px; right: 2px; bottom: 2px; width: 22px;
    cursor: ew-resize; border-radius: 0 8px 8px 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.20);
  }
  .ghost-rz::after {
    content: ''; width: 2px; height: 17px; border-radius: 1px; background: #fff;
    box-shadow: 5px 0 0 -0.5px rgba(255,255,255,0.8), -5px 0 0 -0.5px rgba(255,255,255,0.8);
  }
  .ghost-rz:hover { background: rgba(255,255,255,0.16); }
  .toast {
    position: relative; width: 100%;
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 12px 12px;
    background: var(--win-bg);
    border: 1px solid var(--border-hi);
    border-left: 3px solid var(--accent-hi);
    border-radius: 9px;
    box-shadow: var(--win-shadow);
    overflow: hidden;
    animation: toast-in 220ms var(--ease);
  }
  .toast.out { animation: toast-out 200ms var(--ease) forwards; }
  .toast.sticky { pointer-events: auto; border-left-color: #f0b429; }
  /* A sticky card that has reached its goal (a completed pinned task): the amber
     "still needs you" edge turns green, which is the same done colour the panels
     use. Set by the owner via rec.el.classList, so uiNotify stays generic. */
  .toast.sticky.done { border-left-color: var(--ok); }
  @keyframes toast-in  { from { opacity: 0; transform: translateY(-10px) scale(0.97); }
                         to   { opacity: 1; transform: none; } }
  @keyframes toast-out { from { opacity: 1; transform: none; }
                         to   { opacity: 0; transform: translateY(-6px) scale(0.98); } }
  /* Every card carries its state on the coloured left edge, so the status dot is
     redundant on ALL of them (it used to show on non-owner cards only). The element
     is still built by uiNotify; hiding it here keeps that path generic. */
  .toast-ico { display: none; }

  /* ---- wiki palette: hotkey-opened search over a dimmed backdrop ---- */
  #wikiPal { position: fixed; inset: 0; z-index: 12000; display: flex; align-items: flex-start;
    justify-content: center; background: rgba(5, 7, 11, 0.62); animation: wkfade 140ms ease; }
  @keyframes wkfade { from { opacity: 0; } }
  .wk-card { margin-top: 16vh; width: min(560px, 86vw); background: var(--win-bg);
    border: 1px solid rgba(var(--accent-rgb), 0.5); border-radius: 14px; padding: 14px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); animation: wkpop 170ms var(--ease); }
  @keyframes wkpop { from { transform: translateY(-12px) scale(0.98); opacity: 0; } }
  .wk-row { display: flex; gap: 8px; align-items: center; }
  .wk-in { flex: 1; min-width: 0; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 9px; color: var(--text);
    font: 500 15px/1.2 inherit; padding: 11px 12px; outline: none; }
  .wk-in:focus { border-color: rgba(var(--accent-rgb), 0.6); }

    color: var(--text-mute); font-size: 11.5px; }

  .wk-kb:hover { color: var(--text); }
  .toast-msg {
    flex: 1; min-width: 0;
    font-size: 12.5px; line-height: 1.45; color: var(--text);
    overflow-wrap: anywhere;
  }
  .toast-n {
    flex: none; align-self: flex-start; margin-top: 1px;
    font-size: 10px; font-weight: 600; line-height: 16px; color: var(--text-mute);
    background: var(--bg-elev-2); border-radius: 999px; padding: 0 7px;
  }
  /* Sits at the card's top-right whatever the card's height, with a comfortable
     hit target rather than a token glyph. */
  /* Full-height dismiss column on the card's trailing edge. The negative margins
     cancel the card's own padding so it reaches the true edges; .toast has
     overflow:hidden, so the corner radius clips it. */
  .toast-x {
    flex: none; align-self: stretch;
    appearance: none; padding: 0; border: none; border-left: 1px solid var(--border-hi);
    /* A tint, not transparent: an unfilled column reads as a floating glyph rather
       than a button, which is what made it look unfinished. */
    background: rgba(255,255,255,0.055); cursor: pointer;
    width: 36px; margin: -11px -12px -12px 0; border-radius: 0;
    color: var(--text); line-height: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background var(--tx-fast) var(--ease), color var(--tx-fast) var(--ease);
  }
  /* WIN_SVG bakes in stroke-width 1.8, which reads as a speck at this size in a
     34px column -- CSS overrides the presentation attribute. */
  .toast-x .g-x { width: 13px; height: 13px; }
  .toast-x:hover { background: rgba(240,82,82,0.22); color: #ff9b9b; }
  /* Remaining-time rule along the bottom edge; width is set inline per frame. */
  .toast-bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
               background: rgba(255,255,255,0.06); }
  .toast-bar i { display: block; height: 100%; background: var(--accent-hi); opacity: 0.65; }

  /* Resize grab bands, entirely INSIDE the border box. They must not overhang:
     .win is overflow:hidden + contain:paint (which CLIPS anything outside), and
     the rect we publish as the input-consume region is getBoundingClientRect --
     the border box -- so a handle sticking out is both invisible AND lands its
     clicks in the GAME. Edges stay slim (5px) so they barely graze the content
     scrollbar; corners are generous since that is where people aim. */
  .rz { position: absolute; z-index: 5; }
  .rz-n  { top: 0; left: 12px; right: 12px; height: 5px; cursor: ns-resize; }
  .rz-s  { bottom: 0; left: 12px; right: 12px; height: 5px; cursor: ns-resize; }
  .rz-w  { left: 0; top: 12px; bottom: 12px; width: 5px; cursor: ew-resize; }
  .rz-e  { right: 0; top: 12px; bottom: 12px; width: 5px; cursor: ew-resize; }
  .rz-nw { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; }
  .rz-se { bottom: 0; right: 0; width: 14px; height: 14px; cursor: nwse-resize; }
  .rz-ne { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; }
  .rz-sw { bottom: 0; left: 0; width: 14px; height: 14px; cursor: nesw-resize; }

  /* min-width: 0 is load-bearing: without it this flex child refuses to shrink below its
     widest descendant, so fixed-width content slides out of the window. */
  /* overflow-y: SCROLL (not auto) on purpose: panels rebuild their DOM wholesale on data
     changes, and with auto the scrollbar vanished for the empty frame and reappeared after -
     a width change that reflowed every flexible cell twice per repaint (the "panel zooms
     in/out when my money pouch ticks" bug). A permanently reserved scrollbar lane keeps the
     content width constant no matter what the repaint does. (scrollbar-gutter would be the
     modern fix; this WebKit predates it.) */
  .content { flex: 1; padding: 14px 16px; overflow-y: scroll; overflow-x: hidden; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  .content::-webkit-scrollbar { width: 10px; }
  .content::-webkit-scrollbar-track { background: transparent; }
  .content::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 5px;
    border: 2px solid transparent; background-clip: padding-box;

  .content::-webkit-scrollbar-thumb:hover { background: var(--text-mute); background-clip: padding-box; }
  /* Width classes replace the old viewport media queries (the view now spans the whole
     game client, so per-WINDOW width drives responsive layout). */
  .win.narrow .content { padding: 10px 12px; }
  .pane    { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .rows { display: flex; flex-direction: column; gap: 8px; }

  .al-evt { appearance: none; cursor: pointer; font-size: 11px; padding: 3px 9px; border-radius: 999px;
            background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-mute); }

  .pk-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .pk-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

  .pk-name { color: var(--text); font-size: 13px; min-width: 0; line-height: 1.3; word-break: break-word; }

  .pk-giz .perk { color: var(--text); background: var(--bg-elev-2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; font-size: 11px; line-height: 1.45; }
  .pk-none { color: var(--text-mute); font-size: 11px; font-style: italic; }
  .pk-xp { color: var(--text-dim); font-size: 10px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .bf-list { flex: 1; min-height: 0; overflow-y: auto; padding-right: 6px; }

  /* --- Auras HUD: watched buffs/debuffs as icons with a radial time sweep ---
     DESIGN NOTE. This sits over live gameplay, so nothing may depend on what is behind it.
     Earlier versions used translucent tiles and leaned on drop shadows: readable over dark
     ground, illegible over a bright, busy scene. Every layer here is therefore OPAQUE, the
     label is lifted out of the artwork into its own chip, and the timer is outlined on all
     four sides rather than merely shadowed. */
  /* ===== Auras (panel_auras.js): HUD windows + editor ===== */
  .au-wrap { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }
  /* The root fills the HUD window's content box by absolute inset, so it is exactly the visible
     area whatever the flex column above it computes. */
  .win.hud .content { position: relative; }
  .au-root { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: visible; }
  .au-kids { position: relative; width: 100%; height: 100%; }
  .au-hudhint { color: var(--text-dim); font-size: 11px; text-align: center; padding: 4px; }
  /* One display element. --au-size = the smaller side, used to scale text. */
  .au-el { position: absolute; box-sizing: border-box; overflow: visible; }
  .au-el.au-editable { cursor: move; }
  .au-el.au-sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Edit mode (Auras panel open, window unlocked): tint every group's space and every root's
     box so the area an aura occupies is visible even when nothing is triggered. */
  .au-root.au-edit { background: rgba(var(--accent-rgb),0.12); outline: 1px dashed rgba(var(--accent-rgb),0.7); outline-offset: -1px; border-radius: 6px; }
  .au-root.au-edit::after { content: attr(data-label); position: absolute; left: 4px; top: 2px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,0.65); pointer-events: none; text-shadow: 0 1px 2px #000; }
  .au-edit .au-t-group, .au-edit .au-t-dyngroup { background: rgba(79,178,255,0.10); outline: 1px dashed rgba(79,178,255,0.7); outline-offset: -1px; border-radius: 6px; }
  .au-edit .au-el.au-editable:not(.au-t-group):not(.au-t-dyngroup) { outline: 1px dashed rgba(255,255,255,0.35); outline-offset: 0; }
  .au-rz { position: absolute; width: 10px; height: 10px; background: var(--accent); border-radius: 2px; opacity: .8; }
  .au-rz-se { right: -2px; bottom: -2px; cursor: nwse-resize; }
  .au-rz-nw { left: -2px; top: -2px; cursor: nwse-resize; }
  .au-rz-ne { right: -2px; top: -2px; cursor: nesw-resize; }
  .au-rz-sw { left: -2px; bottom: -2px; cursor: nesw-resize; }
  /* Edge grips: thin strips along each wall (between the corners). */
  .au-rz-n { top: -3px; left: 12px; right: 12px; height: 6px; width: auto; cursor: ns-resize; opacity: .45; }
  .au-rz-s { bottom: -3px; left: 12px; right: 12px; height: 6px; width: auto; cursor: ns-resize; opacity: .45; }
  .au-rz-w { left: -3px; top: 12px; bottom: 12px; width: 6px; height: auto; cursor: ew-resize; opacity: .45; }
  .au-rz-e { right: -3px; top: 12px; bottom: 12px; width: 6px; height: auto; cursor: ew-resize; opacity: .45; }
  .au-rz-n:hover, .au-rz-s:hover, .au-rz-w:hover, .au-rz-e:hover { opacity: .9; }
  .au-wrz { width: 12px; height: 12px; z-index: 6; background: #fff; opacity: .9; border: 2px solid var(--accent); box-sizing: border-box; }
  .au-wrz.au-rz-n, .au-wrz.au-rz-s { width: auto; height: 6px; opacity: .5; }
  .au-wrz.au-rz-w, .au-wrz.au-rz-e { height: auto; width: 6px; opacity: .5; }
  .au-root.au-edit { cursor: move; }
  .au-desat .au-icon { filter: grayscale(1) brightness(0.8); }
  .au-glow { box-shadow: 0 0 10px 3px rgba(var(--accent-rgb),0.85), 0 0 18px 6px rgba(var(--accent-rgb),0.35) !important; }
  /* icon / pips / ring tiles */
  .au-t-icon, .au-t-pips { border-radius: 8px; background: #0e0f14; border: 1px solid rgba(255,255,255,0.30); box-shadow: 0 2px 8px rgba(0,0,0,0.85); }
  .au-t-icon { overflow: hidden; }
  .au-t-pips { background: transparent; border: 0; box-shadow: none; }
  .au-t-pips > .au-icon { position: relative; width: 100%; height: calc(100% - 16px); border-radius: 8px; background-color: #0e0f14; border: 1px solid rgba(255,255,255,0.30); box-sizing: border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.85); }
  .au-t-pips > .au-time { bottom: 16px; }
  .au-el.au-off { opacity: .40 !important; }
  .au-t-icon.au-oncd .au-icon { filter: grayscale(0.55) brightness(0.75); }
  .au-icon { position: absolute; inset: 0; image-rendering: pixelated; background-size: contain; background-repeat: no-repeat; background-position: center; }
  .au-sweep { position: absolute; inset: 0; pointer-events: none; }
  .au-hh { position: absolute; top: 0; height: 100%; width: 50%; overflow: hidden; }
  .au-hl { left: 0; }
  .au-hr { left: 50%; }
  .au-hh i { position: absolute; top: -50%; width: 400%; height: 200%; background: rgba(0,0,0,0.60); transform-origin: 100% 50%; }
  .au-hl i { left: -300%; }
  .au-hr i { left: -400%; }
  .au-time { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .au-time b { font-weight: 900; line-height: 1; color: #fff; font-size: clamp(11px, calc(var(--au-size, 56px) * 0.42), 40px); font-variant-numeric: tabular-nums;
               text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000, 0 0 4px rgba(0,0,0,0.95); }
  .au-time.au-soon b { color: #ff7b7b; font-size: clamp(14px, calc(var(--au-size, 56px) * 0.56), 52px); }
  .au-time.au-full b { color: #ffd76a; }
  .au-stk { position: absolute; right: 2px; bottom: 1px; font-size: clamp(9px, calc(var(--au-size, 56px) * 0.26), 18px); font-weight: 800; color: #fff; line-height: 1; pointer-events: none;
            text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000; }
  .au-pips { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 2px; --pip: var(--accent); }
  .au-pips i { display: block; height: 6px; border-radius: 2px; background: rgba(255,255,255,0.10); border: 1px solid rgba(0,0,0,0.6); box-sizing: border-box; }
  .au-pips i.on { background: var(--pip); box-shadow: 0 0 4px var(--pip); border-color: rgba(0,0,0,0.35); }
  .au-pips.au-full i.on { box-shadow: 0 0 7px var(--pip), 0 0 2px #fff; }
  /* ring: two clipped halves like the sweep, in colour, with a hole punched by an inner disc */
  .au-ring { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: rgba(0,0,0,0.45); --rc: var(--accent); --rw: 6px; }
  .au-ring .au-hh i { background: var(--rc); }
  .au-ring-in { position: absolute; left: var(--rw); top: var(--rw); right: var(--rw); bottom: var(--rw); border-radius: 50%; background: #0e0f14; box-shadow: inset 0 0 6px rgba(0,0,0,0.8); }
  .au-t-ring .au-time b { font-size: clamp(10px, calc(var(--au-size, 56px) * 0.3), 30px); }
  /* bar */
  .au-t-bar { border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.30); box-shadow: 0 2px 8px rgba(0,0,0,0.85); background-repeat: no-repeat; background-size: 100% 100%; }
  /* Bar text: sized from the bar HEIGHT but capped so a tall bar does not outgrow its width; the
     label may shrink/ellipsize, the number never does. */
  .au-vtext { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 7px; font-size: clamp(11px, calc(var(--au-size, 22px) * 0.5), 15px); line-height: 1; color: #fff; font-weight: 700;
              /* One crisp drop shadow, not a 4-way outline plus halo: the outline fused the
                 counters of small bold glyphs and read as blur on every bar. */
              text-shadow: 0 1px 1px rgba(0,0,0,0.95), 0 0 1px rgba(0,0,0,0.8); white-space: nowrap; overflow: hidden; }
  .au-vtext span { font-weight: 600; opacity: .9; text-transform: uppercase; letter-spacing: .04em; font-size: .85em; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .au-vtext b { font-variant-numeric: tabular-nums; flex: none; }
  /* text */
  .au-t-text { display: flex; align-items: center; font-weight: 900; line-height: 1.05; white-space: nowrap; overflow: visible;
               text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000, 0 0 5px rgba(0,0,0,0.95); }
  /* animations */
  .au-s-fade { animation: au-fadein .25s ease-out; }
  .au-s-grow { animation: au-grow .3s cubic-bezier(.2,1.4,.4,1); }
  .au-s-shrink { animation: au-shrinkin .3s ease-out; }
  .au-s-slideL { animation: au-slideL .3s ease-out; }
  .au-s-slideR { animation: au-slideR .3s ease-out; }
  .au-s-slideU { animation: au-slideU .3s ease-out; }
  .au-s-slideD { animation: au-slideD .3s ease-out; }
  .au-s-bounce { animation: au-bouncein .5s cubic-bezier(.2,1.6,.4,1); }
  .au-m-pulse { animation: au-pulse 1s ease-in-out infinite !important; }
  .au-m-flash { animation: au-flash .7s steps(2, end) infinite !important; }
  .au-m-shake { animation: au-shake .5s ease-in-out infinite !important; }
  .au-m-spin { animation: au-spin 2s linear infinite !important; }
  .au-m-wobble { animation: au-wobble 1s ease-in-out infinite !important; }
  .au-m-bounce { animation: au-bounce 1s ease-in-out infinite !important; }
  .au-fin-fade { animation: au-fadeout .4s ease-in forwards !important; }
  .au-fin-shrink { animation: au-shrinkout .4s ease-in forwards !important; }
  .au-fin-grow { animation: au-growout .4s ease-in forwards !important; }
  .au-fin-slideL { animation: au-outL .4s ease-in forwards !important; }
  .au-fin-slideR { animation: au-outR .4s ease-in forwards !important; }
  .au-fin-slideU { animation: au-outU .4s ease-in forwards !important; }
  .au-fin-slideD { animation: au-outD .4s ease-in forwards !important; }
  @keyframes au-fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes au-grow { from { transform: scale(0.2); } to { transform: scale(1); } }
  @keyframes au-shrinkin { from { transform: scale(1.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes au-slideL { from { transform: translateX(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes au-slideR { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes au-slideU { from { transform: translateY(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes au-slideD { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes au-bouncein { 0% { transform: scale(0.3); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes au-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes au-flash { 0% { opacity: 1; } 50% { opacity: .35; } 100% { opacity: 1; } }
  @keyframes au-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes au-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes au-wobble { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  @keyframes au-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes au-fadeout { to { opacity: 0; } }
  @keyframes au-shrinkout { to { transform: scale(0.2); opacity: 0; } }
  @keyframes au-growout { to { transform: scale(1.8); opacity: 0; } }
  @keyframes au-outL { to { transform: translateX(-60px); opacity: 0; } }
  @keyframes au-outR { to { transform: translateX(60px); opacity: 0; } }
  @keyframes au-outU { to { transform: translateY(-60px); opacity: 0; } }
  @keyframes au-outD { to { transform: translateY(60px); opacity: 0; } }
  /* ---- editor (the Auras panel) ---- */
  .au-editor { overflow-y: auto; padding-right: 4px; }
  .au-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .au-btn { background: var(--bg-elev-2); color: var(--text); border: 1px solid var(--border-hi); border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .au-btn:hover { border-color: var(--accent-hi); }
  .au-btn.au-add { border-style: dashed; background: transparent; color: var(--text-dim); font-weight: 400; align-self: flex-start; }
  .au-btn.au-add:hover { color: var(--text); }
  .au-cyc { min-width: 0; white-space: nowrap; }
  .au-cyc .cur { overflow: hidden; text-overflow: ellipsis; }
  .au-sm { padding: 2px 6px; font-size: 0.78em; }
  .au-del { color: #ff8a8a; }
  .au-locked { color: var(--accent); border-color: var(--accent); }
  .au-opt { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text); }
  .au-hint { color: var(--text-dim); font-size: 11px; line-height: 1.45; }
  .au-group { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
  .au-group.au-editing { border-color: var(--accent); }
  .au-ghead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .au-crumb { color: var(--accent); }
  .au-gname { flex: 1 1 120px; min-width: 0; }
  .au-hex { flex: none !important; width: 84px; min-width: 0 !important; font-family: monospace; }
  .au-gcount { color: var(--text-mute); font-size: 11px; white-space: nowrap; }
  .au-tree { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; max-height: 240px; overflow-y: auto; flex: none; }
  .au-editor > .au-bar, .au-editor > .au-group, .au-editor > .au-hint { flex: none; }
  .au-node { display: flex; align-items: center; gap: 8px; padding: 5px 8px; font-size: 12px; color: var(--text); cursor: pointer; border-bottom: 1px solid var(--border); }

  .au-node input[type=checkbox] { flex: none; margin: 0; }
  .au-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.2); flex: none; margin: 0 5px; }
  .au-node.live .au-dot { background: var(--accent); }
  .au-tabs { display: flex; gap: 4px; flex-wrap: wrap; }

  .au-tab:hover { color: var(--text); border-color: var(--border-hi); }

  .au-cell { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; }

  .au-cp-sv { position: relative; width: 100%; height: 120px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); cursor: crosshair; }
  .au-cp-sv i, .au-cp-hue i { position: absolute; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #000; transform: translate(-50%, -50%); pointer-events: none; top: 50%; }
  .au-cp-hue { position: relative; width: 100%; height: 14px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.2); cursor: ew-resize;
               background: linear-gradient(90deg, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
  .au-cp-row { display: flex; align-items: center; gap: 6px; }
  .au-cp-pal { display: flex; flex-wrap: wrap; gap: 4px; }
  .au-ta { width: 100%; min-height: 70px; background: var(--bg-elev-2); color: var(--text); border: 1px solid var(--border-hi); border-radius: 6px; padding: 6px; font: inherit; font-size: 11px; font-family: monospace; box-sizing: border-box; resize: vertical; }

  .skill-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    grid-auto-rows: 1fr;
    gap: 5px;
    max-width: 100%;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }
  /* auto-fit, NOT a hard 3 columns: total XP is 13 characters at 4.7B and a fixed third of a
     narrow panel clipped it. Tracks now drop to 2 (or 1) as the panel narrows, and auto-fit
     collapses the spare tracks so 4 tiles still span the full width when there is room. */
  .skill-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
    gap: 5px;
    margin-top: 6px;
    flex: 0 0 auto;
  }
  .skill-stat {
    min-width: 0;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 5px 4px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .skill-stat .ss-label { color: var(--text-dim); font-size: 9px; text-transform: uppercase; letter-spacing: .04em; }
  .skill-stat .ss-val   { color: var(--accent-hi); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600;
                          max-width: 100%; white-space: nowrap; }
  /* Long figures (total XP past a billion) step down instead of being clipped; the exact
     value is always in the tile's tooltip either way. */
  .skill-stat .ss-val.ss-long  { font-size: 11px; letter-spacing: -0.2px; }
  .skill-stat .ss-val.ss-long2 { font-size: 9.5px; letter-spacing: -0.3px; }
  .skill-stat .ss-virtual { color: var(--text-dim); font-size: 9.5px; font-weight: 600;
    font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: .02em; }
  .skill-cell {
    position: relative;
    display: flex; flex-direction: row;
    align-items: center; justify-content: center;
    gap: 6px;
    padding: 4px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .skill-cell .sk-icon {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 22px;
  }
  .skill-cell .sk-icon img { display: block; max-width: 100%; max-height: 100%; }
  .skill-cell .sk-val { color: var(--text); font-variant-numeric: tabular-nums; font-size: 11px; }
  .skill-cell.buffed  .sk-val { color: #4dd28a; }
  .skill-cell.drained .sk-val { color: #fc7c7c; }
  /* Per-skill goal bar. No width transition: the grid rebuilds every poll, so a transition
       would restart from 0 each time. Fill + spacer split the track by flex-grow ratios --
       Ultralight renders flex-grow reliably every rebuild, unlike a child % width / transform,
       which it intermittently resolves to 0. */
  .skill-cell .sk-goal { position: absolute; left: 5px; bottom: 4px; width: calc(100% - 10px); height: 5px;
    border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden; display: flex; }
  .skill-cell .sk-goal-fill { height: 100%; flex: 0 0 0; min-width: 0; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent-lo), var(--accent-hi)); }
  .skill-cell .sk-goal-pad  { height: 100%; flex: 0 0 0; min-width: 0; }
  .skill-cell .sk-goal.done .sk-goal-fill { background: #4dd28a; }
  .skill-cell.has-goal { padding-bottom: 12px; }
  .skill-cell .sk-bonus { position: absolute; top: 2px; right: 3px; font-size: 8px; font-weight: 700;
    color: #4dd28a; background: rgba(77,210,138,0.14); border-radius: 5px; padding: 0 3px;
    line-height: 12px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .skill-stats .ss-bonus { color: #4dd28a; }

  .inv-grid .bank-cell { height: auto; padding-bottom: 0; display: flex; flex-direction: column; }
  .inv-ico-box { position: relative; width: 100%; height: 0; padding-bottom: 86%; flex: 0 0 auto; }
  /* Up to three tight lines with an ellipsis, so "Exquisite woodcutting urn" stays readable
     instead of being sliced mid-glyph at the second line; the tooltip has the full name. */
  .inv-name {
    font-size: 9.5px; line-height: 1.15; color: var(--text-dim); text-align: center;
    padding: 0 2px 3px; min-height: 2.3em; max-height: 3.6em; word-break: break-word; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .inv-grid::-webkit-scrollbar { width: 10px; }
  .inv-grid::-webkit-scrollbar-track { background: transparent; }
  .inv-grid::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
  .cont-empty { flex: 1; min-height: 0; display: none; align-items: center; justify-content: center; padding: 12px; color: var(--text-dim); font-size: 12px; }
  /* Equipment paperdoll: 3-wide grid mirroring the in-game screen; gear fits the slot
       (contain), unlike the native-size inventory. */
  .eq-grid {
    display: grid; grid-template-columns: repeat(3, minmax(40px, 54px)); gap: 8px;
    justify-content: center; align-content: start; flex: 0 0 auto; margin: auto;
  }
  .eq-gap { }                                   /* invisible spacer to hold the grid shape */
  .eq-cell.eq-empty { background: rgba(255, 255, 255, 0.02); border-style: dashed; }
  .eq-cell.eq-override::after { content: ''; position: absolute; top: 3px; right: 3px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--accent-hi); box-shadow: 0 0 4px var(--accent); pointer-events: none; }
  .eq-grid .bank-icon { inset: 4px; }   /* size is set per-icon (downscale-only) */
  .eq-grid .bank-amt { font-size: 12px; top: 3px; left: 4px; }

  .ge-grid {

    gap: 8px;
    align-content: center;
    margin: 0 auto;

    min-height: 0;
    overflow-y: auto;

  .ge-cell.ge-buy  .ge-type { background: rgba(77, 210, 138, 0.16); color: #4dd28a; }

  .ge-cell .ge-state-dot {

  .ge-cell .ge-price {

  .ge-cell.is-active   { box-shadow: inset 0 0 0 1px rgba(240,181,60,0.30); }
  .ge-cell.is-complete { box-shadow: inset 0 0 0 1px rgba(77, 210, 138, 0.40); }
  @media (max-width: 430px) { .ge-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 280px) { .ge-grid { grid-template-columns: 1fr; } }

  /* Ultralight doesn't render native title= tooltips, and a CSS ::after gets clipped
     by parent overflow:hidden -- one fixed bubble on <body>, positioned by JS. */
  #global-tip {
    position: fixed;
    background: #0b0d12;
    border: 1px solid var(--border-hi);
    color: var(--text);
    font-size: 11px;
    line-height: 1.45;
    padding: 5px 9px;
    border-radius: 5px;
    white-space: pre-line;      /* honour \n for multi-line tooltips AND wrap long lines */
    max-width: 320px;
    max-height: calc(100vh - 16px);
    overflow: hidden;           /* pointer-events:none, so a scrollbar would be unusable anyway */
    text-align: left;
    pointer-events: none;
    opacity: 0;
    transform: translateX(-50%);
    transition: opacity 120ms var(--ease);
    z-index: 9999;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
  }

  /* Icon-grid tooltips (collection logs). Reading forty item NAMES tells you far less than
     seeing the loot, so Missing/Collected render as two grids of item icons instead.
     #global-tip is body-level and pointer-events:none, so it can stand taller than the window
     that spawned it -- but it can never be scrolled, so the builder budgets its cell count to
     the viewport rather than letting overflow:hidden silently eat the tail. */
  /* A DEFINITE width, not just max-width. #global-tip is shrink-to-fit, and inside an
     intrinsically-sized container `repeat(auto-fill, minmax(34px, 1fr))` resolves to its
     minimum - the grid collapsed to two columns, turning 55 items into 28 rows of
     full-screen-tall tooltip. With a definite inline size auto-fill gets nine columns. */
  #global-tip.tg { width: 356px; max-width: calc(100vw - 24px); }
  #global-tip.tg .tg-body { white-space: normal; }   /* the tip itself is pre-line */
  .tg-h { color: var(--text-dim); font-size: 10px; font-weight: 700; text-transform: uppercase;
          letter-spacing: 0.05em; margin: 8px 0 4px; padding-top: 7px;
          border-top: 1px solid var(--border); }
  .tg-h:first-child { margin-top: 2px; padding-top: 0; border-top: 0; }
  .tg-h.miss { color: var(--accent-hi); }
  .tg-h.have { color: var(--ok); }
  .tg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
             gap: 4px; align-content: start; }
  .tg-cell { height: 34px; border-radius: 8px; position: relative;
             background: var(--bg-elev) no-repeat center; border: 1px solid var(--border);
             box-shadow: inset 0 1px 0 rgba(255,255,255,0.03); }
  .tg-cell.have { border-color: rgba(77,210,138,0.34); background-color: rgba(77,210,138,0.07); }
  .tg-cell.miss { opacity: 0.55; }
  /* Not every id has a bundled icon; initials keep the cell from reading as a blank hole. */
  .tg-cell .tg-tn { position: absolute; inset: 0; display: flex; align-items: center;
                    justify-content: center; font-size: 11px; font-weight: 700;
                    color: var(--text-mute); }
  .tg-more { color: var(--text-mute); font-size: 10px; margin-top: 5px; }

  .stor-wrap { display: flex; flex-direction: column; gap: 10px; }
  .stor-box { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .stor-h { font-size: 12px; font-weight: 700; color: var(--text); padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  .stor-h .stor-tier { color: var(--accent-hi); }

  .stor-row .stor-n { color: var(--text-dim); }
  .stor-row .stor-c { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

               background: var(--bg-elev); color: var(--accent-hi); font-size: 12px; font-weight: 700;
               cursor: pointer; transition: border-color 140ms, color 140ms; }

  .pof-group { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-mute); margin: 10px 2px 2px; }
  .pof-group:first-child { margin-top: 2px; }
  .pof-live { font-size: 9px; font-weight: 700; color: #79d6a6; vertical-align: middle; }
  .pof-cached { font-size: 9px; color: var(--text-mute); vertical-align: middle; }
  .pof-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 5px; margin-top: 5px; }
  .pof-cell { position: relative; }
  .pof-trait { position: absolute; left: 2px; right: 2px; bottom: 1px; padding: 0 1px; font-size: 8px; line-height: 1.15;
               text-align: center; color: var(--accent-hi); background: rgba(0, 0, 0, .58); border-radius: 3px;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comp-sec { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin: 13px 2px 5px; }
  .comp-sec:first-child { margin-top: 2px; }
  .bank-cell.comp-zero { opacity: 0.32; }
  .comp-toggle { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); cursor: pointer; white-space: nowrap; user-select: none; }
  .comp-toggle input { accent-color: var(--accent-hi); margin: 0; }
  .stor-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  /* fixed square -- override .bank-cell's padding-bottom:100% (in a flex row the % resolves against the
     whole row width, making cells absurdly tall). */
  .stor-cell { flex: 0 0 46px; width: 46px; height: 46px; padding-bottom: 0; }
  .stor-cell .bank-amt { font-size: 11px; top: 2px; left: 3px; }
  .stor-cell .stor-tn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                        text-align: center; font-size: 8.5px; line-height: 1.05; color: var(--text-dim); padding: 3px 2px 12px; overflow: hidden; }
  /* GRID, not flex-wrap: the cells used to be content-sized with the default flex-shrink,
     so every value change (count digits, durability chip, essence icon appearing) altered
     cell widths and re-packed the row - the panel visibly "zoomed" on each repaint while
     runecrafting. Fixed tracks make cell geometry depend ONLY on the container width. */
  .stor-egrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
                gap: 6px; margin-top: 4px; }
  .stor-ecell { display: flex; align-items: center; gap: 5px; padding: 4px 9px 4px 5px; min-width: 0;
                background: var(--bg); border: 1px solid var(--border); border-radius: 9px; }
  .stor-ecell .bank-icon { position: relative; inset: auto; flex: 0 0 30px; width: 30px; height: 30px; padding-bottom: 0;
                           background-repeat: no-repeat; background-position: center; background-size: contain; }
  .stor-earrow { color: var(--text-mute); font-size: 13px; margin: 0 -1px; }
  .stor-ecap { font-size: 12px; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; margin-left: 3px; }
  .stor-ecap .cap { color: var(--text-mute); font-weight: 600; }
  .stor-edur { font-size: 10px; font-weight: 600; color: var(--text-mute); background: var(--bg-elev);
               border-radius: 4px; padding: 1px 4px; margin-left: 2px; }

  .ab-row { display: flex; align-items: center; gap: 8px; padding: 3px 2px; font-size: 12px; }
  .ab-icon { flex: 0 0 28px; width: 28px; height: 28px; background-repeat: no-repeat; background-position: center;

  /* status badges: green = ready, amber = ability cooldown (real seconds), red = unavailable */

  .clue-map-wrap { margin: 4px 0 8px; }
  .clue-map-stage { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: auto; cursor: grab;
    scrollbar-width: none; -ms-overflow-style: none;
              border: 1px solid var(--border); border-radius: 6px; background: #0b0d12; }
  .clue-map-stage::-webkit-scrollbar { width: 0; height: 0; display: none; }   /* pan by dragging, no bars */
  .clue-map-stage.grabbing { cursor: grabbing; }
  .clue-map-inner { position: relative; width: 100%; height: 100%; }
  /* The canvas is rendered at the zoomed size (see the zoomPx maths in the draw paths), but a
     redraw is coalesced, so between the zoom gesture and the redraw the browser stretches the
     old bitmap. Nearest-neighbour keeps that interim frame CRISP instead of smearing the
     terrain and the 1 px grid lines into a blur. */
  .clue-map { display: block; width: 100%; height: 100%;
              image-rendering: -webkit-optimize-contrast; image-rendering: pixelated; }
  .clue-map-pulse { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; pointer-events: none; }
  .clue-map-pulse::before, .clue-map-pulse::after { content: ''; position: absolute; inset: 0; border-radius: 50%;
              border: 2px solid rgba(255,45,149,0.9); box-shadow: 0 0 4px 1px rgba(0,0,0,0.6); animation: cluePulse 1.6s ease-out infinite; }
  .clue-map-pulse::after { animation-delay: 0.8s; }
  @keyframes cluePulse { 0% { transform: scale(0.5); opacity: 0.95; } 100% { transform: scale(2.9); opacity: 0; } }
  .clue-map-lode { position: absolute; transform: translate(-50%, -50%); pointer-events: none; display: flex; flex-direction: column; align-items: center; }
  .clue-map-player { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    background: #ffd23f; border: 2px solid #fff; box-shadow: 0 0 5px rgba(0,0,0,0.85), 0 0 9px rgba(255,210,63,0.75); pointer-events: none; z-index: 5; }
  /* Scan-range square around the player on scan maps (Chebyshev distance -> square, not circle). */
  .clue-map-range { position: absolute; box-sizing: border-box; border: 1.5px dashed rgba(255,170,60,0.85);
    box-shadow: 0 0 4px rgba(0,0,0,0.45); pointer-events: none; z-index: 4; }
  .cml-icon { width: 26px; height: 26px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.95));
      background-repeat: no-repeat; background-position: center; background-size: contain;
      image-rendering: -webkit-optimize-contrast; }
  /* Every visible teleport gets its own marker; the container just spans the map. */
  .clue-map-teles { position: absolute; inset: 0; pointer-events: none; }
  /* Non-lodestone teleports (skills necklace and friends) share the lodestone marker
     layout but carry a green badge so the two are told apart at a glance. */
  /* The keybind badge sits over terrain, so it needs solid fill and a dark rim to stay
     readable rather than relying on the map behind it. */
  /* Teleports are REFERENCE, not the subject: quiet by default so the scan spots own the
     map, full-strength on hover for reading a specific marker. */
  .clue-map-tele { pointer-events: auto; opacity: 0.5; transition: opacity 120ms var(--ease); }
  .clue-map-tele:hover { opacity: 1; }
  .clue-map-tele .cml-icon { width: 19px; height: 19px; }
  /* Keybind badges only materialise on hover - dozens of bright green chips were the
     map's loudest layer while carrying information the tooltip already has. */
  .clue-map-tele .cml-kb { display: none; font-size: 9.5px; line-height: 12px; padding: 0 4px; }
  .clue-map-tele:hover .cml-kb { display: block; }
  /* The nearest teleport the player can actually use: full strength, badge showing -
     it IS the route; everything else stays faded reference. */
  .clue-map-tele.cml-primary { opacity: 1; }
  .clue-map-tele.cml-primary .cml-icon { width: 24px; height: 24px; }
  .clue-map-tele.cml-primary .cml-kb { display: block; }
  /* When two markers crowd, the covered one puts its badge to the side instead of below,
     so the neighbouring icon cannot sit on top of it. */
  /* A single teleport keeps the stacked icon-over-badge look. Only a GROUP lays its cells
     out in a row, with the lightest possible backing so the map stays readable. */
  .cml-cell { display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
  .clue-map-telebox { flex-direction: row; align-items: flex-start; gap: 3px;

  .clue-map-tele .cml-dot { width: 13px; height: 13px; border-radius: 50%; background: #4dd28a;

<div id="desktop">
  <div id="menubar"></div>
  <div id="winlayer"></div>
  <div id="toaster"></div>

<script>
  // First statement on purpose: uncaught errors anywhere in the panel (including
  // later top-level statements) reach the client log via the console listener.
  window.onerror = function (msg, src, line, col) {
    try { console.error('uncaught: ' + msg + ' @' + line + ':' + col); } catch (e) {}
  };
  // localStorage SHIM. Without a WebCore cache_path (launcher builds before 2026-07-30)
  // Ultralight's localStorage is a SILENT NO-OP: setItem "succeeds" but getItem always
  // returns null, so every panel's "persisted" state (alert bells, crew snapshots, ports
  // plan/gear, var pins, notes) silently evaporated between repaints. Probe it once and,
  // when broken, replace it with an in-memory store - session-lifetime persistence, which
  // is what the panels actually rely on within a run. Remove-safe once every deployed
  // launcher sets config.cache_path (main.cpp).
  (function () {
    try {
      localStorage.setItem('__rtxProbe', '1');
      if (localStorage.getItem('__rtxProbe') === '1') { localStorage.removeItem('__rtxProbe'); return; }
    } catch (e) {}
    const mem = {};
    const shim = {
      getItem: k => (Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null),
      setItem: (k, v) => { mem[String(k)] = String(v); },
      removeItem: k => { delete mem[k]; },
      clear: () => { for (const k in mem) delete mem[k]; },
      key: i => Object.keys(mem)[i] || null,
      get length() { return Object.keys(mem).length; },
    };
    try { Object.defineProperty(window, 'localStorage', { value: shim, configurable: true }); } catch (e) {}
    try { console.error('localStorage is a no-op in this build - using the in-memory shim'); } catch (e) {}
  })();
  // ---- durable UI preferences ----
  // localStorage above is session-grade at best: the shim makes it in-memory on a broken
  // build, and even when it works it is wiped whenever ui-assets are re-extracted, which is
  // every app update. That is fine for a scroll position and NOT fine for a hand-collected
  // sound mute list. Anything a user would resent re-doing goes here instead, in prefs.json.
  //
  // The localStorage value is still the seed: on first load each key is migrated across, so
  // nobody loses what they already had, and the localStorage copy is kept in step so an older
  // launcher (no prefsLoad) still reads something sane.
  const rtxPrefs = Object.create(null);
  let _prefsReady = false, _prefsSaveT = 0, _prefsInitP = null;
  const PREF_DURABLE = ['rtxSoundMuted', 'rtxSoundVol', 'rtxOverlayCfg', 'rtxSceneView', 'rtxAuras', 'rtxAuraSeen', 'rtxAuraIcons',
                        'rtxUi', 'rtxHideName', 'rtxMetroLock', 'rtxWeNotify', 'rtxDwNotify'];
  function prefGet(key, def) {
    if (Object.prototype.hasOwnProperty.call(rtxPrefs, key)) return rtxPrefs[key];
    try { const s = localStorage.getItem(key); if (s !== null) return s; } catch (e) {}
    return def === undefined ? null : def;
  }
  function prefSet(key, val) {
    rtxPrefs[key] = String(val);
    try { localStorage.setItem(key, String(val)); } catch (e) {}   // keep the seed in step
    if (_prefsSaveT) return;
    _prefsSaveT = setTimeout(() => {
      _prefsSaveT = 0;
      try { if (bridge() && bridge().prefsSave) bridge().prefsSave(JSON.stringify(rtxPrefs)); } catch (e) {}
    }, 400);
  }
  async function prefsInit() {
    if (_prefsReady || !bridge() || !bridge().prefsLoad) return;
    let disk = null;
    try { const s = await bridge().prefsLoad(); const v = JSON.parse(s || '{}'); if (v && typeof v === 'object') disk = v; } catch (e) {}
    if (!disk) return;
    _prefsReady = true;
    let migrated = 0;
    for (const k of PREF_DURABLE) {
      // A value written THIS session (prefSet before the disk read finished) is newer than the
      // file; keep it and make sure it reaches the disk, instead of clobbering it with the old one.
      if (Object.prototype.hasOwnProperty.call(rtxPrefs, k)) { migrated++; continue; }
      if (Object.prototype.hasOwnProperty.call(disk, k)) { rtxPrefs[k] = disk[k]; continue; }
      // Not on disk yet: adopt whatever localStorage still holds, so an upgrade keeps it.
      try { const s = localStorage.getItem(k); if (s !== null) { rtxPrefs[k] = s; migrated++; } } catch (e) {}
    }
    // Push the migrated values back into localStorage too, so the panels that read it
    // directly at parse time (before this runs) see the durable value on the next start.
    for (const k in rtxPrefs) { try { localStorage.setItem(k, rtxPrefs[k]); } catch (e) {} }
    if (migrated) { try { if (bridge().prefsSave) bridge().prefsSave(JSON.stringify(rtxPrefs)); } catch (e) {} }
    // Anything read at parse time needs a nudge now that the durable value is in hand.
    try { sndApplyDurablePrefs(); } catch (e) {}
    try { ovApplyDurablePrefs(); } catch (e) {}
    try { sceneApplyDurablePrefs(); } catch (e) {}
    try { if (typeof auraApplyDurablePrefs === 'function') auraApplyDurablePrefs(); } catch (e) {}
    try { _uiCfg = null; uiApply(); const w = $('uisWrap'); if (w) w.remove(); } catch (e) {}
  }

  // =================== Preferences (rtxUi) ===================
  // One durable JSON blob for every user-facing preference that is not already owned by a
  // feature store (alerts and layout keep theirs). Read lazily, written through prefSet.
  const UI_DEF = { scale: 100, accent: '#8c6ffd', contrast: false, motion: true, opacity: 93,
                   restore: true, toastTtl: 5000, hideWorld: false, numFmt: 'compact', hiddenCats: [],
                   font: 'variable', fontSize: 13, tabular: false, compactTips: false,
                   barClock: false, bar24h: false, barSession: false, barXp: false };
  const UI_FONTS = [['Segoe UI Variable', 'variable', "'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif"],
                    ['Calibri', 'calibri', "Calibri, 'Segoe UI', sans-serif"],
                    ['Verdana', 'verdana', "Verdana, Geneva, sans-serif"],
                    ['Consolas', 'consolas', "Consolas, 'Cascadia Mono', monospace"]];
  const UI_ACCENTS = [['Violet', '#8c6ffd'], ['Blue', '#5b9cff'], ['Teal', '#2fd0c4'], ['Green', '#4dd28a'],
                      ['Amber', '#f5b241'], ['Red', '#ff6b6b'], ['Pink', '#ff7ac8'], ['Mono', '#c9cfdd']];
  let _uiCfg = null;
  function uiCfg() {
    if (_uiCfg) return _uiCfg;
    let v = null;
    try { v = JSON.parse(prefGet('rtxUi', '') || 'null'); } catch (e) {}
    _uiCfg = Object.assign({}, UI_DEF, (v && typeof v === 'object') ? v : {});
    if (!Array.isArray(_uiCfg.hiddenCats)) _uiCfg.hiddenCats = [];
    return _uiCfg;
  }
  function uiCfgSave() { prefSet('rtxUi', JSON.stringify(uiCfg())); }
  function uiHexMul(hex, m) {
    const h = String(hex || '').replace('#', ''); if (h.length !== 6) return hex;
    const c = [0, 2, 4].map(i => Math.max(0, Math.min(255, Math.round(parseInt(h.slice(i, i + 2), 16) * m))));
    return '#' + c.map(x => x.toString(16).padStart(2, '0')).join('');
  }
  function uiHexRgb(hex) {
    const h = String(hex || '').replace('#', ''); if (h.length !== 6) return '124,92,252';
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)).join(',');
  }
  let _uiScaleSent = -1;
  function uiApply() {
    const c = uiCfg(), r = document.documentElement.style;
    r.setProperty('--accent-hi', c.accent);
    r.setProperty('--accent', c.accent);
    r.setProperty('--accent-lo', uiHexMul(c.accent, 0.78));
    r.setProperty('--accent-rgb', uiHexRgb(c.accent));
    r.setProperty('--accent-ring', 'rgba(' + uiHexRgb(c.accent) + ',0.28)');
    const op = Math.max(0.3, Math.min(1, (Number(c.opacity) || 93) / 100));
    r.setProperty('--win-bg', 'rgba(12,14,20,' + op.toFixed(2) + ')');
    r.setProperty('--bar-bg', 'rgba(12,14,20,' + Math.min(1, op + 0.02).toFixed(2) + ')');
    document.documentElement.classList.toggle('hc', !!c.contrast);
    document.documentElement.classList.toggle('nomotion', !c.motion);
    document.documentElement.classList.toggle('tabnums', !!c.tabular);
    const fnt = UI_FONTS.find(f => f[1] === c.font) || UI_FONTS[0];
    r.setProperty('--font-ui', fnt[2]);
    const fs = Math.max(11, Math.min(17, Number(c.fontSize) || 13));
    r.setProperty('--font-size', fs + 'px');
    r.setProperty('--content-zoom', (fs / 13).toFixed(3));
    try { if (typeof wmRectsSoon === 'function') wmRectsSoon(); } catch (e) {}
    try { uiBarTick(); } catch (e) {}
    // UI scale rides the view's device scale (crisp text, correct input mapping); the
    // launcher multiplies it into its DPI sync. Older launchers lack the call: no-op.
    const sc = Math.max(50, Math.min(200, Number(c.scale) || 100));
    if (sc !== _uiScaleSent) {
      try { if (bridge() && bridge().uiScale) { bridge().uiScale(myPid(), sc / 100); _uiScaleSent = sc; } } catch (e) {}
      // The viewport changes size in CSS px: re-clamp windows and the bar, republish the
      // consume rects, and rebuild open panels so nothing sits stale from the old raster.
      setTimeout(() => { try { window.dispatchEvent(new Event('resize')); } catch (e) {} try { uiRepaintAll(); } catch (e) {} }, 120);
    }
  }
  function uiCatHidden(id) { return id !== 'Settings' && uiCfg().hiddenCats.indexOf(id) >= 0; }
  // Preferences "Numbers": panels format through toLocaleString() at hundreds of call sites,
  // so the preference is applied there. Compact mode abbreviates values from 100,000 up
  // (levels, kill counts and stack sizes below that stay exact); calls that pass a locale or
  // options are formatting deliberately and are left alone. Full mode is the native output.
  (function () {
    const native = Number.prototype.toLocaleString;
    Number.prototype.toLocaleString = function (loc, opt) {
      if (loc === undefined && opt === undefined && uiCfg().numFmt !== 'full') {
        const n = Number(this);
        if (isFinite(n) && Math.abs(n) >= 100000 && Math.floor(n) === n) {
          const a = Math.abs(n), sign = n < 0 ? '-' : '';
          if (a >= 1e9) return sign + (a / 1e9).toFixed(2) + 'b';
          if (a >= 1e6) return sign + (a / 1e6).toFixed(1) + 'm';
          let t = (a / 1e3).toFixed(1); if (t.endsWith('.0')) t = t.slice(0, -2);
          return sign + t + 'k';
        }
      }
      return native.call(this, loc, opt);
    };
  })();
