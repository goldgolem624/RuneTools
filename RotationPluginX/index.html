<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--
    Rotation Builder: build, validate, play back and share ability rotations.

    Fully self-contained (strict CSP; the host injects window.rtx.plugin). Data sources:
      cache.abilityConfigs  - every ability: tier, style, adrenaline gain/cost, cooldown ticks
      cache.sprite(id)      - the ability's own icon (sprite id == ability id)
      state.actionBar()     - the player's bars, for keybind hints on playback
      gameTick events       - real 600 ms server ticks driving synced playback

    UI notes, learned the hard way:
      * No native <select>: the engine draws option lists with system chrome (a white menu on a
        dark theme), so every dropdown here is a div-based menu.
      * Icon loads go through a QUEUE: cache.* is rate limited to 20 calls/s per plugin, and a
        200-tile palette fired in parallel tripped it, leaving most tiles blank. The queue keeps
        well under the cap and retries failures once.
      * Tooltips are one floating element positioned from JS: a per-tile CSS tooltip clips
        against the palette's own scrollbox.
      * HUD mode collapses the whole window to just the playback strip, so it can sit over the
        game like an overlay while the rotation steps.
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #14151c; --card: #1a1b23; --card2: #20222c; --line: rgba(255,255,255,0.07);
      --tx: #e8e8ef; --dim: #8b8b9e; --mute: #5a5a6e; --acc: #7c5cfc; --acc-hi: #9d83ff;
      --ok: #4dd28a; --warn: #f5b241; --err: #ff6b6b;
    }
    body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg);
           color: var(--tx); padding: 12px; font-size: 13px; }
    h1 { font-size: 1.05em; font-weight: 600; }
    .sub { color: var(--dim); font-size: 0.82em; margin: 2px 0 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 12px; margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    button { background: var(--card2); color: var(--tx); border: 1px solid var(--line);
             border-radius: 7px; padding: 6px 11px; font: inherit; font-size: 0.86em;
             font-weight: 600; cursor: pointer; }
    button:hover { border-color: var(--acc); }
    button.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
    button.primary:hover { background: #6b4fe0; }
    button.danger { color: var(--err); }
    button.tiny { padding: 2px 7px; font-size: 0.78em; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    input[type=text], textarea {
      background: var(--bg); color: var(--tx); border: 1px solid var(--line); border-radius: 7px;
      padding: 6px 9px; font: inherit; font-size: 0.9em; }
    input[type=text]:focus, textarea:focus { border-color: var(--acc); outline: none; }
    .lbl { color: var(--mute); font-size: 0.72em; font-weight: 700; letter-spacing: 0.1em;
           text-transform: uppercase; margin-bottom: 6px; }

    /* ---- themed dropdown (div-based; native <select> paints a white system menu) ---- */
    .dd { position: relative; display: inline-block; }
    .dd-btn { display: inline-flex; align-items: center; gap: 7px; min-width: 84px;
              max-width: 150px; justify-content: space-between; overflow: hidden;
              white-space: nowrap; text-overflow: ellipsis; }
    .dd-btn::after { content: ""; width: 0; height: 0; border-left: 4px solid transparent;
                     border-right: 4px solid transparent; border-top: 5px solid var(--dim); }
    .dd.open .dd-btn { border-color: var(--acc); }
    .dd-menu { display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 40;
               min-width: 100%; max-height: 220px; overflow-y: auto;
               background: #0f1016; border: 1px solid var(--line); border-radius: 8px;
               box-shadow: 0 10px 26px rgba(0,0,0,0.55); padding: 4px; }
    .dd.open .dd-menu { display: block; }
    .dd-it { padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.86em;
             white-space: nowrap; color: var(--tx); }
    .dd-it:hover { background: rgba(124,92,252,0.16); }
    .dd-it.on { color: var(--acc-hi); font-weight: 700; }

    /* ---- palette ---- */
    #pal { display: flex; flex-wrap: wrap; gap: 4px; max-height: 148px; overflow-y: auto;
           padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
    .ab { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line);
          background: var(--card2) center/26px no-repeat; cursor: pointer; position: relative;
          flex: none; }   /* NEVER shrinks: a squeezed row must wrap or scroll, not crush the icons */
    .ab:hover { border-color: var(--acc-hi); }
    .ab.noicon::after { content: attr(data-ab2); position: absolute; inset: 0;
                        display: flex; align-items: center; justify-content: center;
                        font-size: 10px; font-weight: 700; color: var(--dim); }
    .t2, .t3 { box-shadow: inset 0 0 0 1px rgba(245,178,65,0.55); }   /* threshold */
    .t4 { box-shadow: inset 0 0 0 1px rgba(255,107,107,0.6); }        /* ultimate */

    /* one floating tooltip, positioned from JS so scrollboxes cannot clip it */
    #tt { position: fixed; z-index: 90; display: none; pointer-events: none;
          background: #0c0d12; border: 1px solid var(--line); border-radius: 6px;
          padding: 6px 10px; font-size: 11px; color: var(--tx); max-width: 300px;
          box-shadow: 0 6px 18px rgba(0,0,0,0.5); white-space: pre-line; line-height: 1.45; }
    #tt b { color: var(--acc-hi); }

    /* ---- timeline ---- */
    #steps { display: flex; flex-direction: column; gap: 5px; max-height: 260px; overflow-y: auto; }
    .step { display: flex; align-items: center; gap: 8px; background: var(--card2);
            border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; cursor: pointer; }
    .step.sel { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
    .step.playnow { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
    .step .tickno { width: 66px; flex: none; font-variant-numeric: tabular-nums; }
    .step .tickno span { color: var(--mute); font-size: 0.78em; display: block; }
    .step .icons { display: flex; gap: 3px; flex-wrap: wrap; flex: 1; min-width: 0; }
    .step .icons .ab { width: 28px; height: 28px; background-size: 22px; }
    .step .icons .ab.rm:hover { border-color: var(--err); }
    .step .warns { display: flex; gap: 4px; flex: none; }
    .wpill { font-size: 0.72em; font-weight: 700; border-radius: 999px; padding: 2px 7px; }
    .wpill.adr { background: rgba(245,178,65,0.15); color: var(--warn); border: 1px solid rgba(245,178,65,0.4); }
    .wpill.cd  { background: rgba(255,107,107,0.15); color: var(--err); border: 1px solid rgba(255,107,107,0.4); }
    .wpill.ok  { background: rgba(77,210,138,0.12); color: var(--ok); border: 1px solid rgba(77,210,138,0.35); }
    .step .gap { display: flex; align-items: center; gap: 2px; flex: none; }
    .step input.note { flex: 0 1 110px; width: 110px; min-width: 44px; font-size: 0.8em; padding: 3px 7px; }

    /* ---- playback ---- */
    #play-strip { display: flex; align-items: center; gap: 14px; min-height: 76px; }
    #play-now { display: flex; gap: 5px; align-items: center; }
    #play-now .ab { width: 52px; height: 52px; background-size: 42px; border-color: var(--ok); cursor: default; }
    #play-now .key { position: absolute; bottom: -3px; right: -3px; background: #0c0d12;
                     border: 1px solid var(--line); border-radius: 4px; font-size: 12px;
                     padding: 1px 5px; color: var(--acc-hi); font-weight: 700; }
    #play-next { display: flex; gap: 4px; align-items: center; opacity: 0.7; }
    #play-next .ab { width: 30px; height: 30px; background-size: 24px; cursor: default; }
    #play-note { color: var(--warn); font-size: 0.9em; font-weight: 600; }
    #play-bar { height: 5px; background: var(--bg); border-radius: 999px; overflow: hidden;
                border: 1px solid var(--line); margin-top: 8px; }
    #play-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), var(--acc-hi)); }
    .stat { font-variant-numeric: tabular-nums; }
    .stat .k { color: var(--mute); font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.08em; display: block; }
    .stat .v { font-weight: 700; }
    #share-code, #import-code { width: 100%; height: 54px; resize: vertical; font-family: Consolas, monospace; font-size: 11px; }
    .muted { color: var(--mute); font-size: 0.78em; }

    /* (game overlay playback lives in a host-drawn floating strip; see hudPush) */
  </style>
</head>
<body>
  <div id="tt"></div>

  <div class="hud-hide" style="margin-bottom:10px">
    <h1 style="white-space:nowrap">Rotation Builder</h1>
    <div class="row" style="margin-top:8px">
      <span class="dd" id="dd-rot"></span>
      <button class="tiny" id="rot-new">New</button>
      <button class="tiny" id="rot-dup">Copy</button>
      <button class="tiny danger" id="rot-del">Delete</button>
    </div>
    <div class="sub" id="status" style="margin:6px 0 0">Connecting to host...</div>
  </div>

  <div class="card hud-hide">
    <div class="row" style="margin-bottom:8px">
      <input type="text" id="rot-name" class="grow" placeholder="Rotation name">
      <span class="muted">Start adren</span>
      <span class="dd" id="dd-adren"></span>
    </div>
    <div class="lbl">Timeline <span class="muted" style="text-transform:none;letter-spacing:0">(a row = one game tick, 0.6 s; several abilities on a row land the same tick)</span></div>
    <div id="steps"></div>
    <div class="row" style="margin-top:8px">
      <button class="tiny" id="step-add">+ Add tick (+3)</button>
      <button class="tiny" id="step-add1">+1 tick</button>
      <span class="muted grow" id="sim-sum"></span>
    </div>
  </div>

  <div class="card hud-hide">
    <div class="row" style="margin-bottom:8px">
      <input type="text" id="pal-q" class="grow" placeholder="Search abilities (click to add to the selected tick)">
      <span class="dd" id="dd-style"></span>
      <span class="dd" id="dd-tier"></span>
      <button class="tiny" id="pal-bars" title="Show only abilities on your action bars">My bars</button>
      <label class="muted" title="The cache tags some non-combat entries (teleports) as abilities; they are hidden unless checked"><input type="checkbox" id="pal-all"> All</label>
    </div>
    <div id="pal"></div>
  </div>

  <div class="card" id="play-card">
    <div class="row">
      <span class="lbl grow" style="margin:0">Playback</span>
      <button class="tiny" id="hud-btn" title="Show playback as a floating strip over the game itself (drag it anywhere; its x closes it)">Game overlay</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="primary" id="play-btn">Play</button>
      <button id="play-reset">Reset</button>
      <label class="muted"><input type="checkbox" id="play-loop"> Loop</label>
      <label class="muted"><input type="checkbox" id="play-sync" checked> Sync to game ticks</label>
      <button class="tiny hud-hide" id="keys-load" title="Read your action bars and badge each ability with its keybind">Load keybinds</button>
    </div>
    <div id="play-strip">
      <div class="stat"><span class="k">Tick</span><span class="v" id="pv-tick">0</span></div>
      <div id="play-now"></div>
      <div id="play-next"></div>
      <div class="grow"></div>
      <div class="stat"><span class="k">Adren</span><span class="v" id="pv-adr">0%</span></div>
      <div class="stat"><span class="k">Elapsed</span><span class="v" id="pv-el">0.0s</span></div>
    </div>
    <div id="play-note"></div>
    <div id="play-bar"><div id="play-fill"></div></div>
  </div>

  <div class="card hud-hide">
    <div class="lbl">Share</div>
    <div class="row" style="margin-bottom:6px">
      <button class="tiny" id="share-btn">Copy share code</button>
      <span class="muted">Anyone with RuneTools pastes the code below to import.</span>
    </div>
    <textarea id="share-code" readonly placeholder="Share code appears here"></textarea>
    <div class="row" style="margin:8px 0 6px">
      <button class="tiny" id="paste-btn" title="Read the code from your clipboard and import it">Paste &amp; import from clipboard</button>
      <button class="tiny" id="import-btn">Import the box below</button>
    </div>
    <textarea id="import-code" placeholder="Paste an RTXROT1 code here, then press Import"></textarea>
  </div>

<script>
(async function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const rp = () => window.rtx && window.rtx.plugin;

  // ---------------- themed dropdown ----------------
  // makeDrop(host, items [{v, label}], value, onPick) -> { set(v), get() }
  const allDrops = [];
  function makeDrop(host, items, value, onPick) {
    host.classList.add('dd');
    const btn = document.createElement('button'); btn.className = 'dd-btn tiny'; btn.type = 'button';
    const menu = document.createElement('div'); menu.className = 'dd-menu';
    host.appendChild(btn); host.appendChild(menu);
    let cur = value, its = items.slice();
    function paint() {
      const on = its.find(i => i.v === cur) || its[0];
      btn.textContent = on ? on.label : '';
      menu.innerHTML = '';
      for (const it of its) {
        const d = document.createElement('div');
        d.className = 'dd-it' + (it.v === cur ? ' on' : '');
        d.textContent = it.label;
        d.addEventListener('click', ev => { ev.stopPropagation(); cur = it.v; host.classList.remove('open'); paint(); onPick(cur); });
        menu.appendChild(d);
      }
    }
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      const was = host.classList.contains('open');
      for (const h of allDrops) h.classList.remove('open');
      if (!was) host.classList.add('open');
    });
    allDrops.push(host);
    paint();
    return { set(v) { cur = v; paint(); }, get() { return cur; },
             items(list) { its = list.slice(); if (!its.find(i => i.v === cur)) cur = its.length ? its[0].v : null; paint(); } };
  }
  document.addEventListener('click', () => { for (const h of allDrops) h.classList.remove('open'); });

  // ---------------- floating tooltip ----------------
  const tt = $('tt');
  function ttShow(text, x, y) {
    // First line renders bold (ability name); the rest as-is (white-space: pre-line).
    const nl = text.indexOf('\n');
    tt.innerHTML = '';
    const b = document.createElement('b');
    b.textContent = nl === -1 ? text : text.slice(0, nl);
    tt.appendChild(b);
    if (nl !== -1) tt.appendChild(document.createTextNode('\n' + text.slice(nl + 1)));
    tt.style.display = 'block';
    const r = tt.getBoundingClientRect();
    let lx = x + 12, ly = y - r.height - 10;
    if (lx + r.width > innerWidth - 4) lx = innerWidth - r.width - 4;
    if (ly < 4) ly = y + 16;
    tt.style.left = lx + 'px'; tt.style.top = ly + 'px';
  }
  function ttHide() { tt.style.display = 'none'; }
  document.addEventListener('mousemove', ev => {
    const ab = ev.target.closest ? ev.target.closest('.ab[data-tt]') : null;
    if (ab) ttShow(ab.dataset.tt, ev.clientX, ev.clientY); else ttHide();
  });
  document.addEventListener('mouseleave', ttHide);

  // ---------------- data: ability index + queued icons ----------------
  let AB = {};                 // abilityId -> { n, t, st, ag, ac, c }
  const ICONS = new Map();     // abilityId -> data URL ('' = confirmed none)
  const ICON_ELS = new Map();  // abilityId -> Set of elements awaiting the icon
  const iconQ = []; const iconQueued = new Set(); const iconFailed = new Map(); // id -> retries
  let iconBusy = 0;
  function applyIcon(id) {
    const url = ICONS.get(id); const els = ICON_ELS.get(id);
    if (!els) return;
    for (const el of els) if (el.isConnected) {
      if (url) { el.style.backgroundImage = 'url(' + url + ')'; el.classList.remove('noicon'); }
      else el.classList.add('noicon');
    }
    ICON_ELS.delete(id);
  }
  function pumpIcons() {
    // cache.* is limited to 20 calls/s per plugin and shares that budget with everything else
    // here, so keep icon traffic modest: 2 in flight, ~8/s.
    while (iconBusy < 2 && iconQ.length) {
      const id = iconQ.shift(); iconQueued.delete(id); iconBusy++;
      rp().cache.sprite(id).then(u => { ICONS.set(id, u || ''); applyIcon(id); })
        .catch(() => {
          const n = (iconFailed.get(id) || 0) + 1; iconFailed.set(id, n);
          if (n <= 2) setTimeout(() => requestIcon(id, null), 1500 * n);   // rate-limit backoff
          else { ICONS.set(id, ''); applyIcon(id); }
        })
        .finally(() => { iconBusy--; setTimeout(pumpIcons, 120); });
    }
  }
  function requestIcon(id, el) {
    if (el) {
      if (ICONS.has(id)) {
        const u = ICONS.get(id);
        if (u) el.style.backgroundImage = 'url(' + u + ')'; else el.classList.add('noicon');
        return;
      }
      if (!ICON_ELS.has(id)) ICON_ELS.set(id, new Set());
      ICON_ELS.get(id).add(el);
    }
    if (!ICONS.has(id) && !iconQueued.has(id)) { iconQueued.add(id); iconQ.push(id); }
    pumpIcons();
  }
  async function loadAbilities() {
    const cfgFn = rp().cache.abilityConfigs;
    if (!cfgFn) { $('status').textContent = 'This RuneTools version is too old for the ability index (update the client).'; return false; }
    const cfg = await cfgFn.call(rp().cache) || {};
    const byId = cfg._byId || {};
    for (const k in byId) {
      const r = byId[k] || {};
      AB[k | 0] = { n: r.n || ('#' + k), t: r.t | 0, st: r.st | 0, ag: r.ag | 0, ac: r.ac | 0, c: r.c | 0, l: r.l | 0 };
    }
    for (const name in cfg) {           // named records carry the cooldown more often
      if (name === '_byId') continue;
      const r = cfg[name] || {}; const id = r.i | 0;
      if (!id) continue;
      const t = AB[id] || (AB[id] = { n: name, t: r.t | 0, st: 0, ag: 0, ac: 0, c: 0 });
      t.n = name;
      if (r.t)  t.t = r.t | 0;
      if (r.st) t.st = r.st | 0;
      if (r.ag) t.ag = r.ag | 0;
      if (r.ac) t.ac = r.ac | 0;
      if (r.c)  t.c = r.c | 0;
      if (r.l)  t.l = r.l | 0;
    }
    return Object.keys(AB).length > 0;
  }
  let TIPS = {};   // abilityId -> [plain-text bullet, ...] (host-flattened game tooltips)
  async function loadTips() {
    try { if (rp().cache.abilityTips) TIPS = await rp().cache.abilityTips() || {}; } catch (e) {}
  }
  const TIER_TXT = { 0: 'Auto-attack', 1: 'Basic', 2: 'Threshold', 3: 'Threshold', 4: 'Ultimate', 5: 'Special', 7: 'Utility' };
  const costPct = a => { const c = a.ac | 0; return c > 120 ? Math.round(c / 10) : c; };
  const gainPct = a => (a.ag | 0) / 10;
  const reqPct  = a => (a.t === 2 || a.t === 3) ? Math.max(50, costPct(a)) : costPct(a);

  // ---------------- rotations model + storage ----------------
  let rots = [], cur = null, selStep = -1, dirty = null;
  const newId = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  function blankRot(name) { return { id: newId(), name: name || 'New rotation', adren0: 0, steps: [{ t: 0, a: [], n: '' }] }; }
  async function saveSoon() {
    clearTimeout(dirty);
    dirty = setTimeout(() => { rp().storage.set('rotations', rots).catch(() => {}); }, 800);
  }
  function sortSteps() { cur.steps.sort((x, y) => x.t - y.t); }

  // ---------------- adrenaline + cooldown simulation ----------------
  function simulate() {
    const out = []; if (!cur) return out;
    let adren = cur.adren0 | 0;
    const lastUse = {};
    for (const st of cur.steps) {
      const before = adren; let warnAdr = false; const warnCd = [];
      for (const id of st.a) {
        const a = AB[id]; if (!a) continue;
        if (before < reqPct(a)) warnAdr = true;
        if (lastUse[id] != null && a.c > 0 && (st.t - lastUse[id]) < a.c)
          warnCd.push(a.n + ' (' + ((a.c - (st.t - lastUse[id])) * 0.6).toFixed(1) + 's early)');
        lastUse[id] = st.t;
        adren = Math.max(0, Math.min(100, adren - costPct(a) + gainPct(a)));
      }
      out.push({ before, after: adren, warnAdr, warnCd });
    }
    return out;
  }

  // ---------------- share codes ----------------
  const b64u = { enc: s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
                 dec: s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))) };
  function exportCode(r) {
    const payload = [r.name, r.adren0 | 0, r.steps.map(s => [s.t, s.a, s.n || ''])];
    return 'RTXROT1.' + b64u.enc(JSON.stringify(payload));
  }
  function importCode(code) {
    const m = String(code || '').trim().match(/RTXROT1\.([A-Za-z0-9_\-]+)/);
    if (!m) throw new Error('Not an RTXROT1 code');
    const p = JSON.parse(b64u.dec(m[1]));
    if (!Array.isArray(p) || !Array.isArray(p[2])) throw new Error('Malformed code');
    const steps = p[2].slice(0, 300).map(s => ({
      t: Math.max(0, Math.min(9999, s[0] | 0)),
      a: (Array.isArray(s[1]) ? s[1] : []).slice(0, 8).map(x => x | 0).filter(x => x > 0),
      n: String(s[2] || '').slice(0, 60),
    })).sort((x, y) => x.t - y.t);
    return { id: newId(), name: String(p[0] || 'Imported rotation').slice(0, 48), adren0: (p[1] | 0) ? 100 : 0, steps };
  }

  // ---------------- keybinds ----------------
  let KEYS = {};
  // The action bar serves `key` as a human-readable STRING ("4", "F2"), not a VK code;
  // only the modifier is numeric.
  function keyLabel(key, mod) {
    const k = String(key == null ? '' : key).trim().toUpperCase().slice(0, 5);
    if (!k) return '';
    return (mod === 1 ? 'S+' : mod === 2 ? 'C+' : mod === 3 ? 'A+' : '') + k;
  }
  async function loadKeys() {
    try {
      const d = await rp().state.actionBar();
      KEYS = {};
      for (const bar of (d && d.bars) || [])
        for (const sl of bar.slots || [])
          if (sl.id > 0 && !KEYS[sl.id]) { const kl = keyLabel(sl.key, sl.mod | 0); if (kl) KEYS[sl.id] = kl; }
      $('status').textContent = Object.keys(KEYS).length + ' keybinds loaded from your action bars.';
      renderPlayback();
    } catch (e) { $('status').textContent = 'Could not read the action bars (log in first).'; }
  }

  // ---------------- rendering ----------------
  let ddRot, ddAdren, ddStyle, ddTier;
  function rotItems() { return rots.map(r => ({ v: r.id, label: r.name })); }
  function renderRotList() { ddRot.items(rotItems()); ddRot.set(cur ? cur.id : null); }
  function abEl(id, cls) {
    const d = document.createElement('div');
    d.className = 'ab ' + (cls || '');
    const a = AB[id];
    if (a) d.classList.add('t' + a.t);
    d.dataset.ab2 = a ? a.n.slice(0, 2) : '?';
    if (a) {
      let t = a.n + '\n' + (TIER_TXT[a.t] || '') +
              (a.c ? ' · ' + (a.c * 0.6).toFixed(1) + 's cooldown' : '') +
              (a.l ? ' · level ' + a.l : '') +
              (gainPct(a) ? ' · +' + gainPct(a) + '% adren' : '') +
              (costPct(a) ? ' · costs ' + costPct(a) + '% adren' : '');
      const lines = TIPS[String(id)];
      if (lines && lines.length) t += '\n' + lines.slice(0, 8).join('\n');
      d.dataset.tt = t;
    } else d.dataset.tt = 'Unknown ability #' + id;
    requestIcon(id, d);
    return d;
  }
  function renderSteps() {
    if (!cur) return;
    sortSteps();
    const sim = simulate();
    const root = $('steps'); root.innerHTML = '';
    cur.steps.forEach((st, i) => {
      const row = document.createElement('div');
      row.className = 'step' + (i === selStep ? ' sel' : '');
      row.addEventListener('click', () => { selStep = i; renderSteps(); });

      const tn = document.createElement('div'); tn.className = 'tickno';
      tn.innerHTML = '<b>t+' + st.t + '</b><span>' + (st.t * 0.6).toFixed(1) + 's</span>';
      row.appendChild(tn);

      const icons = document.createElement('div'); icons.className = 'icons';
      st.a.forEach((id, ai) => {
        const el = abEl(id, 'rm');
        el.dataset.tt = (el.dataset.tt || '') + ' · click to remove';
        el.addEventListener('click', ev => { ev.stopPropagation(); st.a.splice(ai, 1); renderSteps(); saveSoon(); });
        icons.appendChild(el);
      });
      if (!st.a.length) { const ph = document.createElement('span'); ph.className = 'muted'; ph.textContent = 'click an ability below'; icons.appendChild(ph); }
      row.appendChild(icons);

      const w = document.createElement('div'); w.className = 'warns';
      const sm = sim[i];
      if (sm) {
        if (sm.warnCd.length) { const p = document.createElement('span'); p.className = 'wpill cd'; p.textContent = 'CD'; p.title = 'On cooldown: ' + sm.warnCd.join(', '); w.appendChild(p); }
        if (sm.warnAdr) { const p = document.createElement('span'); p.className = 'wpill adr'; p.textContent = sm.before + '%'; p.title = 'Not enough adrenaline at this tick (' + sm.before + '%)'; w.appendChild(p); }
        else { const p = document.createElement('span'); p.className = 'wpill ok'; p.textContent = sm.after + '%'; p.title = 'Adrenaline after this tick'; w.appendChild(p); }
      }
      row.appendChild(w);

      const gap = document.createElement('div'); gap.className = 'gap';
      const mk = (txt, dt, title) => { const b = document.createElement('button'); b.className = 'tiny'; b.textContent = txt; b.title = title;
        b.addEventListener('click', ev => { ev.stopPropagation();
          const d0 = st.t; st.t = Math.max(0, st.t + dt);
          const shift = st.t - d0;
          for (const s2 of cur.steps) if (s2 !== st && s2.t >= d0 + (dt > 0 ? 0 : 1) && shift) s2.t = Math.max(0, s2.t + shift);
          renderSteps(); saveSoon(); });
        return b; };
      gap.appendChild(mk('-', -1, 'One tick earlier (later steps follow)'));
      gap.appendChild(mk('+', 1, 'One tick later (later steps follow)'));
      row.appendChild(gap);

      const note = document.createElement('input');
      note.type = 'text'; note.className = 'note'; note.placeholder = 'note';
      note.value = st.n || ''; note.maxLength = 60;
      note.addEventListener('click', ev => ev.stopPropagation());
      note.addEventListener('input', () => { st.n = note.value; saveSoon(); });
      row.appendChild(note);

      const del = document.createElement('button'); del.className = 'tiny danger'; del.textContent = 'x';
      del.title = 'Remove this tick';
      del.addEventListener('click', ev => { ev.stopPropagation(); cur.steps.splice(i, 1); if (selStep >= cur.steps.length) selStep = cur.steps.length - 1; renderSteps(); saveSoon(); });
      row.appendChild(del);
      root.appendChild(row);
    });
    const last = sim[sim.length - 1];
    const dur = cur.steps.length ? (cur.steps[cur.steps.length - 1].t + 3) : 0;
    $('sim-sum').textContent = cur.steps.length + ' ticks · ' + (dur * 0.6).toFixed(1) + 's' +
                               (last ? ' · ends at ' + last.after + '% adren' : '');
    renderShare();
  }
  let barIds = null;
  function renderPalette() {
    const q = $('pal-q').value.trim().toLowerCase();
    const styleF = ddStyle.get(), tierF = ddTier.get();
    const root = $('pal'); root.innerHTML = '';
    const ids = Object.keys(AB).map(Number).sort((a, b) => (AB[a].n < AB[b].n ? -1 : 1));
    let shown = 0;
    for (const id of ids) {
      const a = AB[id];
      if (a.t === 0) continue;
      // Combat relevance: the cache tags teleports and misc entries with ability tiers, but a
      // real basic GENERATES adrenaline and a real threshold/ultimate COSTS it. Utility (t7)
      // and specials (t5) pass as-is; "All" lifts the gate.
      if (!$('pal-all').checked) {
        const rel = (a.t === 1 && gainPct(a) > 0) || ((a.t === 2 || a.t === 3 || a.t === 4) && costPct(a) > 0) ||
                    a.t === 5 || a.t === 7;
        if (!rel) continue;
      }
      if (q && a.n.toLowerCase().indexOf(q) === -1) continue;
      if (styleF === 'melee' ? (a.st !== 1 && a.st !== 2) : (styleF && a.st !== (styleF | 0))) continue;
      if (tierF === '23' ? (a.t !== 2 && a.t !== 3) : (tierF && a.t !== (tierF | 0))) continue;
      if (barIds && !barIds.has(id)) continue;
      const el = abEl(id);
      el.addEventListener('click', () => {
        if (!cur) return;
        if (selStep < 0 || selStep >= cur.steps.length) selStep = cur.steps.length - 1;
        if (selStep < 0) { cur.steps.push({ t: 0, a: [], n: '' }); selStep = 0; }
        const st = cur.steps[selStep];
        if (st.a.length < 8 && st.a.indexOf(id) === -1) st.a.push(id);
        renderSteps(); saveSoon();
      });
      root.appendChild(el);
      if (++shown >= 220) break;
    }
    if (!shown) { const m = document.createElement('span'); m.className = 'muted'; m.textContent = 'No abilities match.'; root.appendChild(m); }
  }
  function renderShare() { if (cur) $('share-code').value = exportCode(cur); }

  // ---------------- playback ----------------
  let playing = false, pos = 0, playTimer = null, lastGameTick = null, gameTickAlive = 0;
  function stepAt(t) { return cur ? cur.steps.filter(s => s.t === t) : []; }
  function nextSteps(t, n) { return cur ? cur.steps.filter(s => s.t > t).slice(0, n) : []; }
  function renderPlayback() {
    if (!cur) return;
    const dur = cur.steps.length ? cur.steps[cur.steps.length - 1].t + 3 : 0;
    $('pv-tick').textContent = String(pos);
    $('pv-el').textContent = (pos * 0.6).toFixed(1) + 's';
    $('play-fill').style.width = dur ? Math.min(100, pos / dur * 100) + '%' : '0';
    const sim = simulate();
    let adr = cur.adren0 | 0, note = '';
    cur.steps.forEach((s, i) => { if (s.t <= pos && sim[i]) { adr = sim[i].after; if (s.t === pos && s.n) note = s.n; } });
    $('pv-adr').textContent = adr + '%';
    $('play-note').textContent = note;
    const now = $('play-now'); now.innerHTML = '';
    for (const s of stepAt(pos)) for (const id of s.a) {
      const el = abEl(id);
      if (KEYS[id]) { const k = document.createElement('span'); k.className = 'key'; k.textContent = KEYS[id]; el.appendChild(k); }
      now.appendChild(el);
    }
    if (!now.childElementCount) { const m = document.createElement('span'); m.className = 'muted'; m.textContent = playing ? '(wait)' : 'press Play'; now.appendChild(m); }
    const nx = $('play-next'); nx.innerHTML = '';
    for (const s of nextSteps(pos, 4)) {
      const sep = document.createElement('span'); sep.className = 'muted'; sep.textContent = '+' + (s.t - pos); nx.appendChild(sep);
      for (const id of s.a.slice(0, 3)) nx.appendChild(abEl(id));
    }
    const rows = $('steps').children;
    cur.steps.forEach((s, i) => { if (rows[i]) rows[i].classList.toggle('playnow', playing && s.t === pos); });
    hudPush(false);
  }
  function advance() {
    if (!cur || !playing) return;
    const dur = cur.steps.length ? cur.steps[cur.steps.length - 1].t + 3 : 0;
    pos++;
    if (pos >= dur) {
      if ($('play-loop').checked) pos = 0;
      else { setPlaying(false); pos = dur; }
    }
    renderPlayback();
  }
  function setPlaying(on) {
    playing = on;
    $('play-btn').textContent = on ? 'Pause' : 'Play';
    $('play-btn').classList.toggle('primary', !on);
    clearInterval(playTimer); playTimer = null;
    lastGameTick = null;
    if (on) {
      playTimer = setInterval(() => {
        const synced = $('play-sync').checked && (Date.now() - gameTickAlive) < 2000;
        if (!synced) advance();
      }, 600);
    }
    renderPlayback();
  }

  // ---------------- game overlay (host-drawn floating strip over the game) ----------------
  let hud = false, hudLast = 0;
  function setHud(on) {
    hud = on;
    $('hud-btn').classList.toggle('primary', on);
    if (!on) { try { rp().overlay.hudAbilities(null); } catch (e) {} }
    else hudPush(true);
  }
  function hudPush(force) {
    if (!hud || !cur) return;
    if (!rp().overlay.hudAbilities) { $('status').textContent = 'Game overlay needs a newer RuneTools client.'; hud = false; $('hud-btn').classList.remove('primary'); return; }
    const now = Date.now();
    if (!force && now - hudLast < 250) return;   // stay well under the overlay rate limit
    hudLast = now;
    const curIds = []; let note = '';
    for (const s of stepAt(pos)) { for (const id of s.a) curIds.push(id); if (s.n) note = s.n; }
    const nxt = [];
    for (const s of nextSteps(pos, 3)) for (const id of s.a.slice(0, 2)) nxt.push({ id, gap: s.t - pos });
    rp().overlay.hudAbilities({
      title: cur.name,
      sub: 'tick ' + pos + (note ? ' · ' + note : ''),
      cur: curIds.slice(0, 6).map(id => ({ id, key: KEYS[id] || '' })),
      next: nxt.slice(0, 6),
    }).catch(() => {});
  }

  // ---------------- events wiring ----------------
  function syncHeader() { $('rot-name').value = cur.name; ddAdren.set(cur.adren0 | 0); }
  $('rot-name').addEventListener('input', () => { if (cur) { cur.name = $('rot-name').value.slice(0, 48); renderRotList(); renderShare(); saveSoon(); } });
  $('rot-new').addEventListener('click', () => { cur = blankRot(); rots.push(cur); selStep = 0; renderRotList(); syncHeader(); renderSteps(); saveSoon(); });
  $('rot-dup').addEventListener('click', () => {
    if (!cur) return;
    const c = JSON.parse(JSON.stringify(cur)); c.id = newId(); c.name = cur.name + ' (copy)';
    rots.push(c); cur = c; renderRotList(); syncHeader(); renderSteps(); saveSoon();
  });
  $('rot-del').addEventListener('click', () => {
    if (!cur) return;
    // Deleting the last rotation leaves a fresh blank one rather than doing nothing.
    rots = rots.filter(r => r.id !== cur.id);
    if (!rots.length) rots.push(blankRot());
    cur = rots[0]; selStep = cur.steps.length - 1;
    renderRotList(); syncHeader(); renderSteps(); saveSoon();
  });
  $('step-add').addEventListener('click', () => { if (!cur) return;
    const t = cur.steps.length ? cur.steps[cur.steps.length - 1].t + 3 : 0;
    cur.steps.push({ t, a: [], n: '' }); selStep = cur.steps.length - 1; renderSteps(); saveSoon(); });
  $('step-add1').addEventListener('click', () => { if (!cur) return;
    const t = cur.steps.length ? cur.steps[cur.steps.length - 1].t + 1 : 0;
    cur.steps.push({ t, a: [], n: '' }); selStep = cur.steps.length - 1; renderSteps(); saveSoon(); });
  $('pal-q').addEventListener('input', renderPalette);
  $('pal-all').addEventListener('change', renderPalette);
  $('pal-bars').addEventListener('click', async () => {
    if (barIds) { barIds = null; $('pal-bars').classList.remove('primary'); renderPalette(); return; }
    try {
      const d = await rp().state.actionBar();
      barIds = new Set();
      for (const bar of (d && d.bars) || []) for (const sl of bar.slots || []) if (sl.id > 0) barIds.add(sl.id | 0);
      $('pal-bars').classList.add('primary'); renderPalette();
    } catch (e) { $('status').textContent = 'Could not read the action bars (log in first).'; }
  });
  $('play-btn').addEventListener('click', () => setPlaying(!playing));
  $('play-reset').addEventListener('click', () => { pos = 0; setPlaying(false); });
  $('keys-load').addEventListener('click', loadKeys);
  $('hud-btn').addEventListener('click', () => setHud(!hud));
  $('share-btn').addEventListener('click', async () => {
    if (!cur) return;
    renderShare();
    try { await rp().clipboard.copy($('share-code').value); $('status').textContent = 'Share code copied to clipboard.'; }
    catch (e) { $('status').textContent = 'Copy failed; select the code and copy it yourself.'; }
  });
  function doImport(text) {
    const r = importCode(text);
    rots.push(r); cur = r; selStep = cur.steps.length - 1;
    renderRotList(); syncHeader(); renderSteps(); saveSoon();
    const missing = new Set();
    for (const s of r.steps) for (const id of s.a) if (!AB[id]) missing.add(id);
    $('status').textContent = 'Imported "' + r.name + '"' + (missing.size ? ' (' + missing.size + ' unknown ability ids kept as placeholders)' : '') + '.';
  }
  $('paste-btn').addEventListener('click', async () => {
    // Keyboard paste is unreliable inside the in-game view, so the clipboard is read through
    // the host (clipboard.read scope, approved on enable).
    if (!rp().clipboard.paste) { $('status').textContent = 'Clipboard paste needs a newer RuneTools client; paste into the box below instead.'; return; }
    try { doImport(await rp().clipboard.paste()); }
    catch (e) { $('status').textContent = 'Import failed: ' + e.message; }
  });
  $('import-btn').addEventListener('click', () => {
    try {
      const r = importCode($('import-code').value);
      rots.push(r); cur = r; selStep = cur.steps.length - 1;
      renderRotList(); syncHeader(); renderSteps(); saveSoon();
      $('import-code').value = '';
      const missing = new Set();
      for (const s of r.steps) for (const id of s.a) if (!AB[id]) missing.add(id);
      $('status').textContent = 'Imported "' + r.name + '"' + (missing.size ? ' (' + missing.size + ' unknown ability ids kept as placeholders)' : '') + '.';
    } catch (e) { $('status').textContent = 'Import failed: ' + e.message; }
  });

  // ---------------- boot ----------------
  ddRot = makeDrop($('dd-rot'), [{ v: null, label: '...' }], null, v => {
    const r = rots.find(x => x.id === v);
    if (r) { cur = r; selStep = cur.steps.length - 1; pos = 0; setPlaying(false); syncHeader(); renderSteps(); renderPlayback(); }
  });
  ddAdren = makeDrop($('dd-adren'), [{ v: 0, label: '0%' }, { v: 100, label: '100%' }], 0, v => {
    if (cur) { cur.adren0 = v | 0; renderSteps(); saveSoon(); }
  });
  ddStyle = makeDrop($('dd-style'), [
    { v: '', label: 'All styles' }, { v: 'melee', label: 'Melee' }, { v: '3', label: 'Ranged' },
    { v: '4', label: 'Magic' }, { v: '29', label: 'Necromancy' }, { v: '5', label: 'Defence' },
    { v: '6', label: 'Constitution' },
  ], '', renderPalette);
  ddTier = makeDrop($('dd-tier'), [
    { v: '', label: 'All tiers' }, { v: '1', label: 'Basic' }, { v: '23', label: 'Threshold' },
    { v: '4', label: 'Ultimate' }, { v: '5', label: 'Special' }, { v: '7', label: 'Utility' },
  ], '', renderPalette);

  await rp().ready();
  const need = ['state.read', 'cache.read', 'storage', 'clipboard'];
  const missing = need.filter(s => !rp().hasScope(s));
  if (missing.length) { $('status').textContent = 'Missing permissions: ' + missing.join(', ') + '. Re-enable the plugin and approve them.'; }
  rp().ui.setHeight(860);
  if (!(await loadAbilities())) { $('status').textContent = 'Ability index unavailable (open a client and try again).'; }
  loadTips();
  const saved = await rp().storage.get('rotations').catch(() => null);
  rots = Array.isArray(saved) && saved.length ? saved : [blankRot('My first rotation')];
  cur = rots[0]; selStep = cur.steps.length - 1;
  renderRotList(); syncHeader(); renderSteps(); renderPalette(); renderPlayback();
  if (!missing.length) $('status').textContent = Object.keys(AB).length + ' abilities loaded. Click abilities to build; several on one row land the same tick.';

  rp().events.on('gameTick', ev => {
    gameTickAlive = Date.now();
    if (!playing || !$('play-sync').checked) return;
    if (lastGameTick != null && ev.tick !== lastGameTick) advance();
    lastGameTick = ev.tick;
  });
})();
</script>
</body>
</html>
